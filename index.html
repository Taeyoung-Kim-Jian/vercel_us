<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>종목 수익률 대시보드 (반응형 + 요약)</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','sans-serif'] }}}}
  </script>

  <!-- 스타일 -->
  <link rel="stylesheet" href="responsive_styles.css" />
</head>
<body class="bg-gray-50 min-h-screen font-sans p-4 sm:p-8 lg:p-12">
  <div class="max-w-7xl mx-auto bg-white p-6 sm:p-10 lg:p-12 rounded-xl shadow-2xl">
    <h1 class="text-3xl font-extrabold text-gray-900 mb-6 border-b pb-2">📊 종목 수익률 대시보드</h1>
    <p class="text-gray-500 mb-8">종목명을 클릭하면 아래에 해당 종목의 차트가 표시됩니다.</p>

    <!-- 요약 카드 -->
    <div id="summary-cards-container" class="mb-10"></div>

    <!-- 차트 영역 -->
    <div id="chart-container" class="mt-8" style="height: 400px; width: 100%;">
      <p class="text-gray-500 text-center py-8">종목을 클릭하여 차트를 로드하세요.</p>
    </div>

    <h2 class="text-2xl font-bold text-gray-800 mt-12 mb-4 pt-4 border-t">전체 종목 현황 (최신 20개 행 스크롤)</h2>
    <div id="data-container" class="table-wrapper text-center text-gray-600 p-8">데이터를 불러오는 중...</div>
  </div>

  <!-- Supabase JS SDK v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 앱 로직 -->
  <script defer src="app.js"></script>
</body>
</html>
