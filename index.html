<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ECONews - 수익률 & Supabase 연동</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <!-- (이전 header / card / swing table 부분 동일) -->
  <!-- 💹 전체 수익률 테이블 -->
  <section class="table-section">
    <div class="container">
      <h2>💰 전체 수익률</h2>
      <table class="data-table" id="total-table">
        <thead>
          <tr>
            <th>종목명</th>
            <th>매수가</th>
            <th>현재가</th>
            <th>수익률</th>
          </tr>
        </thead>
        <tbody id="total-table-body">
          <tr><td colspan="4">⏳ 데이터를 불러오는 중...</td></tr>
        </tbody>
      </table>
      <button class="more-btn" id="loadMoreBtn">더보기</button>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>© 2025 ECONews | 데이터 제공: Supabase | 문의: info@econews.kr</p>
    </div>
  </footer>

  <script>
    // ✅ Supabase 초기화
    const SUPABASE_URL = window.SUPABASE_URL || "{{ SUPABASE_URL }}";
    const SUPABASE_KEY = window.SUPABASE_KEY || "{{ SUPABASE_KEY }}";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ✅ 테이블 요소
    const tbody = document.getElementById('total-table-body');
    const loadMoreBtn = document.getElementById('loadMoreBtn');

    let allData = [];
    let showing = 5; // 기본 5개만

    // ✅ 데이터 가져오기
    async function loadTotalReturn() {
      const { data, error } = await supabase
        .from('total_return')
        .select('*')
        .order('수익률', { ascending: false });

      if (error) {
        console.error(error);
        tbody.innerHTML = `<tr><td colspan="4">❌ 데이터 불러오기 실패</td></tr>`;
        return;
      }

      allData = data;
      renderTable();
    }

    // ✅ 테이블 렌더링
    function renderTable() {
      tbody.innerHTML = '';
      allData.slice(0, showing).forEach(row => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${row.종목명 || '-'}</td>
          <td>${row.매수가?.toLocaleString() || '-'}</td>
          <td>${row.현재가?.toLocaleString() || '-'}</td>
          <td>${row.수익률 ? (row.수익률 > 0 ? '▲' : '▼') + row.수익률.toFixed(2) + '%' : '-'}</td>
        `;
        tbody.appendChild(tr);
      });
      if (allData.length <= showing) {
        loadMoreBtn.style.display = 'none';
      } else {
        loadMoreBtn.style.display = 'inline-block';
      }
    }

    // ✅ 더보기 버튼
    loadMoreBtn.addEventListener('click', () => {
      showing = showing === 5 ? allData.length : 5;
      loadMoreBtn.textContent = showing === 5 ? '더보기' : '접기';
      renderTable();
    });

    // ✅ 실행
    loadTotalReturn();
  </script>
</body>
</html>
