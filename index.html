<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>종목 수익률 대시보드 (ECharts)</title>

  <!-- Tailwind (선택) -->
  <script src="https://cdn.jsdelivr.net/npm/tailwindcss-cdn@3.4.1/tailwindcss.min.js"></script>

  <!-- 기본 스타일 -->
  <link rel="stylesheet" href="./responsive_styles.css" />
  <style>
    #chart { width: 100%; height: 420px; }
    table { width:100%; border-collapse: collapse; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #e5e7eb; }
    tr:hover { background:#f9fafb; }
    .clickable { cursor:pointer; text-decoration:underline; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen p-6">
  <div class="max-w-7xl mx-auto bg-white p-6 rounded-xl shadow">
    <h1 class="text-2xl font-bold mb-4">📊 종목 수익률 대시보드 (ECharts)</h1>
    <p class="text-gray-500 mb-6">종목명을 클릭하면 아래에 해당 종목의 차트가 표시됩니다.</p>

    <!-- 요약 카드 -->
    <div id="summary-cards" class="mb-8"></div>

    <!-- 차트 -->
    <div id="chart" class="mb-8 flex items-center justify-center text-gray-500">
      종목을 클릭하면 차트가 표시됩니다.
    </div>

    <!-- 리스트 -->
    <h2 class="text-xl font-semibold mb-2">전체 종목</h2>
    <div id="list">불러오는 중...</div>
  </div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- ✅ ECharts UMD (crossorigin 넣지 마세요) -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

  <!-- 앱 로직 -->
  <script src="./app.js"></script>
</body>
</html>
