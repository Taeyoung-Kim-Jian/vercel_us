<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>종목 수익률 대시보드</title>
    
    <!-- Tailwind CSS 로드 (깔끔한 디자인을 위해 사용) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <!-- 1. Supabase JS SDK 로드 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* 커스텀 스타일 및 테이블 기본 설정 */
        table {
            width: 100%;
            border-collapse: collapse;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden; /* 모서리 둥글게 처리 */
        }
        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb; /* Tailwind gray-200 */
        }
        th {
            background-color: #f3f4f6; /* Tailwind gray-100 */
            font-weight: 600;
            color: #1f2937; /* Tailwind gray-800 */
            text-transform: uppercase;
        }
        tr:hover {
            background-color: #f9fafb; /* Tailwind gray-50 hover */
        }
        .error {
            color: #ef4444; /* Tailwind red-500 */
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans p-4 sm:p-8">

    <div class="max-w-4xl mx-auto bg-white p-6 sm:p-10 rounded-xl shadow-2xl">
        
        <!-- 제목 및 로딩/데이터 컨테이너 -->
        <h1 class="text-3xl font-extrabold text-gray-900 mb-6 border-b pb-2">
            📊 Supabase 데이터 뷰어
        </h1>
        <p class="text-gray-500 mb-8">
            `total_return` 테이블에서 불러온 실시간 데이터입니다.
        </p>

        <!-- 2. 데이터가 로드될 컨테이너 (app.js가 내용을 채웁니다) -->
        <div id="data-container" class="text-center text-gray-600 p-8">
            데이터를 불러오는 중...
        </div>
    </div>
    
    <!-- 3. 데이터 로딩 로직을 담은 스크립트 파일 로드 -->
    <script src="app.js"></script>
</body>
</html>
