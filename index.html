<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 뷰포트 설정: 반응형 디자인의 필수 요소 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>종목 수익률 대시보드 (반응형)</title>
    
    <!-- Tailwind CSS 로드 및 기본 설정 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <!-- 1. 커스텀 반응형 스타일 CSS 파일 연결 -->
    <link rel="stylesheet" href="responsive_styles.css">

    <style>
        /* 기본 테이블 스타일 - Tailwind와 함께 사용 */
        table {
            border-collapse: collapse;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden; 
        }
        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }
        th {
            background-color: #f3f4f6;
            font-weight: 600;
            color: #1f2937;
            text-transform: uppercase;
        }
        tr:hover {
            background-color: #f9fafb;
        }
        .error {
            color: #ef4444;
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans p-4 sm:p-8">

    <div class="max-w-4xl mx-auto bg-white p-6 sm:p-10 rounded-xl shadow-2xl">
        
        <!-- 제목 및 설명 -->
        <h1 class="text-3xl font-extrabold text-gray-900 mb-6 border-b pb-2">
            📊 Supabase 데이터 뷰어 (반응형)
        </h1>
        <p class="text-gray-500 mb-8">
            모바일 환경에서는 테이블을 옆으로 스크롤하여 모든 데이터를 확인할 수 있습니다.
        </p>

        <!-- 2. 데이터가 로드될 컨테이너 (반응형 래퍼 클래스 적용) -->
        <!-- app.js가 이 div 안에 테이블을 삽입합니다. -->
        <div id="data-container" class="table-wrapper text-center text-gray-600 p-8">
            데이터를 불러오는 중...
        </div>
    </div>
    
    <!-- 3. Supabase JS SDK 로드 (app.js보다 먼저 로드되어야 합니다) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- 4. 데이터 로딩 및 테이블 생성 로직 파일 로드 -->
    <script src="app.js"></script>
</body>
</html>
