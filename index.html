<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 뷰포트 설정: 반응형 디자인의 필수 요소 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>종목 수익률 대시보드 (반응형 + 요약)</title>
    
    <!-- Tailwind CSS 로드 및 기본 설정 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <!-- Lightweight Charts 라이브러리 로드 (차트 생성에 필수, 중복 제거 후 하나만 남김) -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

    
    <!-- 1. 커스텀 반응형 스타일 CSS 파일 연결 (responsive_styles.css) -->
    <link rel="stylesheet" href="responsive_styles.css">

    <style>
        /* 기본 테이블 스타일 - Tailwind와 함께 사용 */
        table {
            border-collapse: collapse;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden; 
            width: 100%; /* 테이블이 컨테이너 폭을 꽉 채우도록 설정 */
        }
        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
            cursor: pointer; 
        }
        th {
            background-color: #f3f4f6;
            font-weight: 600;
            color: #1f2937;
            text-transform: uppercase;
        }
        tr:hover {
            background-color: #f9fafb;
        }
        .error {
            color: #ef4444;
            font-weight: bold;
        }
        /* 종목명 셀에 호버 효과 추가 */
        .clickable-stock:hover {
            text-decoration: underline;
            color: #1d4ed8; /* Blue-700 */
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans p-4 sm:p-8 lg:p-12">

    <!-- 최대 너비를 7xl로 확장하여 넓은 화면을 효율적으로 사용합니다. -->
    <div class="max-w-7xl mx-auto bg-white p-6 sm:p-10 lg:p-12 rounded-xl shadow-2xl">
        
        <!-- 제목 및 설명 -->
        <h1 class="text-3xl font-extrabold text-gray-900 mb-6 border-b pb-2">
            📊 종목 수익률 대시보드
        </h1>
        <p class="text-gray-500 mb-8">
            종목명을 클릭하면 아래에 해당 종목의 차트가 표시됩니다.
        </p>

        <!-- *** 최고/최저 수익률 5개 요약 카드 컨테이너 추가 *** -->
        <div id="summary-cards-container" class="mb-10">
            <!-- 요약 카드는 app.js에서 동적으로 채워집니다 -->
        </div>

        <!-- *** 차트 컨테이너 (app.js에서 여기에 차트를 그립니다) *** -->
        <div id="chart-container" class="mt-8">
            <p class="text-gray-500 text-center py-8">종목을 클릭하여 차트를 로드하세요.</p>
        </div>

        <h2 class="text-2xl font-bold text-gray-800 mt-12 mb-4 pt-4 border-t">
            전체 종목 현황 (최신 20개 행 스크롤)
        </h2>
        
        <!-- 데이터가 로드될 컨테이너 (반응형 래퍼 클래스 및 높이 제한 적용) -->
        <div id="data-container" class="table-wrapper text-center text-gray-600 p-8">
            데이터를 불러오는 중...
        </div>
        
    </div>
    
    <!-- 3. Supabase JS SDK 로드 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- 4. 데이터 로딩 및 테이블 생성 로직 파일 로드 -->
    <script src="app.js"></script>
</body>
</html>
