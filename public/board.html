<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SWING INVESTOR 게시판</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./common.js"></script>
  <script src="./auth.js"></script>

  <style>
    main {
      max-width: 960px;
      margin: 30px auto;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      padding: 25px;
    }
    h1 {
      text-align: center;
      font-size: 1.4rem;
      margin-bottom: 20px;
    }
    .tab-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab-bar button {
      border: none;
      background: #f1f5f9;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
      color: #555;
    }
    .tab-bar button.active {
      background: #2563eb;
      color: white;
      font-weight: 600;
    }

    .write-btn {
      display: block;
      margin: 0 auto 15px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      cursor: pointer;
    }
    .write-btn:hover { background: #1d4ed8; }

    /* 게시글 폼 */
    #postForm {
      display: none;
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 25px;
      background: #f9fafb;
    }
    #postForm input, #postForm textarea {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-top: 8px;
      padding: 8px;
      font-family: inherit;
    }
    #postForm button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 8px 14px;
      cursor: pointer;
      margin-top: 10px;
      font-weight: 500;
    }

    /* 테이블 */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }
    th, td {
      border-bottom: 1px solid #e5e7eb;
      padding: 10px 8px;
      text-align: center;
    }
    th {
      background: #f1f5f9;
      font-weight: 600;
    }
    tr:hover {
      background: #f9fafb;
    }
    .title {
      text-align: left;
      color: #2563eb;
      cursor: pointer;
    }

    /* 본문 / 댓글 */
    .post-content {
      display: none;
      background: #fafafa;
      border-left: 3px solid #2563eb;
      padding: 15px;
    }
    .comments { margin-top: 10px; border-top: 1px solid #e5e7eb; padding-top: 10px; }
    .comment { padding: 6px 0; border-bottom: 1px solid #f0f0f0; font-size: 0.9rem; }
    .comment .time { color: #9ca3af; font-size: 0.8rem; }
    .comment-form { display: flex; gap: 6px; margin-top: 8px; }
    .comment-form input {
      flex: 1; border: 1px solid #ccc; border-radius: 4px; padding: 6px;
    }
    .comment-form button {
      background: #2563eb; color: white; border: none; border-radius: 4px; padding: 6px 10px;
    }
  </style>
</head>
<body>
  <!-- ✅ 공통 헤더 -->
  <div id="header-container"></div>
  <script>
    fetch("./header.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("header-container").innerHTML = html;
        if (typeof SWINGINV_updateHeaderAuthUI === "function") SWINGINV_updateHeaderAuthUI();
      });
  </script>

  <main>
    <h1>💬 SWING INVESTOR 게시판</h1>

    <div class="tab-bar">
      <button class="tab active" data-type="notice">📢 공지사항</button>
      <button class="tab" data-type="free">💬 자유게시판</button>
      <button class="tab" data-type="idea">💡 아이디어</button>
    </div>

    <button id="writeBtn" class="write-btn">✏️ 글쓰기</button>

    <form id="postForm">
      <input type="text" id="title" placeholder="제목을 입력하세요" required />
      <textarea id="content" placeholder="내용을 입력하세요" required></textarea>
      <button type="submit">등록</button>
    </form>

    <div id="posts"></div>
  </main>

  <footer>© 2025 SWING INVESTOR | 데이터 제공: Supabase</footer>

  <script>
    let currentBoard = "notice";

    document.addEventListener("DOMContentLoaded", () => {
      const postForm = document.getElementById("postForm");
      const postsEl = document.getElementById("posts");
      const writeBtn = document.getElementById("writeBtn");

      writeBtn.addEventListener("click", () => {
        postForm.style.display = postForm.style.display === "none" ? "block" : "none";
      });

      document.querySelectorAll(".tab").forEach(tab => {
        tab.addEventListener("click", () => {
          document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
          tab.classList.add("active");
          currentBoard = tab.dataset.type;
          loadPosts();
        });
      });

      postForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const user = SWINGINV.user;
        if (!user) return alert("로그인 후 이용하세요.");

        const title = document.getElementById("title").value.trim();
        const content = document.getElementById("content").value.trim();
        if (!title || !content) return alert("제목과 내용을 입력하세요.");

        const { error } = await db.from("boards").insert([
          { board_type: currentBoard, user_id: user.id, title, content }
        ]);
        if (error) return alert("등록 실패: " + error.message);
        e.target.reset();
        postForm.style.display = "none";
        loadPosts();
      });

      async function loadPosts() {
        SWINGINV.showLoading(postsEl);
        const { data, error } = await db
          .from("boards")
          .select("id, title, created_at, views, comments(id)")
          .eq("board_type", currentBoard)
          .order("created_at", { ascending: false });

        if (error) return SWINGINV.showError(postsEl, "로드 실패: " + error.message);
        if (!data.length) return (postsEl.innerHTML = "<p>📭 게시물이 없습니다.</p>");

        let html = `
          <table>
            <thead><tr>
              <th>번호</th><th>제목</th><th>작성일</th><th>조회수</th><th>댓글</th>
            </tr></thead><tbody>
        `;

        data.forEach((p, i) => {
          html += `
            <tr class="post-row" data-id="${p.id}">
              <td>${i + 1}</td>
              <td class="title">${SWINGINV.esc(p.title)}</td>
              <td>${SWINGINV.fmtDate(p.created_at)}</td>
              <td>${p.views || 0}</td>
              <td>${p.comments?.length || 0}</td>
            </tr>
            <tr class="post-content" id="content-${p.id}">
              <td colspan="5" id="detail-${p.id}"></td>
            </tr>
          `;
        });
        html += "</tbody></table>";
        postsEl.innerHTML = html;

        document.querySelectorAll(".post-row").forEach(row => {
          row.addEventListener("click", () => togglePost(row.dataset.id));
        });
      }

      async function togglePost(id) {
        const contentRow = document.getElementById(`content-${id}`);
        const contentBox = document.getElementById(`detail-${id}`);
        const isVisible = contentRow.style.display === "table-row";

        document.querySelectorAll(".post-content").forEach(r => (r.style.display = "none"));
        if (isVisible) return (contentRow.style.display = "none");

        SWINGINV.showLoading(contentBox, "게시글 불러오는 중...");
        contentRow.style.display = "table-row";

        const { data, error } = await db
          .from("boards")
          .select("title, content, created_at, comments(*)")
          .eq("id", id)
          .single();
        if (error) return SWINGINV.showError(contentBox, error.message);

        const commentsHTML = (data.comments || []).map(
          c => `<div class="comment">💬 ${SWINGINV.esc(c.comment)}
                <span class="time">${SWINGINV.fmtDate(c.created_at)}</span></div>`
        ).join("");

        const commentForm = SWINGINV.user ? `
          <form class="comment-form" onsubmit="return addComment(${id}, this)">
            <input type="text" name="comment" placeholder="댓글 입력..." required />
            <button type="submit">등록</button>
          </form>` : "";

        contentBox.innerHTML = `
          <div>${SWINGINV.esc(data.content)}</div>
          <div class="comments">${commentsHTML}${commentForm}</div>
        `;
      }

      window.addComment = async function (postId, form) {
        const comment = form.comment.value.trim();
        if (!comment) return false;
        const user = SWINGINV.user;
        if (!user) return alert("로그인 후 이용하세요.");

        const { error } = await db
          .from("comments")
          .insert([{ board_id: postId, user_id: user.id, comment }]);
        if (error) alert("댓글 등록 실패: " + error.message);
        else form.reset();
        togglePost(postId);
        return false;
      };

      loadPosts();
    });
  </script>
</body>
</html>
