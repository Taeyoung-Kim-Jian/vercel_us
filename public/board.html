<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SWING INVESTOR 게시판</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./common.js"></script>
  <script src="./auth.js"></script>

  <style>
    body {
      font-family: "Noto Sans KR", sans-serif;
      background: #f9fafb;
      margin: 0;
      padding: 0;
    }
    header {
      background: #03c75a;
      color: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
    }
    .auth-area button {
      background: white;
      color: #03c75a;
      border: none;
      border-radius: 5px;
      padding: 5px 10px;
      cursor: pointer;
    }
    main {
      max-width: 960px;
      margin: 20px auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      padding: 20px;
    }
    h1 {
      text-align: center;
      font-size: 1.4rem;
      margin-bottom: 20px;
      color: #333;
    }
    .tab-bar {
      display: flex;
      justify-content: center;
      margin-bottom: 15px;
    }
    .tab-bar button {
      border: none;
      background: #eee;
      color: #555;
      padding: 8px 15px;
      margin: 0 5px;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }
    .tab-bar button.active {
      background: #03c75a;
      color: white;
      font-weight: 600;
    }

    /* 글 작성 */
    #postForm {
      background: #f9fafb;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 25px;
    }
    #postForm input, #postForm textarea {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-top: 6px;
      padding: 8px;
      font-family: inherit;
    }
    #postForm button {
      background: #03c75a;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 8px 14px;
      cursor: pointer;
      margin-top: 10px;
      font-weight: 500;
    }

    /* 리스트 스타일 */
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      border-bottom: 1px solid #e5e7eb;
      padding: 10px 8px;
      text-align: center;
      font-size: 0.95rem;
    }
    th {
      background: #f3f4f6;
      font-weight: 600;
    }
    tr:hover {
      background: #f9fafb;
    }
    .title {
      text-align: left;
      cursor: pointer;
      color: #0369a1;
    }

    /* 글 상세보기 */
    .post-content {
      display: none;
      padding: 10px 15px;
      background: #fafafa;
      border-left: 3px solid #03c75a;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }

    /* 댓글 */
    .comments {
      border-top: 1px solid #e5e7eb;
      padding-top: 10px;
      margin-top: 10px;
    }
    .comment {
      font-size: 0.9rem;
      padding: 5px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .comment .time {
      color: #9ca3af;
      font-size: 0.85rem;
    }
    .comment-form {
      display: flex;
      margin-top: 10px;
    }
    .comment-form input {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 5px;
    }
    .comment-form button {
      background: #03c75a;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 6px 10px;
      margin-left: 5px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <!-- ✅ 헤더 -->
  <header>
    <div class="logo" onclick="location.href='index.html'">SWING INVESTOR</div>
    <div class="auth-area">
      <span id="user-email">로그인 확인 중...</span>
      <button id="loginBtn" onclick="location.href='login.html'">로그인</button>
      <button id="logoutBtn" style="display:none;">로그아웃</button>
    </div>
  </header>

  <main>
    <h1>💬 SWING INVESTOR 게시판</h1>

    <div class="tab-bar">
      <button class="tab active" data-type="notice">📢 공지사항</button>
      <button class="tab" data-type="free">💬 자유게시판</button>
      <button class="tab" data-type="idea">💡 아이디어</button>
    </div>

    <form id="postForm">
      <input type="text" id="title" placeholder="제목을 입력하세요" required />
      <textarea id="content" placeholder="내용을 입력하세요" required></textarea>
      <button type="submit">등록</button>
    </form>

    <div id="posts"></div>
  </main>

  <script>
    const db = SWINGINV.db;
    let currentBoard = "notice";

    document.addEventListener("DOMContentLoaded", () => {
      const postForm = document.getElementById("postForm");
      const postsEl = document.getElementById("posts");

      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          document.querySelectorAll(".tab").forEach((b) => b.classList.remove("active"));
          tab.classList.add("active");
          currentBoard = tab.dataset.type;
          loadPosts();
        });
      });

      postForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const user = SWINGINV.user;
        if (!user) return alert("로그인 후 이용하세요.");

        const title = document.getElementById("title").value.trim();
        const content = document.getElementById("content").value.trim();
        if (!title || !content) return alert("제목과 내용을 입력하세요.");

        const { error } = await db.from("boards").insert([
          { board_type: currentBoard, user_id: user.id, title, content },
        ]);
        if (error) return alert("등록 실패: " + error.message);
        e.target.reset();
        loadPosts();
      });

      async function loadPosts() {
        SWINGINV.showLoading(postsEl);
        const { data, error } = await db
          .from("boards")
          .select("id, title, created_at, views, comments(id)")
          .eq("board_type", currentBoard)
          .order("created_at", { ascending: false });

        if (error) return SWINGINV.showError(postsEl, "로드 실패: " + error.message);
        if (!data.length) return (postsEl.innerHTML = "<p>📭 게시물이 없습니다.</p>");

        let html = `
          <table>
            <thead>
              <tr>
                <th>번호</th>
                <th>제목</th>
                <th>작성일</th>
                <th>조회수</th>
                <th>댓글</th>
              </tr>
            </thead>
            <tbody>
        `;

        data.forEach((p, i) => {
          html += `
            <tr class="post-row" data-id="${p.id}">
              <td>${i + 1}</td>
              <td class="title">${SWINGINV.esc(p.title)}</td>
              <td>${SWINGINV.fmtDate(p.created_at)}</td>
              <td>${p.views || 0}</td>
              <td>${p.comments?.length || 0}</td>
            </tr>
            <tr class="post-content" id="content-${p.id}">
              <td colspan="5" id="detail-${p.id}"></td>
            </tr>
          `;
        });

        html += "</tbody></table>";
        postsEl.innerHTML = html;

        document.querySelectorAll(".post-row").forEach((row) => {
          row.addEventListener("click", () => togglePost(row.dataset.id));
        });
      }

      async function togglePost(id) {
        const contentRow = document.getElementById(`content-${id}`);
        const contentBox = document.getElementById(`detail-${id}`);
        const isVisible = contentRow.style.display === "table-row";

        document.querySelectorAll(".post-content").forEach((r) => (r.style.display = "none"));
        if (isVisible) return (contentRow.style.display = "none");

        SWINGINV.showLoading(contentBox, "게시글 불러오는 중...");
        contentRow.style.display = "table-row";

        const { data, error } = await db
          .from("boards")
          .select("title, content, created_at, comments(*)")
          .eq("id", id)
          .single();

        if (error) return SWINGINV.showError(contentBox, error.message);

        const commentsHTML = (data.comments || [])
          .map(
            (c) => `
            <div class="comment">
              💬 ${SWINGINV.esc(c.comment)} 
              <span class="time">${new Date(c.created_at).toLocaleString()}</span>
            </div>`
          )
          .join("");

        const commentForm = SWINGINV.user
          ? `
            <form class="comment-form" onsubmit="return addComment(${id}, this)">
              <input type="text" name="comment" placeholder="댓글 입력..." required />
              <button type="submit">등록</button>
            </form>`
          : "";

        contentBox.innerHTML = `
          <div>${SWINGINV.esc(data.content)}</div>
          <div class="comments">${commentsHTML}${commentForm}</div>
        `;
      }

      window.addComment = async function (postId, form) {
        const comment = form.comment.value.trim();
        if (!comment) return false;
        const user = SWINGINV.user;
        if (!user) return alert("로그인 후 이용하세요.");

        const { error } = await db
          .from("comments")
          .insert([{ board_id: postId, user_id: user.id, comment }]);
        if (error) alert("댓글 등록 실패: " + error.message);
        else form.reset();
        togglePost(postId);
        return false;
      };

      loadPosts();
    });
  </script>
</body>
</html>
