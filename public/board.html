<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SWING INVESTOR 게시판</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./common.js"></script>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      max-width: 900px;
      margin: auto;
      padding: 20px;
      line-height: 1.6;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
    }
    .tab-bar {
      text-align: center;
      margin-bottom: 20px;
    }
    .tab-bar button {
      margin: 0 5px;
      padding: 8px 15px;
      border: none;
      border-radius: 6px;
      background: #eee;
      cursor: pointer;
    }
    .tab-bar button.active {
      background: #2563eb;
      color: #fff;
    }
    #postForm {
      margin-bottom: 25px;
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 6px;
      background: #fafafa;
    }
    #postForm input, #postForm textarea {
      width: 100%;
      margin-top: 6px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    #postForm button {
      margin-top: 10px;
      padding: 8px 14px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .post {
      border-bottom: 1px solid #e5e7eb;
      padding: 10px 0;
    }
    .post-title {
      font-weight: 600;
      cursor: pointer;
    }
    .time {
      color: #6b7280;
      font-size: 0.85em;
    }
    .comments {
      margin-left: 15px;
      margin-top: 5px;
      border-left: 2px solid #e5e7eb;
      padding-left: 10px;
    }
    .comment {
      font-size: 0.9em;
      margin: 5px 0;
    }
    .comment .time {
      color: #9ca3af;
    }
    .comment-form {
      margin-top: 10px;
    }
    .comment-form input {
      width: 80%;
      padding: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .comment-form button {
      padding: 5px 8px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 4px;
      margin-left: 5px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <!-- ✅ 공통 헤더 자동 로드 -->
  <div id="header-container"></div>
  <script>
    fetch("./header.html")
      .then((r) => r.text())
      .then((html) => {
        document.getElementById("header-container").innerHTML = html;
        if (typeof SWINGINV_updateHeaderAuthUI === "function") {
          SWINGINV_updateHeaderAuthUI();
        }
      });
  </script>

  <main>
    <h1>💬 SWING INVESTOR 게시판</h1>

    <!-- 게시판 탭 -->
    <div class="tab-bar">
      <button class="tab active" data-type="notice">📢 공지사항</button>
      <button class="tab" data-type="free">💬 자유게시판</button>
      <button class="tab" data-type="idea">💡 아이디어</button>
    </div>

    <!-- 게시글 작성 -->
    <form id="postForm">
      <input type="text" id="title" placeholder="제목을 입력하세요" required />
      <textarea id="content" placeholder="내용을 입력하세요" required></textarea>
      <button type="submit">등록</button>
    </form>

    <!-- 게시글 목록 -->
    <div id="posts"></div>
  </main>

  <footer style="text-align:center; color:#555; margin-top:40px;">
    © 2025 SWING INVESTOR | 데이터 제공: Supabase
  </footer>

  <script>
    const supabase = SWINGINV.db;
    let currentBoard = "notice";

    document.addEventListener("DOMContentLoaded", async () => {
      const postForm = document.getElementById("postForm");
      const postsEl = document.getElementById("posts");

      // 초기 로그인 상태 반영
      if (typeof SWINGINV_updateHeaderAuthUI === "function") {
        SWINGINV_updateHeaderAuthUI();
      }

      // 탭 전환
      document.querySelectorAll(".tab").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".tab").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          currentBoard = btn.dataset.type;
          loadPosts();
        });
      });

      // 게시글 등록
      postForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const title = document.getElementById("title").value.trim();
        const content = document.getElementById("content").value.trim();
        const user = SWINGINV.user;

        if (!user) return alert("로그인 후 이용 가능합니다.");
        if (!title) return alert("제목을 입력하세요.");

        const { error } = await supabase.from("boards").insert([
          { board_type: currentBoard, user_id: user.id, title, content },
        ]);
        if (error) alert("❌ 등록 실패: " + error.message);
        else {
          e.target.reset();
          loadPosts();
        }
      });

      // 게시글 목록 불러오기
      async function loadPosts() {
        SWINGINV.showLoading(postsEl);
        const { data, error } = await supabase
          .from("boards")
          .select("*, comments(*)")
          .eq("board_type", currentBoard)
          .order("created_at", { ascending: false });

        if (error) return SWINGINV.showError(postsEl, "로드 실패: " + error.message);
        if (!data.length) return (postsEl.innerHTML = "<p>📭 게시물이 없습니다.</p>");

        postsEl.innerHTML = data
          .map(
            (p) => `
            <div class="post">
              <div class="post-title">${SWINGINV.esc(p.title)}</div>
              <div class="time">${new Date(p.created_at).toLocaleString()}</div>
              <p>${SWINGINV.esc(p.content)}</p>
              <div class="comments">
                ${(p.comments || [])
                  .map(
                    (c) => `
                    <div class="comment">
                      💬 ${SWINGINV.esc(c.comment)} 
                      <span class="time">${new Date(c.created_at).toLocaleString()}</span>
                    </div>`
                  )
                  .join("")}
                ${
                  SWINGINV.user
                    ? `<form class="comment-form" onsubmit="return addComment(${p.id}, this)">
                        <input type="text" name="comment" placeholder="댓글 입력" required />
                        <button type="submit">등록</button>
                      </form>`
                    : ""
                }
              </div>
            </div>`
          )
          .join("");
      }

      // 댓글 등록
      window.addComment = async function (postId, form) {
        const comment = form.comment.value.trim();
        if (!comment) return false;
        const user = SWINGINV.user;
        if (!user) return alert("로그인 후 이용하세요.");

        const { error } = await supabase
          .from("comments")
          .insert([{ board_id: postId, user_id: user.id, comment }]);

        if (error) alert("댓글 등록 실패: " + error.message);
        else {
          form.reset();
          loadPosts();
        }
        return false;
      };

      // 로그인 상태 감시
      supabase.auth.onAuthStateChange((_event, session) => {
        SWINGINV.user = session?.user || null;
        if (typeof SWINGINV_updateHeaderAuthUI === "function") {
          SWINGINV_updateHeaderAuthUI();
        }
        loadPosts();
      });

      loadPosts();
    });
  </script>
</body>
</html>
