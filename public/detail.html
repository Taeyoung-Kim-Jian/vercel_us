<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>종목 상세 | SWING INVESTOR</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5"></script>
  <script src="./common.js"></script>

  <style>
    /* ✅ 상단 제목 + 버튼 */
    .page-header {
      position: relative;
      text-align: center;
      margin: 25px auto;
      max-width: 1000px;
    }
    .page-header h2 {
      font-size: 1.2rem;
      margin: 0;
      color: #1e293b;
    }
    .back-btn {
      position: absolute;
      top: 0;
      right: 0;
      font-size: 0.8rem;
      padding: 4px 8px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }
    .back-btn:hover { background: #1d4ed8; }



    /* ✅ 차트 스타일 */
    #chart {
      width: 100%;
      height: 600px;
      max-width: 1000px;
      margin: 0 auto 80px auto;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    /* ✅ 스크롤 정상화 */
    html, body {
      height: auto !important;
      overflow-y: auto !important;
    }

    main.content {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px;
      overflow-y: visible;
    }

    footer {
      text-align: center;
      padding: 16px;
      font-size: 0.8rem;
      color: #777;
      background: #f1f5f9;
      border-top: 1px solid #e5e7eb;
      margin-top: 50px;
    }
  </style>
</head>

<body>
  <!-- ✅ 공통 헤더 -->
  <div id="header-container"></div>
  <script>
    fetch("./header.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("header-container").innerHTML = html;
        if (typeof SWINGINV_updateHeaderAuthUI === "function")
          SWINGINV_updateHeaderAuthUI();
      });
  </script>

  <!-- ✅ 메인 컨텐츠 -->
  <main class="content">
    <section class="page-header">
      <h2 id="chart-title">📈 종목 상세</h2>
      <button class="back-btn" onclick="history.back()">←</button>
      <p id="chart-sub" style="color:#555;">데이터를 불러오는 중...</p>
    </section>

    <!-- 🔹 관심종목 등록 -->
    <div id="watchlist-box">
      <label>
        <input type="checkbox" id="watchlistToggle">
        ⭐ 관심종목 등록
      </label>
    </div>

    <!-- 🔹 차트 영역 -->
    <div id="chart"></div>

    <!-- 🔹 에러 박스 -->
    <div id="error-box" class="error-box" style="display:none;">
      <p>⚠️ 잘못된 접근입니다.<br>메인 페이지에서 종목을 선택해주세요.</p>
      <button class="back-btn" onclick="location.href='index.html'">메인으로 이동</button>
    </div>
  </main>

  <footer>© 2025 SWING INVESTOR | 데이터 제공: Supabase</footer>

  <!-- ✅ 상세 로직 -->
  <script src="./detail.js"></script>
</body>
</html>
