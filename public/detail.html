<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>종목 상세 | SWING INVESTOR</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5"></script>
  <script src="./common.js"></script>
</head>

<body>
  <!-- ✅ 공통 헤더 -->
  <div id="header-container"></div>
  <script>
    fetch("./header.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("header-container").innerHTML = html;
        if (typeof SWINGINV_updateHeaderAuthUI === "function")
          SWINGINV_updateHeaderAuthUI();
      });
  </script>

  <main class="content">
    <!-- 🔹 상단 제목 + 뒤로가기 버튼 -->
    <section class="page-header" style="position: relative;">
      <h2 id="chart-title" style="text-align:center;">📈 종목 상세</h2>
      <button class="back-btn"
        onclick="history.back()"
        style="
          position:absolute;
          top:0;
          right:0;
          font-size:0.8rem;
          padding:4px 8px;
          background:#2563eb;
          color:white;
          border:none;
          border-radius:6px;
          cursor:pointer;
        ">
        ←
      </button>
      <p id="chart-sub" style="text-align:center; color:#555;">데이터를 불러오는 중...</p>
    </section>

    <!-- 🔹 차트 영역 -->
    <div id="chart" style="
      width:100%;
      height:600px;
      max-width:1000px;
      margin:0 auto 100px auto;
      background:#fff;
      border-radius:10px;
      box-shadow:0 2px 6px rgba(0,0,0,0.05);
    "></div>

    <!-- 🔹 에러 박스 -->
    <div id="error-box" class="error-box" style="display:none;">
      <p>⚠️ 잘못된 접근입니다.<br>메인 페이지에서 종목을 선택해주세요.</p>
      <button class="back-btn" onclick="location.href='index.html'">메인으로 이동</button>
    </div>
  </main>

  <footer>© 2025 SWING INVESTOR | 데이터 제공: Supabase</footer>

  <script src="./detail.js"></script>
</body>
</html>
