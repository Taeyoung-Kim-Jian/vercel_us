<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>종목 상세 | SWING INVESTOR</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5"></script>
  <script src="./common.js"></script>
</head>
<body>
  <!-- ✅ 공통 헤더 -->
  <div id="header-container"></div>
  <script>
    fetch("./header.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("header-container").innerHTML = html;
        if (typeof SWINGINV_updateHeaderAuthUI === "function")
          SWINGINV_updateHeaderAuthUI();
      });
  </script>

  <main class="content">
    <!-- ✅ 중앙 제목 + 오른쪽 버튼 -->
    <section class="page-header"
      style="
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        max-width: 1000px;
        margin: 0 auto;
        text-align: center;
        padding: 10px 0;
      ">

      <!-- 중앙 제목 -->
      <div>
        <h2 id="chart-title" style="margin-bottom: 4px;">📈 종목 상세</h2>
        <p id="chart-sub" style="margin:0; color:#666; font-size:14px;">데이터를 불러오는 중...</p>
      </div>

      <!-- 오른쪽 끝 뒤로가기 -->
      <button class="back-btn" onclick="history.back()" 
        style="
          position: absolute;
          right: 10px;
          top: 50%;
          transform: translateY(-50%);
          background:#2563eb;
          color:white;
          border:none;
          border-radius:4px;
          padding:4px 8px;
          font-size:12px;
          cursor:pointer;
        ">
        ← 뒤로
      </button>
    </section>

    <div id="chart" style="height:500px; max-width:1000px; margin:20px auto;"></div>

    <div id="error-box" class="error-box" style="display:none;">
      <p>⚠️ 잘못된 접근입니다.<br>메인 페이지에서 종목을 선택해주세요.</p>
      <button class="back-btn" onclick="location.href='index.html'">메인으로 이동</button>
    </div>
  </main>

  <footer style="text-align:center; color:#666; padding:20px;">
    © 2025 SWING INVESTOR | 데이터 제공: Supabase
  </footer>

  <script src="./detail.js"></script>
</body>
</html>
