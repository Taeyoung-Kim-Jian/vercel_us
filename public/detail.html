<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>종목 상세 | SWING INVESTOR</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5"></script>
  <script src="./common.js"></script>

  <style>
    html, body {
      height: auto !important;
      overflow-y: auto !important;
      background: #f8fafc;
    }

    main.content {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px;
    }

    .page-header {
      text-align: center;
      margin: 25px 0;
      position: relative;
    }

    .page-header h2 {
      font-size: 1.2rem;
      margin: 0;
      color: #1e293b;
    }

    #toolbar {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      margin: 15px 0 25px 0;
      font-size: 14px;
    }

    #toolbar label {
      cursor: pointer;
    }

    #toolbar input[type="checkbox"] {
      transform: scale(1.1);
      margin-right: 5px;
    }

    #chart {
      width: 100%;
      height: 450px; /* ✅ PC에서 적절한 크기 */
      max-width: 1000px;
      margin: 0 auto 80px auto;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      touch-action: pan-y;
      pointer-events: auto;
      overflow: visible;
    }

    @media (max-width: 768px) {
      #chart {
        height: 300px; /* ✅ 모바일에서 자동 축소 */
      }
    }

    /* ✅ 뒤로가기 버튼 */
    #backBtn {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
    }
    #backBtn:hover { background: #1d4ed8; }

    footer {
      text-align: center;
      padding: 16px;
      font-size: 0.8rem;
      color: #777;
      background: #f1f5f9;
      border-top: 1px solid #e5e7eb;
      margin-top: 50px;
    }
  </style>
</head>

<body>
  <!-- ✅ 공통 헤더 -->
  <div id="header-container"></div>
  <script>
    fetch("./header.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("header-container").innerHTML = html;
        if (typeof SWINGINV_updateHeaderAuthUI === "function")
          SWINGINV_updateHeaderAuthUI();
      });
  </script>

  <main class="content">
    <!-- 🔹 상단 제목 -->
    <section class="page-header">
      <h2 id="chart-title">📈 종목 상세</h2>
      <p id="chart-sub" style="color:#555;">데이터를 불러오는 중...</p>
    </section>

    <!-- 🔹 툴바 (B가격 / 관심종목 등록) -->
    <div id="toolbar">
      <label><input type="checkbox" id="toggleB" checked> B가격 표시</label>
      <label><input type="checkbox" id="watchToggle"> ⭐ 관심종목 등록</label>
    </div>

    <!-- 🔹 차트 영역 -->
    <div id="chart"></div>

    <!-- 🔹 에러 박스 -->
    <div id="error-box" class="error-box" style="display:none;text-align:center;margin-top:30px;">
      <p>⚠️ 잘못된 접근입니다.<br>메인 페이지에서 종목을 선택해주세요.</p>
      <button onclick="location.href='index.html'" style="padding:6px 12px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;">메인으로 이동</button>
    </div>
  </main>

  <footer>© 2025 SWING INVESTOR | 데이터 제공: Supabase</footer>
  <script src="./detail.js"></script>
</body>
</html>
