<!-- ✅ SWING INVESTOR 공통 헤더 -->
<header id="site-header">
  <div class="header-top">
    <!-- 🔹 로고 -->
    <h1 class="logo" onclick="location.href='index.html'">
      <span class="logo-text">SWING INVESTOR</span>
    </h1>

    <!-- 🔹 로그인 영역 -->
    <div class="auth-area">
      <span id="user-email">로그아웃 중</span>
      <button id="loginBtn" class="btn-login" onclick="location.href='login.html'">로그인</button>
      <button id="logoutBtn" class="btn-logout" style="display:none;">로그아웃</button>
    </div>
  </div>

  <!-- 🔹 네비게이션 메뉴 (본문 폭 통일) -->
  <nav class="gnb">
  <div class="gnb-inner">
    <button onclick="location.href='index.html'">홈</button>
    <button onclick="location.href='proper.html'">스윙 종목</button>
    <button onclick="location.href='total.html'">전체 종목</button>
    <button onclick="location.href='month.html'">월별 성과</button>
    <button onclick="location.href='board.html'">게시판</button>
    <button onclick="location.href='ranking.html'">관심종목</button>
  </div>
</nav>
</header>

<!-- ✅ 스타일 -->
<style>
  #site-header {
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    position: sticky;
    top: 0;
    z-index: 100;
    font-family: "Noto Sans KR", "Segoe UI", Arial, sans-serif;
  }

  /* 상단 로고 + 로그인 영역 */
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px;
    max-width: 1100px; /* ✅ main.content와 동일 */
    margin: 0 auto;
  }

  .logo {
    font-size: 1rem;
    font-weight: 700;
    color: #1f2937;
    cursor: pointer;
    flex-shrink: 0;
  }

  /* 로그인/로그아웃 영역 */
  .auth-area {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    font-size: 13px;
    color: #374151;
    line-height: 1;
  }

  #user-email {
    display: flex;
    align-items: center;
    line-height: 1;
    margin-right: 2px;
    font-weight: 500;
  }

  /* 로그인 버튼 */
  .btn-login {
    color: #2563eb;
    border: 1px solid #2563eb;
    background: #f8fafc;
    border-radius: 5px;
    padding: 4px 8px;
    font-size: 12px;
    line-height: 1;
    display: flex;
    align-items: center;
  }

  .btn-login:hover {
    background: #eff6ff;
  }

  /* 로그아웃 버튼 */
  .btn-logout {
    color: #4b5563;
    border: 1px solid #d1d5db;
    background: #f9fafb;
    border-radius: 5px;
    padding: 4px 8px;
    font-size: 12px;
    line-height: 1;
    display: flex;
    align-items: center;
  }

  /* ✅ 메뉴 전체 영역 */
  .gnb {
    border-top: 1px solid #f3f4f6;
    background: #fafafa;
    overflow-x: auto;
    white-space: nowrap;
    scrollbar-width: none;
  }
  .gnb::-webkit-scrollbar { display: none; }

  /* ✅ 본문 폭과 동일한 내부 래퍼 */
  .gnb-inner {
    max-width: 1100px; /* ✅ 테이블과 동일 */
    margin: 0 auto;
    display: flex;
    justify-content: flex-start;
    gap: 12px;
    padding: 8px 16px; /* 좌우 여백 */
  }

  .gnb button {
    flex-shrink: 0;
    border: none;
    background: none;
    color: #374151;
    font-size: 13px;
    cursor: pointer;
    padding: 8px 10px;
    border-radius: 6px;
    transition: all 0.15s ease-in-out;
  }

  .gnb button:hover {
    color: #2563eb;
    background: #f1f5ff;
  }

  /* ✅ 현재 페이지 표시 (active) */
  .gnb button.active {
    color: #2563eb;
    font-weight: 600;
    background: #e8f0ff;
  }

  /* ✅ 반응형 (모바일 대응) */
  @media (max-width: 768px) {
    .header-top {
      padding: 6px 12px;
    }
    .logo { font-size: 0.95rem; }
    .auth-area {
      gap: 6px;
      font-size: 12px;
      flex-wrap: nowrap;
    }
    #user-email {
      max-width: 90px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .btn-login, .btn-logout {
      font-size: 11px;
      padding: 3px 6px;
    }
    .gnb-inner {
      gap: 8px;
      padding: 8px 12px;
    }
    .gnb button {
      font-size: 12px;
      padding: 6px 8px;
    }
  }
</style>

<!-- ✅ 로그인 상태 자동 반영 -->
<script>
  document.addEventListener("DOMContentLoaded", () => {
    if (typeof SWINGINV_updateHeaderAuthUI === "function") {
      SWINGINV_updateHeaderAuthUI();
    } else {
      console.warn("⚠️ Supabase 초기화 전 header.js 실행됨");
    }

    /* ✅ 현재 페이지 active 표시 */
    const currentPage = location.pathname.split("/").pop();
    document.querySelectorAll(".gnb button").forEach(btn => {
      const href = btn.getAttribute("onclick");
      if (href && href.includes(currentPage)) {
        btn.classList.add("active");
      }
    });
  });
</script>
