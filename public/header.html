<!-- ✅ SWING INVESTOR 통합 헤더 -->
<header id="site-header">
  <div class="header-top">
    <!-- 🔹 로고 -->
    <h1 class="logo" onclick="location.href='index.html'">
      <span class="logo-text">SWING INVESTOR</span>
    </h1>

    <!-- 🔹 로그인 영역 -->
    <div class="auth-area">
      <span id="user-email">로그아웃 중</span>
      <button id="loginBtn" class="btn-login" onclick="location.href='login.html'">로그인</button>
      <button id="logoutBtn" class="btn-logout" style="display:none;">로그아웃</button>
    </div>
  </div>

  <!-- 🔹 네비게이션 메뉴 -->
  <nav class="gnb">
    <div class="gnb-inner">
      <button onclick="location.href='index.html'">홈</button>
      <button onclick="location.href='proper.html'">스윙 종목</button>
      <button onclick="location.href='total.html'">전체 종목</button>
      <button onclick="location.href='month.html'">월별 성과</button>
      <button onclick="location.href='board.html'">게시판</button>
      <button onclick="location.href='ranking.html'">관심종목</button>
    </div>
  </nav>
</header>

<!-- ✅ 로그인 상태 갱신 스크립트 -->
<script>
  // 헤더 표시 갱신 함수
  window.SWINGINV_updateHeaderAuthUI = async function () {
    try {
      const { data: { user } } = await SWINGINV.db.auth.getUser();
      const emailSpan = document.getElementById("user-email");
      const loginBtn = document.getElementById("loginBtn");
      const logoutBtn = document.getElementById("logoutBtn");

      if (user) {
        const nickname = user.user_metadata?.nickname || user.email.split("@")[0];
        emailSpan.textContent = `${nickname} 님`;
        emailSpan.style.color = "#2563eb";
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-flex";
      } else {
        emailSpan.textContent = "로그아웃 중";
        emailSpan.style.color = "#374151";
        loginBtn.style.display = "inline-flex";
        logoutBtn.style.display = "none";
      }
    } catch (err) {
      console.error("❌ Header UI update failed:", err);
    }
  };

  // Supabase 로딩 대기 후 실행
  async function waitForSwingInv() {
    return new Promise((resolve) => {
      const check = () => {
        if (window.SWINGINV?.db) return resolve();
        setTimeout(check, 100);
      };
      check();
    });
  }

  document.addEventListener("DOMContentLoaded", async () => {
    await waitForSwingInv();
    console.log("🧭 Header: Supabase ready, updating UI...");
    await SWINGINV_updateHeaderAuthUI();
  });
</script>
