<!-- ✅ SWING INVESTOR 공통 헤더 -->
<header id="site-header">
  <div class="header-top">
    <h1 class="logo" onclick="location.href='index.html'">
      <span class="logo-text">SWING INVESTOR</span>
    </h1>

    <div class="auth-area">
      <span id="user-email">로그아웃 중</span>
      <button id="loginBtn" class="btn-login" onclick="location.href='login.html'">로그인</button>
      <button id="logoutBtn" class="btn-logout" style="display:none;">로그아웃</button>
    </div>
  </div>

  <nav class="gnb">
    <button onclick="location.href='index.html'">홈</button>
    <button onclick="location.href='proper.html'">스윙 종목</button>
    <button onclick="location.href='total.html'">전체 종목</button>
    <button onclick="location.href='month.html'">월별 성과</button>
    <button onclick="location.href='board.html'">게시판</button>
    <button onclick="location.href='ranking.html'">관심종목</button>
  </nav>
</header>

<!-- ✅ 스타일 -->
<style>
  #site-header {
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    position: sticky;
    top: 0;
    z-index: 100;
    font-family: "Noto Sans KR", "Segoe UI", Arial, sans-serif;
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 44px;
    padding: 0 16px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .logo {
    font-size: 0.95rem;
    font-weight: 700;
    color: #1f2937;
    cursor: pointer;
  }
  .auth-area {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #4b5563;
  }
  .btn-login {
    color: #2563eb;
    border: 1px solid #2563eb;
    background: #f8fafc;
    border-radius: 4px;
    padding: 3px 8px;
  }
  .btn-login:hover { background: #eff6ff; }
  .btn-logout {
    color: #6b7280;
    border: 1px solid #d1d5db;
    background: #f9fafb;
    border-radius: 4px;
    padding: 3px 8px;
  }
  .gnb {
    display: flex;
    justify-content: center;
    border-top: 1px solid #f3f4f6;
    background: #fafafa;
    overflow-x: auto;
    white-space: nowrap;
    scrollbar-width: none;
  }
  .gnb::-webkit-scrollbar { display: none; }
  .gnb button {
    flex-shrink: 0;
    padding: 9px 12px;
    border: none;
    background: none;
    color: #374151;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s ease-in-out;
  }
  .gnb button:hover {
    color: #2563eb;
    background: #f1f5ff;
  }
  @media (max-width: 768px) {
    .header-top { flex-direction: column; align-items: flex-start; }
    .auth-area { align-self: flex-end; font-size: 11px; }
    .gnb button { font-size: 12px; padding: 8px 10px; }
  }
</style>

<!-- ✅ 로그인 상태 자동 반영 -->
<script>
  document.addEventListener("DOMContentLoaded", () => {
    if (typeof SWINGINV_updateHeaderAuthUI === "function") {
      SWINGINV_updateHeaderAuthUI();
    } else {
      console.warn("⚠️ Supabase 초기화 전 header.js 실행됨");
    }
  });
</script>
