<!-- ✅ SWING INVESTOR 공통 헤더 -->
<header id="site-header">
  <div class="header-top">
    <h1 class="logo" onclick="location.href='index.html'">
      <span class="logo-text">SWING INVESTOR</span>
    </h1>

    <div class="auth-area">
      <span id="user-email">로그인 확인 중...</span>
      <button id="loginBtn" class="btn-login">로그인</button>
      <button id="logoutBtn" class="btn-logout" style="display:none;">로그아웃</button>
    </div>
  </div>

  <nav class="gnb">
    <button onclick="location.href='index.html'">홈</button>
    <button onclick="location.href='proper.html'">스윙 종목</button>
    <button onclick="location.href='total.html'">전체 종목</button>
    <button onclick="location.href='month.html'">월별 성과</button>
    <button onclick="location.href='watch.html'">관심종목</button>
    <button onclick="location.href='board.html'">게시판</button>
  </nav>
</header>

<!-- ✅ 로그인 / 회원가입 모달 -->
<div id="loginModal" class="modal hidden">
  <div class="modal-content">
    <span class="close-btn">&times;</span>
    <h3 id="modal-title">🔑 로그인</h3>

    <input type="email" id="modal-email" placeholder="이메일 주소" required />
    <input type="password" id="modal-password" placeholder="비밀번호 (6자 이상)" required />

    <button id="modal-submit">로그인</button>

    <p class="switch-mode">
      아직 계정이 없나요?
      <a href="#" id="switchToSignup">회원가입</a>
    </p>
  </div>
</div>

<style>
  /* =============================
     🌐 헤더 기본 구조
  ============================= */
  #site-header {
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    position: sticky;
    top: 0;
    z-index: 100;
    font-family: "Noto Sans KR", "Segoe UI", Arial, sans-serif;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 44px;
    padding: 0 16px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .logo {
    font-size: 1rem;
    font-weight: 700;
    color: #1f2937;
    cursor: pointer;
  }

  /* 🔐 로그인 영역 */
  .auth-area {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #4b5563;
  }

  .auth-area button {
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid #d1d5db;
    background: #f9fafb;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .btn-login {
    color: #2563eb;
    border-color: #2563eb;
    background: #f8fafc;
  }
  .btn-login:hover {
    background: #eff6ff;
  }

  .btn-logout {
    color: #6b7280;
  }

  /* 📋 메뉴 영역 */
  .gnb {
    display: flex;
    justify-content: center;
    border-top: 1px solid #f3f4f6;
    background: #fafafa;
    overflow-x: auto;
    white-space: nowrap;
    scrollbar-width: none;
  }

  .gnb::-webkit-scrollbar {
    display: none;
  }

  .gnb button {
    flex-shrink: 0;
    padding: 10px 12px;
    border: none;
    background: none;
    color: #374151;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s ease-in-out;
  }

  .gnb button:hover {
    color: #2563eb;
    background: #f1f5ff;
  }

  .gnb button.active {
    color: #1d4ed8;
    font-weight: 600;
    border-bottom: 2px solid #1d4ed8;
  }

  /* 📱 반응형 */
  @media (max-width: 768px) {
    .header-top {
      flex-direction: column;
      align-items: flex-start;
      height: auto;
      gap: 4px;
      padding: 8px 12px;
    }
    .auth-area {
      align-self: flex-end;
      font-size: 11px;
    }
    .gnb button {
      font-size: 12px;
      padding: 8px 10px;
    }
  }

  /* =============================
     🔐 로그인 모달
  ============================= */
  .modal {
    display: flex;
    justify-content: center;
    align-items: center;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    z-index: 1000;
  }
  .modal.hidden {
    display: none;
  }

  .modal-content {
    background: #fff;
    padding: 25px;
    border-radius: 10px;
    width: 300px;
    text-align: center;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
    position: relative;
  }

  .modal-content h3 {
    margin-bottom: 15px;
    color: #111827;
    font-size: 16px;
  }

  .modal-content input {
    width: 100%;
    padding: 8px;
    margin: 6px 0;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 13px;
  }

  .modal-content button {
    width: 100%;
    background: #2563eb;
    color: white;
    padding: 9px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    margin-top: 8px;
    cursor: pointer;
  }

  .modal-content button:hover {
    background: #1e40af;
  }

  .switch-mode {
    margin-top: 10px;
    font-size: 12px;
  }

  .switch-mode a {
    color: #2563eb;
    cursor: pointer;
    text-decoration: none;
    font-weight: 600;
  }

  .close-btn {
    position: absolute;
    top: 8px;
    right: 12px;
    cursor: pointer;
    font-size: 18px;
    color: #555;
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    if (typeof SWINGINV_updateHeaderAuthUI === "function") {
      SWINGINV_updateHeaderAuthUI();
    }
  });
</script>
