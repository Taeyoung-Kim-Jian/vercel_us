<!-- ✅ SWING INVESTOR 통합 헤더 -->
<header id="site-header">
  <div class="header-top">
    <!-- 🔹 로고 -->
    <h1 class="logo" onclick="location.href='index.html'">
      <span class="logo-text">SWING INVESTOR</span>
    </h1>

    <!-- 🔹 로그인 영역 -->
    <div class="auth-area">
      <span id="user-email">로그아웃 중</span>
      <button id="loginBtn" class="btn-login" onclick="location.href='login.html'">로그인</button>
      <button id="logoutBtn" class="btn-logout" style="display:none;">로그아웃</button>
    </div>
  </div>

  <!-- 🔹 네비게이션 메뉴 -->
  <nav class="gnb">
    <div class="gnb-inner">
      <button onclick="location.href='index.html'">홈</button>
      <button onclick="location.href='proper.html'">스윙 종목</button>
      <button onclick="location.href='total.html'">전체 종목</button>
      <button onclick="location.href='month.html'">월별 성과</button>
      <button onclick="location.href='board.html'">게시판</button>
      <button onclick="location.href='ranking.html'">관심종목</button>
    </div>
  </nav>
</header>

<!-- ✅ 스타일 -->
<style>
  /* ============================
     📘 HEADER 기본 구조
  ============================ */
  #site-header {
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    position: sticky;
    top: 0;
    z-index: 100;
    font-family: "Noto Sans KR", "Segoe UI", Arial, sans-serif;
  }

  /* 🔹 상단 영역 (로고 + 로그인) */
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px;
    max-width: 1100px;
    margin: 0 auto;
    flex-wrap: nowrap;
  }

  .logo {
    font-size: 1rem;
    font-weight: 700;
    color: #1f2937;
    cursor: pointer;
    flex-shrink: 0;
  }

  /* 🔹 로그인/로그아웃 영역 */
  .auth-area {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    font-size: 13px;
    color: #374151;
    line-height: 1;
  }

  #user-email {
    display: flex;
    align-items: center;
    line-height: 1;
    margin-right: 2px;
    font-weight: 500;
  }

  .btn-login {
    color: #2563eb;
    border: 1px solid #2563eb;
    background: #f8fafc;
    border-radius: 5px;
    padding: 4px 8px;
    font-size: 12px;
    line-height: 1;
    display: flex;
    align-items: center;
  }

  .btn-login:hover {
    background: #eff6ff;
  }

  .btn-logout {
    color: #4b5563;
    border: 1px solid #d1d5db;
    background: #f9fafb;
    border-radius: 5px;
    padding: 4px 8px;
    font-size: 12px;
    line-height: 1;
    display: flex;
    align-items: center;
  }

  /* ============================
     📗 NAV (모든 페이지 공통)
  ============================ */
  .gnb {
    border-top: 1px solid #f3f4f6;
    background: #fafafa;
  }

  .gnb-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 22px; /* ✅ 메뉴 간격 통일 */
    padding: 10px 0;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  .gnb-inner::-webkit-scrollbar {
    display: none;
  }

  .gnb-inner button {
    flex-shrink: 0;
    border: none;
    background: none;
    color: #374151;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s ease-in-out;
  }

  .gnb-inner button:hover {
    color: #2563eb;
    background: #f1f5ff;
    border-radius: 6px;
    padding: 6px 10px;
  }

  /* ✅ 반응형 */
  @media (max-width: 768px) {
    .header-top {
      padding: 6px 12px;
    }

    .logo {
      font-size: 0.95rem;
    }

    .auth-area {
      gap: 6px;
      font-size: 12px;
      flex-wrap: nowrap;
    }

    #user-email {
      max-width: 90px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-login,
    .btn-logout {
      font-size: 11px;
      padding: 3px 6px;
    }

    .gnb-inner {
      gap: 14px;
      padding: 8px 0;
    }

    .gnb-inner button {
      font-size: 13px;
    }
  }
</style>

<!-- ✅ 로그인 상태 자동 반영 -->
<script>
  document.addEventListener("DOMContentLoaded", () => {
    if (typeof SWINGINV_updateHeaderAuthUI === "function") {
      SWINGINV_updateHeaderAuthUI();
    } else {
      console.warn("⚠️ Supabase 초기화 전 header.js 실행됨");
    }
  });
</script>
<script>
  // ------------------------------------------------------------
  // ✅ 헤더 로그인 상태 갱신 함수
  // ------------------------------------------------------------
  window.SWINGINV_updateHeaderAuthUI = async function () {
    try {
      const { data: { user } } = await SWINGINV.db.auth.getUser();
      const emailSpan = document.getElementById("user-email");
      const loginBtn = document.getElementById("loginBtn");
      const logoutBtn = document.getElementById("logoutBtn");

      if (user) {
        // ✅ 로그인 상태
        const nickname = user.user_metadata?.nickname || user.email.split("@")[0];
        emailSpan.textContent = `${nickname} 님`;
        emailSpan.style.color = "#2563eb";
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-flex";
      } else {
        // ❌ 로그아웃 상태
        emailSpan.textContent = "로그아웃 중";
        emailSpan.style.color = "#374151";
        loginBtn.style.display = "inline-flex";
        logoutBtn.style.display = "none";
      }
    } catch (err) {
      console.error("❌ Header UI update failed:", err);
    }
  };

  // ------------------------------------------------------------
  // ✅ 페이지 로드 시 즉시 실행
  // ------------------------------------------------------------
  document.addEventListener("DOMContentLoaded", () => {
    SWINGINV_updateHeaderAuthUI();
  });
</script>
