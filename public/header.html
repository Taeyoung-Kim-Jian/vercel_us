<!-- ================================
     ✅ SWING INVESTOR 헤더
================================ -->
<header id="site-header">
  <!-- 상단 로고 + 로그인 영역 -->
  <div class="header-top">
    <h1 class="logo" onclick="location.href='index.html'">
      SWING INVESTOR
    </h1>

    <div class="auth-area">
      <span id="user-email">로그아웃 중</span>
      <button id="loginBtn" class="btn-login" onclick="location.href='login.html'">로그인</button>
      <button id="logoutBtn" class="btn-logout" style="display:none;">로그아웃</button>
    </div>
  </div>

  <!-- 하단 네비게이션 메뉴 -->
  <nav class="gnb">
    <div class="gnb-inner">
      <button onclick="location.href='index.html'">🏠 홈</button>
      <button onclick="location.href='proper.html'">📊 스윙 종목</button>
      <button onclick="location.href='total.html'">📈 전체 종목</button>
      <button onclick="location.href='month.html'">📅 월별 성과</button>
      <button onclick="location.href='board.html'">💬 게시판</button>
      <button onclick="location.href='ranking.html'">⭐ 관심종목</button>
    </div>
  </nav>
</header>

<style>
  /* ===============================
     헤더 기본 스타일
  ================================ */
  #site-header {
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
    position: sticky;
    top: 0;
    z-index: 100;
    font-family: "Noto Sans KR", "Segoe UI", Arial, sans-serif;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .logo {
    font-size: 1rem;
    font-weight: 700;
    color: #1f2937;
    cursor: pointer;
  }

  .auth-area {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #374151;
  }

  .btn-login, .btn-logout {
    border-radius: 5px;
    padding: 4px 8px;
    font-size: 12px;
    cursor: pointer;
  }

  .btn-login {
    color: #2563eb;
    border: 1px solid #2563eb;
    background: #f8fafc;
  }
  .btn-login:hover { background: #eff6ff; }

  .btn-logout {
    color: #4b5563;
    border: 1px solid #d1d5db;
    background: #f9fafb;
  }
  .btn-logout:hover { background: #f3f4f6; }

  /* ===============================
     메뉴
  ================================ */
  .gnb {
    border-top: 1px solid #f3f4f6;
    background: #fafafa;
  }

  .gnb-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    gap: 22px;
    padding: 10px 0;
    flex-wrap: nowrap;
    overflow-x: auto; /* 모바일 스크롤 */
    -webkit-overflow-scrolling: touch; /* 스무스 스크롤 */
  }

  .gnb-inner::-webkit-scrollbar { display: none; }

  .gnb-inner button {
    border: none;
    background: none;
    color: #374151;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s ease-in-out;
    flex-shrink: 0; /* 버튼 줄어들지 않도록 */
  }

  .gnb-inner button:hover {
    color: #2563eb;
    background: #f1f5ff;
    border-radius: 6px;
    padding: 6px 10px;
  }

  /* ===============================
     모바일 전용
  ================================ */
  @media (max-width: 768px) {
    .header-top { padding: 6px 12px; }
    .logo { font-size: 0.95rem; }
    .auth-area { gap: 6px; font-size: 12px; }
    .btn-login, .btn-logout { font-size: 11px; padding: 3px 6px; }

    .gnb-inner { justify-content: flex-start; }
  }
</style>

<script>
  console.log("🧭 Header script initialized (Session-Safe)");

  async function waitForSwingInv() {
    return new Promise((resolve) => {
      const check = () => {
        if (window.SWINGINV?.db) return resolve();
        setTimeout(check, 100);
      };
      check();
    });
  }

  document.addEventListener("DOMContentLoaded", async () => {
    await waitForSwingInv();
    console.log("✅ Header ready — Supabase 연결 확인됨");
    if (typeof SWINGINV_updateHeaderAuthUI === "function") {
      SWINGINV_updateHeaderAuthUI();
    }
  });
</script>
