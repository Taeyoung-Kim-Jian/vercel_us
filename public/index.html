<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SWING INVESTOR Dashboard</title>
</head>

<body>
  <!-- ✅ HEADER -->
  <div id="header-container"></div>
  <script>
    fetch("./header.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("header-container").innerHTML = html;
        if (typeof SWINGINV_updateHeaderAuthUI === "function") SWINGINV_updateHeaderAuthUI();
      });
  </script>

  <main class="content">
    <!-- 🏆 Top5 Cards -->
    <section class="cards">
      <div id="top5-card" class="card">📈 데이터 불러오는 중...</div>
      <div class="card">📊 수익률 2</div>
      <div class="card">📈 수익률 3</div>
      <div class="card">📉 수익률 4</div>
    </section>

    <!-- 🧾 전체 수익률 테이블 -->
    <div class="table-wrap">
      <h3>📈 전체 수익률</h3>
      <table>
        <thead>
          <tr><th>종목명</th><th>시작가격</th><th>현재가격</th><th>수익률</th></tr>
        </thead>
        <tbody id="total-table-body">
          <tr><td colspan="4">데이터를 불러오는 중...</td></tr>
        </tbody>
      </table>
      <button id="loadMoreTotalBtn">더보기</button>
    </div>

    <!-- 💰 스윙 적정가격 테이블 -->
    <div class="table-wrap">
      <h3>💰 스윙 적정가격</h3>
      <table>
        <thead>
          <tr><th>종목명</th><th>적정매수가</th><th>현재가</th><th>괴리율</th></tr>
        </thead>
        <tbody id="swing-table-body">
          <tr><td colspan="4">데이터를 불러오는 중...</td></tr>
        </tbody>
      </table>
      <button id="loadMoreSwingBtn">더보기</button>
    </div>
  </main>

  <footer>© 2025 SWING INVESTOR | 데이터 제공: Supabase</footer>

  <!-- ===============================
       ⚡ MAIN.JS 통합
  ================================== -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      console.log("🚀 main.js v4.6 loaded");

      const totalBody = document.getElementById("total-table-body");
      const swingBody = document.getElementById("swing-table-body");
      const cards = document.querySelectorAll(".card");
      const loadMoreTotalBtn = document.getElementById("loadMoreTotalBtn");
      const loadMoreSwingBtn = document.getElementById("loadMoreSwingBtn");

      SWINGINV.showLoading(totalBody);
      SWINGINV.showLoading(swingBody);

      const PAGE_SIZE = 5;
      let totalPage = 0;
      let swingPage = 0;
      let totalData = [];
      let swingData = [];

      const renderTop5 = (card, title, data, field = "수익률") => {
        if (!data?.length) {
          card.innerHTML = `<h4>${title}</h4><div style="text-align:center;padding:20px;">데이터 없음</div>`;
          return;
        }
        card.innerHTML = `
          <h4>${title}</h4>
          <ul class="top5-list">
            ${data.slice(0, 5).map((r, i) => {
              const value = parseFloat(r[field] ?? r.측정일대비수익률 ?? 0) || 0;
              const color = value >= 0 ? "#dc2626" : "#2563eb";
              const sign = value >= 0 ? "▲" : "▼";
              return `
                <li>
                  <span class="rank">${i + 1}.</span>
                  <div class="top5-content">
                    <span class="clickable-name" data-code="${r.종목코드 || ""}" data-name="${r.종목명 || ""}">
                      ${SWINGINV.esc(r.종목명)}
                    </span>
                    <span class="rate" style="color:${color}">${sign}${Math.abs(value).toFixed(2)}%</span>
                  </div>
                </li>`;
            }).join("")}
          </ul>`;
      };

      try {
        const [
          totalRes,
          watchRes,
          monthAllRes,
          swingRes
        ] = await Promise.all([
          SWINGINV.db.from("total_return").select("종목명, 종목코드, 시작가격, 현재가격, 수익률").order("수익률", { ascending: false }),
          SWINGINV.db.from("watchlist_with_return").select("종목명, 종목코드, 수익률").eq("공개여부", true).order("수익률", { ascending: false }).limit(5),
          SWINGINV.db.from("monthly_performance_view").select("종목명, 종목코드, 측정일대비수익률, 월구분").order("측정일대비수익률", { ascending: false }).limit(5),
          SWINGINV.db.from("swing_proper_view").select("종목명, 종목코드, 적정매수가, 현재가, 괴리율").order("괴리율", { ascending: true })
        ]);

        totalData = totalRes.data || [];
        const watchData = watchRes.data || [];
        const monthAll = monthAllRes.data || [];
        swingData = swingRes.data || [];

        renderTop5(cards[0], "📈 전체 수익률 Top5", totalData, "수익률");
        renderTop5(cards[1], "⭐ 관심종목 수익률 Top5", watchData, "수익률");

        const sorted = [...monthAll].sort((a,b) => (parseFloat(b.측정일대비수익률) || 0) - (parseFloat(a.측정일대비수익률)||0));
        renderTop5(cards[2], "🌍 기준가 수익률 Top5", sorted, "측정일대비수익률");

        const now = new Date();
        const ym = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-01`;
        const monthLabel = `${now.getMonth()+1}월`;

        try {
          const { data: monthNow, error: monthErr } = await SWINGINV.db.from("monthly_performance_view").select("종목명, 종목코드, 측정일대비수익률, 월구분").eq("월구분", ym).order("측정일대비수익률",{ascending:false}).limit(5);
          if(monthErr){ console.error(monthErr); renderTop5(cards[3], `📆 ${monthLabel} 수익률 Top5`, []); }
          else renderTop5(cards[3], `📆 ${monthLabel} 수익률 Top5`, monthNow, "측정일대비수익률");
        } catch(err){ console.error(err); renderTop5(cards[3], `📆 ${monthLabel} 수익률 Top5`, []); }

        // 전체 수익률 테이블
        const renderTotalPage = () => {
          const start = totalPage*PAGE_SIZE;
          const end = start+PAGE_SIZE;
          const pageData = totalData.slice(start,end);
          const rows = pageData.map(r => `
            <tr>
              <td class="clickable-name" data-code="${r.종목코드}" data-name="${r.종목명}">${SWINGINV.esc(r.종목명)}</td>
              <td>${SWINGINV.nf(r.시작가격)}</td>
              <td>${SWINGINV.nf(r.현재가격)}</td>
              <td>${SWINGINV.fmtPct(r.수익률)}</td>
            </tr>`).join("");
          if(totalPage===0) totalBody.innerHTML=rows;
          else totalBody.insertAdjacentHTML("beforeend", rows);
          totalPage++;
          if(end>=totalData.length) loadMoreTotalBtn.style.display="none";
        };
        renderTotalPage();
        loadMoreTotalBtn.addEventListener("click",()=>{location.href="total.html"});

        // 스윙 적정가 테이블
        const renderSwingPage = () => {
          const start = swingPage*PAGE_SIZE;
          const end = start+PAGE_SIZE;
          const pageData = swingData.slice(start,end);
          const rows = pageData.map(r=>`
            <tr>
              <td class="clickable-name" data-code="${r.종목코드}" data-name="${r.종목명}">${SWINGINV.esc(r.종목명)}</td>
              <td>${SWINGINV.nf(r.적정매수가)}</td>
              <td>${SWINGINV.nf(r.현재가)}</td>
              <td>${SWINGINV.fmtPct(r.괴리율)}</td>
            </tr>`).join("");
          if(swingPage===0) swingBody.innerHTML=rows;
          else swingBody.insertAdjacentHTML("beforeend",rows);
          swingPage++;
          if(end>=swingData.length) loadMoreSwingBtn.style.display="none";
        };
        renderSwingPage();
        loadMoreSwingBtn.addEventListener("click",()=>{location.href="proper.html"});

      } catch(err){
        console.error(err);
        SWINGINV.showError(totalBody,"전체 수익률 데이터를 불러오지 못했습니다.");
        SWINGINV.showError(swingBody,"스윙 적정가격 데이터를 불러오지 못했습니다.");
      }
    });
  </script>
</body>
</html>
