<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SWING INVESTOR Dashboard</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./common.js"></script>

  <style>
    /* ✅ 카드 영역 (네이버 스타일) */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 20px;
      margin: 30px 0 50px;
    }

    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      transition: all 0.25s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    }

    /* ✅ 첫 번째 카드 전용 (Top5 수익률 카드 스타일) */
    #top5-card {
      display: flex;
      flex-direction: column;
    }

    #top5-card h4 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #111827;
    }

    #top5-card ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    #top5-card li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #f3f4f6;
      font-size: 14px;
    }

    #top5-card li:last-child {
      border-bottom: none;
    }

    .top5-rank {
      font-weight: 600;
      color: #2563eb;
      width: 35px;
    }

    .top5-name {
      flex-grow: 1;
      color: #111827;
    }

    .top5-return {
      font-weight: 600;
    }

    .top5-return.up { color: #dc2626; }
    .top5-return.down { color: #2563eb; }

    /* ✅ 나머지 카드 (심플 + 네이버형 그림자) */
    .cards .card:not(#top5-card) {
      text-align: left;
    }

    .cards .card:not(#top5-card)::before {
      content: "📊";
      display: inline-block;
      font-size: 18px;
      margin-right: 6px;
    }

    .cards .card:not(#top5-card) {
      font-size: 15px;
      color: #374151;
      line-height: 1.5;
    }

    .cards .card:not(#top5-card):hover {
      background: #f9fafb;
    }

    /* ✅ 테이블 스타일 (기존 유지) */
    .table-wrap {
      margin-top: 40px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      padding: 20px;
    }

    .table-wrap h3 {
      font-size: 1.1rem;
      color: #111827;
      margin-bottom: 15px;
      border-left: 4px solid #2563eb;
      padding-left: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    thead { background: #f1f5f9; }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid #e5e7eb;
      text-align: center;
    }

    tbody tr:hover { background: #f9fafb; }

    button {
      display: block;
      margin: 15px auto 0;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover { background: #1e3a8a; }

    footer {
      text-align: center;
      color: #6b7280;
      margin: 50px 0 30px;
    }
  </style>
</head>

<body>
  <!-- ✅ 공통 헤더 -->
  <div id="header-container"></div>
  <script>
    fetch("./header.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("header-container").innerHTML = html;
        if (typeof SWINGINV_updateHeaderAuthUI === "function") SWINGINV_updateHeaderAuthUI();
      });
  </script>

  <main class="content">
    <!-- 🏆 수익률 Top 5 -->
    <section class="cards">
      <div id="top5-card" class="card">📈 데이터 불러오는 중...</div>
      <div class="card">📊 수익률 2</div>
      <div class="card">📈 수익률 3</div>
      <div class="card">📉 수익률 4</div>
    </section>

    <!-- 🧾 전체 수익률 -->
    <div class="table-wrap">
      <h3>📈 전체 수익률</h3>
      <table>
        <thead>
          <tr>
            <th>종목명</th><th>시작가격</th><th>현재가격</th><th>수익률</th>
          </tr>
        </thead>
        <tbody id="total-table-body">
          <tr><td colspan="4">데이터를 불러오는 중...</td></tr>
        </tbody>
      </table>
      <button id="loadMoreTotalBtn">더보기</button>
    </div>

    <!-- 💰 스윙 적정가격 -->
    <div class="table-wrap">
      <h3>💰 스윙 적정가격</h3>
      <table>
        <thead>
          <tr>
            <th>종목명</th><th>적정매수가</th><th>현재가</th><th>괴리율</th>
          </tr>
        </thead>
        <tbody id="swing-table-body">
          <tr><td colspan="4">데이터를 불러오는 중...</td></tr>
        </tbody>
      </table>
      <button id="loadMoreSwingBtn">더보기</button>
    </div>
  </main>

  <footer>© 2025 SWING INVESTOR | 데이터 제공: Supabase</footer>

  <!-- ✅ total_return Top5 불러오기 -->
  <script>
    const supabase = SWINGINV.db;

    async function loadTop5FromTotalReturn() {
      const el = document.getElementById("top5-card");
      el.textContent = "⏳ 불러오는 중...";

      try {
        const { data, error } = await supabase
          .from("total_return")
          .select("종목명, 수익률")
          .not("수익률", "is", null)
          .order("수익률", { ascending: false })
          .limit(5);

        if (error) throw error;
        if (!data || data.length === 0) {
          el.textContent = "📭 total_return 데이터가 없습니다.";
          return;
        }

        el.innerHTML = `
          <h4>🏆 수익률 Top 5</h4>
          <ul>
            ${data
              .map(
                (row, i) => `
                  <li>
                    <span class="top5-rank">${i + 1}위</span>
                    <span class="top5-name">${SWINGINV.esc(row["종목명"])}</span>
                    <span class="top5-return ${row["수익률"] >= 0 ? "up" : "down"}">
                      ${row["수익률"] >= 0 ? "+" : ""}${row["수익률"].toFixed(2)}%
                    </span>
                  </li>
                `
              )
              .join("")}
          </ul>
        `;
      } catch (e) {
        el.textContent = "❌ 불러오기 실패: " + (e?.message || e);
      }
    }

    document.addEventListener("DOMContentLoaded", loadTop5FromTotalReturn);
  </script>

  <script src="./main.js"></script>
</body>
</html>
