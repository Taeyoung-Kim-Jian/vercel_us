<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SWING INVESTOR Dashboard</title>

  <!-- ===============================
       🌐 STYLE.CSS 통합
  ================================== -->
  <style>
    /* ===============================
       🌐 GLOBAL BASE STYLE
    ================================= */
    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f9fafb;
      color: #333;
      margin: 0;
      padding: 0;
    }

    /* ===============================
       🧭 HEADER (상단 고정)
    ================================= */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #1e3a8a;
      color: white;
      border-bottom: 1px solid #e5e7eb;
      padding: 0.8rem 1rem;
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      overflow-x: auto; /* 화면 작을 때 스크롤 */
    }
    .logo {
      font-size: 1rem;
      font-weight: 700;
      color: white;
      cursor: pointer;
    }
    .login-btn button {
      background: white;
      color: #1e3a8a;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 500;
    }
    .login-btn button:hover { background: #e2e8f0; }

    /* ===============================
       🗂️ NAV MENU
    ================================= */
    .sub-menu {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .sub-menu::-webkit-scrollbar { display: none; }
    .sub-menu-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 16px;
    }
    .sub-menu ul {
      display: flex;
      gap: 18px;
      list-style: none;
      margin: 0;
      padding: 10px 0;
      white-space: nowrap;
      justify-content: flex-start;
    }
    .sub-menu li {
      font-size: 0.9rem;
      font-weight: 500;
      color: #444;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: 0.2s;
    }
    .sub-menu li.active { color: #1e40af; border-bottom: 2px solid #1e40af; }
    .sub-menu li:hover { color: #1e3a8a; }

    /* ===============================
       🧱 CONTENT LAYOUT
    ================================= */
    main.content {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 16px 100px;
      overflow-y: auto;
    }

    /* ===============================
       💳 CARD SECTION
    ================================= */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
      margin: 10px 0 10px;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      transition: all 0.25s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      background: #fafafa;
    }
    .card h4 {
      font-size: 15px;
      font-weight: 700;
      margin: 10px 0;
      color: #111827;
      text-align: center;
    }

    .top5-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .top5-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #f3f4f6;
      font-size: 14px;
    }
    .top5-list li:last-child { border-bottom: none; }

    .rank {
      font-weight: 600;
      color: #2563eb;
      width: 30px;
      text-align: center;
    }
    .top5-content {
      display: flex;
      flex-direction: column;
    }
    .rate {
      font-weight: 600;
      min-width: 70px;
      text-align: right;
    }

    /* ===============================
       📊 TABLE
    ================================= */
    .table-wrap {
      width: 100%;
      margin: 20px 0;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 10px;
      color: #1f2937;
    }
    thead {
      background-color: #f1f5f9 !important;
      color: #111827 !important;
      font-weight: 600;
      border-bottom: 2px solid #2563eb;
    }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid #e5e7eb;
      white-space: nowrap;
      text-align: center;
      vertical-align: middle;
    }
    .number-cell { text-align: right !important; }
    tbody tr:hover { background-color: #f9fafb; transition: background 0.2s; }
    .clickable-row { cursor: pointer; transition: background 0.2s; }
    .clickable-row:hover { background: #f1f5f9; }

    /* ===============================
       ⚙️ BUTTON
    ================================= */
    button {
      padding: 6px 12px;
      font-size: 10px;
      font-weight: 500;
      border: 1px solid #ccc;
      border-radius: 6px;
      background-color: #f8f8f8;
      color: #333;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button:hover { background-color: #e2e8f0; border-color: #999; }
    button.active { background-color: #2563eb; color: #fff; border-color: #2563eb; }

    /* ===============================
       📱 MOBILE TOP5 LAYOUT
    ================================= */
    @media (max-width: 600px) {
      .top5-list li {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: flex-start;
        gap: 12px;
        padding: 6px 0;
      }
      .top5-content {
        flex-direction: column;
      }
      .rate { min-width: auto; text-align: left; margin-top: 2px; }
    }

  </style>
</head>

      <table>

      </table>

    </div>
  </main>

  <footer>© 2025 SWING INVESTOR | 데이터 제공: Supabase</footer>
