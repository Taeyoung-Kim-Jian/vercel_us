<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ECONews - 수익률 대시보드</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <!-- ===============================
       🧭 HEADER
  ================================ -->
  <header class="header">
    <div class="container header-inner">
      <div class="logo">ECONews</div>
      <nav class="nav">
        <a href="#">경제</a>
        <a href="#">증시</a>
        <a href="#">해외</a>
        <a href="#">분석</a>
      </nav>
    </div>
  </header>

  <!-- ===============================
       📈 수익률 카드
  ================================ -->
  <section class="cards">
    <div id="top5-card" class="card">데이터 불러오는 중...</div>
    <div class="card">수익률 2</div>
    <div class="card">수익률 3</div>
    <div class="card">수익률 4</div>
  </section>


  <!-- ===============================
       💰 전체 수익률 테이블
  ================================ -->
  <section class="table-section">
    <div class="container">
      <h2>💰 전체 수익률</h2>
      <table class="data-table">
        <thead>
          <tr>
            <th>종목명</th>
            <th>매수가</th>
            <th>현재가</th>
            <th>수익률</th>
          </tr>
        </thead>
        <tbody id="total-table-body">
          <tr><td colspan="4">⏳ 데이터를 불러오는 중...</td></tr>
        </tbody>
      </table>
      <button class="more-btn" id="loadMoreTotalBtn">더보기</button>
    </div>
  </section>

  <!-- ===============================
       🧭 스윙 적정가격 테이블
  ================================ -->
  <section class="table-section">
    <div class="container">
      <h2>📊 스윙 적정가격</h2>
      <table class="data-table">
        <thead>
          <tr>
            <th>종목명</th>
            <th>적정매수가</th>
            <th>현재가</th>
            <th>괴리율</th>
          </tr>
        </thead>
        <tbody id="swing-table-body">
          <tr><td colspan="4">⏳ 데이터를 불러오는 중...</td></tr>
        </tbody>
      </table>
      <button class="more-btn" id="loadMoreSwingBtn">더보기</button>
    </div>
  </section>

  <!-- ===============================
       ⚙️ FOOTER
  ================================ -->
  <footer>
    <div class="container">
      <p>© 2025 ECONews | 데이터 제공: Supabase</p>
    </div>
  </footer>

  <!-- ✅ JS 연결 -->
  <script src="./main.js"></script>
</body>
</html>
