<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ECONews - 경제 포털</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <!-- ===============================
        HEADER (네이버 경제 스타일)
  ================================ -->
  <header class="header">
    <div class="header-inner">
      <!-- 로고 -->
      <div class="logo">ECONews</div>

      <!-- 탭 메뉴 -->
      <nav class="nav-menu">
        <ul>
          <li class="active">전체</li>
          <li>국내주식</li>
          <li>해외주식</li>
          <li>ETF</li>
          <li>스윙전략</li>
        </ul>
      </nav>

      <!-- 로그인 -->
      <div class="login-btn">
        <button>로그인</button>
      </div>
    </div>
  </header>

  <!-- ===============================
        MAIN CONTENT 예시
  ================================ -->
  <main class="content">
    <section style="padding: 40px 20px;">
      <h2>전체 뉴스</h2>
      <p>이곳에 전체 뉴스 내용이 들어갑니다...</p>
    </section>

    <section style="padding: 40px 20px;">
      <h2>국내주식</h2>
      <p>이곳에 국내 주식 데이터가 들어갑니다...</p>
    </section>

    <section style="padding: 40px 20px;">
      <h2>해외주식</h2>
      <p>이곳에 해외 주식 데이터가 들어갑니다...</p>
    </section>

    <section style="padding: 40px 20px;">
      <h2>ETF</h2>
      <p>이곳에 ETF 데이터가 들어갑니다...</p>
    </section>

    <section style="padding: 40px 20px;">
      <h2>스윙전략</h2>
      <p>이곳에 스윙 전략 관련 데이터가 들어갑니다...</p>
    </section>
  </main>

  <!-- ===============================
        FOOTER
  ================================ -->
  <footer>
    <div class="container">
      <p>© 2025 ECONews | 데이터 제공: Supabase</p>
    </div>
  </footer>

  <!-- JS 연결 -->
  <script src="./main.js"></script>
</body>
</html>
