<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECONews Dashboard</title>
  <link rel="stylesheet" href="./style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- ===============================
        HEADER (상단 고정)
  ================================ -->
  <header class="header">
    <div class="header-inner">
      <div class="logo">📊 ECONews 대시보드</div>
      <div class="login-btn">
        <button>로그인</button>
      </div>
    </div>
  </header>

  <!-- ===============================
        MENU BAR (카드 위 탭 메뉴)
  ================================ -->
  <nav class="sub-menu">
    <ul>
      <li class="active">전체</li>
      <li>국내주식</li>
      <li>해외주식</li>
      <li>ETF</li>
      <li>스윙전략</li>
    </ul>
  </nav>

  <!-- ===============================
        MAIN CONTENT
  ================================ -->
  <main>
    <!-- 📈 카드 요약 섹션 -->
    <section class="cards">
      <div id="top5-card" class="card">데이터 불러오는 중...</div>
      <div class="card">수익률 2</div>
      <div class="card">수익률 3</div>
      <div class="card">수익률 4</div>
    </section>

    <!-- 🧾 전체 수익률 -->
    <div class="table-wrap">
      <h3>📈 전체 수익률</h3>
      <table>
        <thead>
          <tr>
            <th>종목명</th>
            <th>시작가격</th>
            <th>현재가격</th>
            <th>수익률</th>
          </tr>
        </thead>
        <tbody id="total-table-body">
          <tr><td colspan="4">데이터를 불러오는 중...</td></tr>
        </tbody>
      </table>
      <button id="loadMoreTotalBtn">더보기</button>
    </div>

    <!-- 💰 스윙 적정가격 -->
    <div class="table-wrap">
      <h3>💰 스윙 적정가격</h3>
      <table>
        <thead>
          <tr>
            <th>종목명</th>
            <th>적정매수가</th>
            <th>현재가</th>
            <th>괴리율</th>
          </tr>
        </thead>
        <tbody id="swing-table-body">
          <tr><td colspan="4">데이터를 불러오는 중...</td></tr>
        </tbody>
      </table>
      <button id="loadMoreSwingBtn">더보기</button>
    </div>
  </main>

  <footer>
    © 2025 ECONews | 데이터 제공: Supabase
  </footer>

  <!-- ===============================
        JS 연결
  ================================ -->
  <script src="./main.js"></script>
</body>
</html>
