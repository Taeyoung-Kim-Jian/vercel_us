<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SWING INVESTOR Dashboard</title>

  <!-- ✅ 기본 스타일 -->
  <link rel="stylesheet" href="./style.css" />

  <!-- ✅ Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: "Noto Sans KR", sans-serif;
      margin: 0;
      background: #fafafa;
    }
    main {
      padding: 20px;
      max-width: 1100px;
      margin: auto;
    }
    footer {
      text-align: center;
      padding: 20px 0;
      color: #6b7280;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <!-- ✅ 공통 헤더 영역 -->
  <div id="header-container"></div>

  <script>
    // ------------------------------------------------------------
    // ✅ 1. header.html 먼저 로드
    // ------------------------------------------------------------
    fetch("./header.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("header-container").innerHTML = html;
        console.log("✅ header.html loaded successfully");

        // --------------------------------------------------------
        // ✅ 2. header 로드 후 common.js를 동적으로 추가
        // --------------------------------------------------------
        const script = document.createElement("script");
        script.src = "./common.js";
        script.onload = () => console.log("✅ common.js loaded after header");
        document.body.appendChild(script);
      })
      .catch(err => console.error("❌ Failed to load header:", err));
  </script>

  <!-- ✅ 메인 콘텐츠 -->
  <main>
    <h2>📈 SWING INVESTOR 대시보드</h2>
    <p>로그인 상태가 상단 헤더에 자동 표시됩니다.</p>

    <!-- 🏆 수익률 Top 5 -->
    <section class="cards">
      <div id="top5-card" class="card">📊 데이터 불러오는 중...</div>
      <div class="card">📈 수익률 2</div>
      <div class="card">📈 수익률 3</div>
      <div class="card">📉 수익률 4</div>
    </section>

    <!-- 🧾 전체 수익률 -->
    <div class="table-wrap">
      <h3>📈 전체 수익률</h3>
      <table>
        <thead>
          <tr>
            <th>종목명</th><th>시작가격</th><th>현재가격</th><th>수익률</th>
          </tr>
        </thead>
        <tbody id="total-table-body">
          <tr><td colspan="4">데이터를 불러오는 중...</td></tr>
        </tbody>
      </table>
      <div style="text-align:right;margin-top:8px;">
        <button id="loadMoreTotalBtn">더보기</button>
      </div>
    </div>

    <!-- 💰 스윙 적정가격 -->
    <div class="table-wrap">
      <h3>💰 스윙 적정가격</h3>
      <table>
        <thead>
          <tr>
            <th>종목명</th><th>적정매수가</th><th>현재가</th><th>괴리율</th>
          </tr>
        </thead>
        <tbody id="swing-table-body">
          <tr><td colspan="4">데이터를 불러오는 중...</td></tr>
        </tbody>
      </table>
      <div style="text-align:right;margin-top:8px;">
        <button id="loadMoreSwingBtn">더보기</button>
      </div>
    </div>
  </main>

  <footer>© 2025 SWING INVESTOR | 데이터 제공: Supabase</footer>

  <!-- ✅ main.js 로직 -->
  <script src="./main.js"></script>
</body>
</html>
