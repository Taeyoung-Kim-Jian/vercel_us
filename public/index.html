<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SWING INVESTOR Dashboard</title>
  <link rel="stylesheet" href="./style.css" />

  <style>
    main.content {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
      margin: 30px 0 40px;
    }

    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      transition: all 0.25s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      background: #fafafa;
    }

    #top5-card h4 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #111827;
    }

    #top5-card ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    #top5-card li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #f3f4f6;
      font-size: 14px;
    }

    #top5-card li:last-child { border-bottom: none; }

    .top5-rank { font-weight: 600; color: #2563eb; width: 35px; }
    .top5-name { flex-grow: 1; color: #111827; }
    .top5-return { font-weight: 600; }
    .top5-return.up { color: #dc2626; }
    .top5-return.down { color: #2563eb; }

    .table-wrap {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      margin-top: 40px;
      padding: 20px;
    }
    .table-wrap h3 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #111827;
      margin-bottom: 15px;
      border-left: 4px solid #2563eb;
      padding-left: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      color: #1f2937;
      text-align: center;
    }

    thead {
      background-color: #f1f5f9 !important;
      color: #111827 !important;
      font-weight: 600;
      border-bottom: 2px solid #2563eb;
    }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid #e5e7eb;
      white-space: nowrap;
      text-align: center;
    }

    tbody tr:hover { background: #f9fafb; transition: background 0.2s; }

    footer {
      text-align: center;
      color: #6b7280;
      margin: 50px 0 30px;
    }
  </style>
</head>

<body>
  <!-- ✅ 공통 헤더 -->
  <div id="header-container"></div>
  <script>
    fetch("./header.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("header-container").innerHTML = html;
        if (typeof SWINGINV_updateHeaderAuthUI === "function")
          SWINGINV_updateHeaderAuthUI();
      });
  </script>

  <main class="content">
    <section class="cards">
      <div id="card-total" class="card">📊 전체 수익률 Top5 불러오는 중...</div>
      <div id="card-watchlist" class="card">⭐ 관심종목 Top5 불러오는 중...</div>
      <div id="card-month" class="card">📅 이번달 Top5 불러오는 중...</div>
      <div id="card-allmonth" class="card">📆 전체월 Top5 불러오는 중...</div>
    </section>

    <div class="table-wrap">
      <h3>📈 전체 수익률</h3>
      <table>
        <thead>
          <tr>
            <th>종목명</th><th>시작가격</th><th>현재가격</th><th>수익률</th>
          </tr>
        </thead>
        <tbody id="total-table-body">
          <tr><td colspan="4">데이터를 불러오는 중...</td></tr>
        </tbody>
      </table>
      <button id="loadMoreTotalBtn">더보기</button>
    </div>
  </main>

  <footer>© 2025 SWING INVESTOR | 데이터 제공: Supabase</footer>

  <!-- ✅ Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- ✅ common.js 먼저 로드 -->
  <script src="./common.js"></script>

  <!-- ✅ Supabase 초기화 완료 후 main.js 실행 -->
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      console.log("📡 index.html loaded");

      // Supabase 클라이언트 대기
      let tries = 0;
      while (!window.db && tries < 20) {
        await new Promise(res => setTimeout(res, 100));
        tries++;
      }

      if (!window.db) {
        console.error("❌ Supabase client not found after waiting.");
        return;
      }

      console.log("✅ Supabase client ready, loading main.js...");
      const script = document.createElement("script");
      script.src = "./main.js";
      document.body.appendChild(script);
    });
  </script>
</body>
</html>
