<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SWING INVESTOR Dashboard</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./common.js"></script>

  <style>
    /* ✅ 메인 페이지 전용 레이아웃 (공통 폭 유지) */
    main.content {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 16px 80px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    /* ✅ 카드 영역 */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
      margin: 30px 0 40px;
    }

    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      transition: all 0.25s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      background: #fafafa;
    }

    /* ✅ Top5 카드 */
    #top5-card {
      display: flex;
      flex-direction: column;
    }

    #top5-card h4 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #111827;
    }

    #top5-card ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    #top5-card li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #f3f4f6;
      font-size: 14px;
    }

    #top5-card li:last-child { border-bottom: none; }

    .top5-rank {
      font-weight: 600;
      color: #2563eb;
      width: 35px;
      text-align: center;
    }

    .top5-name {
      flex-grow: 1;
      color: #111827;
      text-align: left;
    }

    .top5-return {
      font-weight: 600;
      text-align: right;
    }

    .top5-return.up { color: #dc2626; }
    .top5-return.down { color: #2563eb; }

    /* ✅ 테이블 */
    .table-wrap {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      margin-top: 40px;
      padding: 20px;
    }

    .table-wrap h3 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #111827;
      margin-bottom: 15px;
      border-left: 4px solid #2563eb;
      padding-left: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      color: #1f2937;
      text-align: center;
    }

    thead {
      background-color: #f1f5f9;
      color: #111827;
      font-weight: 600;
      border-bottom: 2px solid #2563eb;
    }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid #e5e7eb;
      text-align: center;
      white-space: nowrap;
    }

    tbody tr:hover {
      background: #f9fafb;
      transition: background 0.2s;
    }

    /* ✅ 버튼 */
    button {
      display: block;
      margin: 15px auto 0;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }

    button:hover { background: #1e3a8a; }


  </style>
</head>

<body>
  <!-- ✅ 공통 헤더 -->
  <div id="header-container"></div>
  <script>
    fetch("./header.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("header-container").innerHTML = html;
        if (typeof SWINGINV_updateHeaderAuthUI === "function")
          SWINGINV_updateHeaderAuthUI();
      });
  </script>

  <main class="content">
    <!-- 🏆 수익률 Top 5 -->
    <section class="cards">
      <div id="top5-card" class="card">📈 데이터 불러오는 중...</div>
      <div class="card">📊 수익률 2</div>
      <div class="card">📈 수익률 3</div>
      <div class="card">📉 수익률 4</div>
    </section>

    <!-- 🧾 전체 수익률 -->
    <div class="table-wrap">
      <h3>📈 전체 수익률</h3>
      <table>
        <thead>
          <tr>
            <th>종목명</th><th>시작가격</th><th>현재가격</th><th>수익률</th>
          </tr>
        </thead>
        <tbody id="total-table-body">
          <tr><td colspan="4">데이터를 불러오는 중...</td></tr>
        </tbody>
      </table>
      <button id="loadMoreTotalBtn">더보기</button>
    </div>

    <!-- 💰 스윙 적정가격 -->
    <div class="table-wrap">
      <h3>💰 스윙 적정가격</h3>
      <table>
        <thead>
          <tr>
            <th>종목명</th><th>적정매수가</th><th>현재가</th><th>괴리율</th>
          </tr>
        </thead>
        <tbody id="swing-table-body">
          <tr><td colspan="4">데이터를 불러오는 중...</td></tr>
        </tbody>
      </table>
      <button id="loadMoreSwingBtn">더보기</button>
    </div>
  </main>

  <footer>© 2025 SWING INVESTOR | 데이터 제공: Supabase</footer>
  <script src="./main.js"></script>
</body>
</html>
