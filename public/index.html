<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SWING INVESTOR 대시보드</title>

  <!-- Supabase SDK + 공통 스크립트 -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="common.js"></script>
  <script src="auth.js"></script>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    header {
      background: #007bff;
      color: white;
      padding: 16px;
      font-size: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    main {
      max-width: 800px;
      margin: 40px auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
      text-align: center;
    }
    button {
      background: #dc3545;
      border: none;
      padding: 10px 20px;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }
    button:hover { background: #b02a37; }
  </style>
</head>

<body>
  <header>
    <span>📈 SWING INVESTOR 대시보드</span>
    <button id="logoutBtn">로그아웃</button>
  </header>

  <main>
    <h2 id="welcome"></h2>
    <p>이 페이지는 로그인 세션이 유지되는지 테스트하는 페이지입니다.</p>
    <p>로그인 상태가 유지된다면, 아래에 이메일 또는 닉네임이 표시됩니다.</p>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      // ✅ 세션 복원 시도
      const { data: { session } } = await SWINGINV.db.auth.getSession();

      if (session?.user) {
        const userEmail = session.user.email;
        const { data: profile } = await SWINGINV.db
          .from("profiles")
          .select("nickname")
          .eq("id", session.user.id)
          .single();

        const nickname = profile?.nickname ?? "";
        document.getElementById("welcome").innerHTML =
          nickname
            ? `환영합니다, <b>${nickname}</b>님 (${userEmail})`
            : `로그인됨: ${userEmail}`;
      } else {
        // ❌ 세션 없음 → 로그인 페이지로 이동
        alert("로그인 세션이 만료되었습니다. 다시 로그인해주세요.");
        location.href = "login.html";
      }

      // ✅ 로그아웃 버튼
      document.getElementById("logoutBtn").onclick = async () => {
        await SWINGINV.logoutUser();
      };
    });
  </script>
</body>
</html>
