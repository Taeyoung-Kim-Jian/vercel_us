<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 | SWING INVESTOR</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./common.js"></script>

  <style>
    body {
      font-family: "Noto Sans KR", sans-serif;
      display: flex; align-items: center; justify-content: center;
      background: #f9fafb; height: 100vh; margin: 0;
    }
    .login-box {
      width: 360px; background: #fff; border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
      padding: 30px 25px; text-align: center;
    }
    input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; margin-bottom: 10px; }
    button {
      width: 100%; padding: 10px; border: none; border-radius: 6px;
      cursor: pointer; margin-bottom: 8px; font-size: 14px;
    }
    .email-btn { background: #2563eb; color: #fff; }
    .google-btn, .github-btn, .discord-btn {
      background: #fff; border: 1px solid #d1d5db; color: #111;
    }
    .error-box {
      display: none; color: #b91c1c; background: #fee2e2;
      border-radius: 6px; padding: 8px; margin-top: 8px; font-size: 13px;
    }
    a { color: #2563eb; text-decoration: none; font-size: 13px; }
    a:hover { text-decoration: underline; }
  </style>
</head>

<body>
  <div class="login-box">
    <h2>SWING INVESTOR 로그인</h2>

    <input type="email" id="emailInput" placeholder="이메일 주소 입력" />
    <button id="emailLoginBtn" class="email-btn">📩 이메일 로그인 링크 받기</button>

    <div style="margin:15px 0;color:#6b7280;">또는</div>

    <button id="googleLoginBtn" class="google-btn">🔑 Google 로그인</button>
    <button id="githubLoginBtn" class="github-btn">🐙 GitHub 로그인</button>
    <button id="discordLoginBtn" class="discord-btn">💬 Discord 로그인</button>

    <div id="errorBox" class="error-box"></div>
    <a href="index.html">← 메인으로 돌아가기</a>
  </div>

  <script>
    const redirect = new URLSearchParams(window.location.search).get("redirect") || "index.html";
    const { db } = SWINGINV;

    const emailInput = document.getElementById("emailInput");
    const errorBox = document.getElementById("errorBox");

    const showError = (msg) => {
      errorBox.textContent = msg;
      errorBox.style.display = "block";
      setTimeout(() => errorBox.style.display = "none", 4000);
    };

    // 이메일 로그인
    document.getElementById("emailLoginBtn").onclick = async () => {
      const email = emailInput.value.trim();
      if (!email) return showError("이메일을 입력해주세요.");

      const { error } = await db.auth.signInWithOtp({ email });
      if (error) showError("❌ 로그인 실패: " + error.message);
      else showError("📩 이메일로 로그인 링크를 보냈습니다. 메일함을 확인해주세요.");
    };

    // 소셜 로그인 함수
    async function socialLogin(provider) {
      const { error } = await db.auth.signInWithOAuth({
        provider,
        options: { redirectTo: `${window.location.origin}/${redirect}` },
      });
      if (error) showError(provider + " 로그인 실패: " + error.message);
    }

    document.getElementById("googleLoginBtn").onclick = () => socialLogin("google");
    document.getElementById("githubLoginBtn").onclick = () => socialLogin("github");
    document.getElementById("discordLoginBtn").onclick = () => socialLogin("discord");

    // 로그인 상태 변화 감지
    db.auth.onAuthStateChange((_event, session) => {
      if (session) location.href = redirect;
    });
  </script>
</body>
</html>
