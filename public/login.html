<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>로그인 | SWING INVESTOR</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./common.js"></script>
<script src="./auth.js"></script>
<style>
body{font-family:"Noto Sans KR";background:#f9fafb;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.box{width:360px;background:#fff;border-radius:12px;box-shadow:0 3px 8px rgba(0,0,0,.05);padding:25px}
input,button{width:100%;padding:10px;margin-bottom:10px;border-radius:6px;border:1px solid #ddd}
button{background:#2563eb;color:#fff;border:none;cursor:pointer}
#error{color:#b91c1c;text-align:center;font-size:13px;margin-bottom:10px}
</style>
</head>
<body>
<div class="box">
  <h2>SWING INVESTOR 로그인</h2>
  <div id="error"></div>
  <input id="email" type="email" placeholder="이메일">
  <input id="pw" type="password" placeholder="비밀번호">
  <button id="loginBtn">로그인</button>
  <hr>
  <h3>회원가입</h3>
  <input id="newEmail" type="email" placeholder="이메일">
  <input id="nickname" type="text" placeholder="닉네임 (2~12자)">
  <button id="signupBtn">인증 메일 발송</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", async ()=>{
  const wait=(ms)=>new Promise(r=>setTimeout(r,ms));
  let db;
  for(let i=0;i<20;i++){ if(window.SWINGINV?.db){db=SWINGINV.db;break;} await wait(200);}
  if(!db)return alert("Supabase 로드 실패");

  const errorEl=document.getElementById("error");
  const showError=(msg)=>errorEl.textContent=msg;

  // ✅ 로그인
  document.getElementById("loginBtn").onclick=async()=>{
    const email=document.getElementById("email").value.trim();
    const pw=document.getElementById("pw").value.trim();
    if(!email||!pw)return showError("이메일과 비밀번호를 입력하세요.");
    const {error}=await db.auth.signInWithPassword({email,password:pw});
    if(error)return showError("❌ 로그인 실패: "+error.message);
    alert("✅ 로그인 성공"); location.href="index.html";
  };

  // ✅ 회원가입
  document.getElementById("signupBtn").onclick=async()=>{
    const em=document.getElementById("newEmail").value.trim();
    const nick=document.getElementById("nickname").value.trim();
    if(!em||!nick)return showError("이메일과 닉네임을 입력하세요.");
    if(nick.length<2||nick.length>12)return showError("닉네임은 2~12자여야 합니다.");

    // 🔍 이메일 중복 확인
    const { data: userDup } = await db
      .from("profiles")
      .select("email")
      .eq("email", em);
    if(userDup && userDup.length>0){
      return showError("🚫 이미 가입된 이메일입니다.");
    }

    // 🔍 닉네임 중복 확인
    const { data: nickDup } = await db
      .from("profiles")
      .select("nickname")
      .eq("nickname", nick);
    if(nickDup && nickDup.length>0){
      return showError("🚫 이미 사용 중인 닉네임입니다.");
    }

    // ✅ 회원가입 진행 (인증메일 발송)
    const { error } = await db.auth.signUp({
      email: em,
      password: Math.random().toString(36).slice(2) + "!tmp",
      options: {
        emailRedirectTo: `${window.location.origin}/set-password.html?email=${encodeURIComponent(em)}&nickname=${encodeURIComponent(nick)}`
      }
    });

    if(error)return showError("회원가입 실패: "+error.message);
    showError("");
    alert("📩 인증 메일을 보냈습니다. 메일함을 확인해주세요!");
  };
});
</script>
</body>
</html>
