<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 | SWING INVESTOR</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./common.js"></script>

  <style>
    body {
      font-family: "Noto Sans KR", sans-serif;
      background: #f9fafb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-box {
      width: 360px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
      padding: 30px 25px 40px;
      text-align: center;
    }
    h2 {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: #111827;
    }
    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #2563eb;
      color: white;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 10px;
      transition: background 0.2s;
    }
    button:hover {
      background: #1e3a8a;
    }
    .divider {
      position: relative;
      margin: 20px 0;
      text-align: center;
    }
    .divider::before,
    .divider::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: #e5e7eb;
    }
    .divider::before {
      left: 0;
    }
    .divider::after {
      right: 0;
    }
    .divider span {
      background: #fff;
      padding: 0 8px;
      color: #6b7280;
      font-size: 12px;
    }
    .google-btn {
      background: #fff;
      color: #374151;
      border: 1px solid #d1d5db;
    }
    .google-btn:hover {
      background: #f3f4f6;
    }
    .info {
      font-size: 12px;
      color: #6b7280;
      margin-top: 10px;
    }
    #error-box {
      display: none;
      background: #fee2e2;
      color: #b91c1c;
      font-size: 13px;
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 12px;
      text-align: left;
    }
  </style>
</head>

<body>
  <div class="login-box">
    <h2>SWING INVESTOR 로그인</h2>
    <div id="error-box"></div>

    <!-- 로그인 -->
    <input id="loginEmail" type="email" placeholder="이메일" />
    <input id="loginPassword" type="password" placeholder="비밀번호" />
    <button id="loginBtn">로그인</button>

    <div class="divider"><span>또는</span></div>

    <!-- 회원가입 -->
    <input id="signupEmail" type="email" placeholder="이메일 (회원가입)" />
    <input id="signupNickname" type="text" placeholder="닉네임 (2~12자)" />
    <button id="signupBtn">회원가입 (인증 메일 발송)</button>

    <div class="divider"><span>또는</span></div>

    <!-- 구글 로그인 -->
    <button id="googleBtn" class="google-btn">🔑 Google 계정으로 로그인</button>

    <p class="info">이메일 인증 후 비밀번호를 설정하세요.</p>
  </div>

  <script>
  document.addEventListener("DOMContentLoaded", async () => {
    const db = SWINGINV.db;
    const errBox = document.getElementById("error-box");
    const showError = (msg) => { errBox.style.display="block"; errBox.textContent=msg; };
    const hideError = () => { errBox.style.display="none"; };

    // ✅ 로그인 처리
    document.getElementById("loginBtn").onclick = async () => {
      hideError();
      const email = loginEmail.value.trim();
      const password = loginPassword.value.trim();
      if (!email || !password) return showError("이메일과 비밀번호를 입력해주세요.");

      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) return showError("로그인 실패: " + error.message);
      alert("✅ 로그인 성공!");
      location.href = "index.html";
    };

    // ✅ 회원가입 처리
    document.getElementById("signupBtn").onclick = async () => {
      hideError();
      const email = signupEmail.value.trim();
      const nickname = signupNickname.value.trim();

      if (!email || !nickname) return showError("이메일과 닉네임을 모두 입력해주세요.");
      if (nickname.length < 2 || nickname.length > 12)
        return showError("닉네임은 2~12자여야 합니다.");

      try {
        // 이메일 중복 확인
        const { data: emailDup } = await db.from("profiles").select("email").eq("email", email);
        if (emailDup && emailDup.length > 0)
          return showError("이미 등록된 이메일입니다.");

        // 닉네임 중복 확인
        const { data: nickDup } = await db.from("profiles").select("nickname").eq("nickname", nickname);
        if (nickDup && nickDup.length > 0)
          return showError("이미 사용 중인 닉네임입니다.");

        // 회원가입 요청 (인증 메일 발송)
        const { error } = await db.auth.signUp({
          email,
          password: Math.random().toString(36).slice(2) + "!temp",
          options: {
            emailRedirectTo: `${window.location.origin}/set-password.html?email=${encodeURIComponent(email)}&nickname=${encodeURIComponent(nickname)}`
          }
        });

        if (error) return showError("회원가입 실패: " + error.message);
        alert("📩 인증 메일이 발송되었습니다. 메일함을 확인해주세요.");
      } catch (err) {
        showError("오류 발생: " + err.message);
      }
    };

    // ✅ Google 로그인
    document.getElementById("googleBtn").onclick = async () => {
      const { error } = await db.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: `${window.location.origin}/index.html` }
      });
      if (error) showError("Google 로그인 실패: " + error.message);
    };
  });
  </script>
</body>
</html>
