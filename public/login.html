<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 | SWING INVESTOR</title>

  <!-- ✅ Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./common.js"></script>

  <style>
    body {
      font-family: "Noto Sans KR", sans-serif;
      background: #f9fafb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .auth-box {
      width: 380px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.05);
      padding: 30px 25px;
    }
    h2 {
      text-align: center;
      font-size: 1.3rem;
      margin-bottom: 20px;
      color: #111827;
    }
    label {
      font-weight: 500;
      font-size: 13px;
      display: block;
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-primary {
      background: #2563eb;
      color: white;
      margin-top: 5px;
    }
    .btn-secondary {
      background: #fff;
      border: 1px solid #d1d5db;
      color: #374151;
    }
    .divider {
      margin: 20px 0;
      text-align: center;
      color: #6b7280;
      font-size: 12px;
      position: relative;
    }
    .divider::before,
    .divider::after {
      content: "";
      position: absolute;
      width: 40%;
      height: 1px;
      background: #e5e7eb;
      top: 50%;
    }
    .divider::before { left: 0; }
    .divider::after { right: 0; }
    .error {
      color: #b91c1c;
      background: #fee2e2;
      border-radius: 6px;
      padding: 8px;
      font-size: 13px;
      margin-bottom: 10px;
      display: none;
    }
    .link {
      display: inline-block;
      text-align: center;
      width: 100%;
      margin-top: 12px;
      font-size: 13px;
      color: #2563eb;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="auth-box">
    <h2>SWING INVESTOR 로그인</h2>
    <div id="error-box" class="error"></div>

    <!-- ✅ 로그인 -->
    <div id="login-form">
      <label>이메일</label>
      <input type="email" id="loginEmail" placeholder="example@email.com" />
      <label>비밀번호</label>
      <input type="password" id="loginPassword" placeholder="비밀번호" />
      <button class="btn-primary" id="loginBtn">로그인</button>
      <div class="link" id="toSignup">회원가입하기</div>
    </div>

    <!-- ✅ 회원가입 -->
    <div id="signup-form" style="display:none;">
      <label>이메일</label>
      <input type="email" id="signupEmail" placeholder="example@email.com" />
      <label>닉네임</label>
      <input type="text" id="signupNickname" placeholder="2~12자 닉네임" />
      <button class="btn-primary" id="signupBtn">인증 메일 보내기</button>
      <div class="link" id="toLogin">← 로그인으로 돌아가기</div>
    </div>

    <div class="divider">또는</div>

    <!-- ✅ 소셜 로그인 -->
    <button class="btn-secondary" id="googleLogin">🔑 Google 로그인</button>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const db = SWINGINV.db;
      const errorBox = document.getElementById("error-box");
      const loginForm = document.getElementById("login-form");
      const signupForm = document.getElementById("signup-form");

      // 에러 표시
      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.style.display = "block";
      }
      function hideError() {
        errorBox.style.display = "none";
      }

      // ✅ 로그인 버튼
      document.getElementById("loginBtn").addEventListener("click", async () => {
        hideError();
        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value.trim();
        if (!email || !password) return showError("이메일과 비밀번호를 입력해주세요.");

        const { data, error } = await db.auth.signInWithPassword({ email, password });
        if (error) return showError("로그인 실패: " + error.message);
        location.href = "index.html";
      });

      // ✅ 회원가입 버튼
      document.getElementById("signupBtn").addEventListener("click", async () => {
        hideError();
        const email = document.getElementById("signupEmail").value.trim();
        const nickname = document.getElementById("signupNickname").value.trim();

        if (!email || !nickname) return showError("이메일과 닉네임을 모두 입력해주세요.");
        if (nickname.length < 2 || nickname.length > 12) return showError("닉네임은 2~12자여야 합니다.");

        // 닉네임 중복 체크
        const { data: dup } = await db.from("profiles").select("nickname").eq("nickname", nickname);
        if (dup && dup.length > 0) return showError("이미 사용 중인 닉네임입니다.");

        // 인증 메일 발송
        const { error } = await db.auth.signUp({
          email,
          password: Math.random().toString(36).slice(2) + "!temp",
          options: {
            emailRedirectTo: `${window.location.origin}/set-password.html?email=${encodeURIComponent(email)}&nickname=${encodeURIComponent(nickname)}`
          }
        });

        if (error) return showError("회원가입 실패: " + error.message);
        alert("📩 인증 메일이 발송되었습니다. 메일함을 확인해주세요.");
      });

      // ✅ 폼 전환
      document.getElementById("toSignup").addEventListener("click", () => {
        loginForm.style.display = "none";
        signupForm.style.display = "block";
        hideError();
      });
      document.getElementById("toLogin").addEventListener("click", () => {
        signupForm.style.display = "none";
        loginForm.style.display = "block";
        hideError();
      });

      // ✅ Google 로그인
      document.getElementById("googleLogin").addEventListener("click", async () => {
        const { error } = await db.auth.signInWithOAuth({
          provider: "google",
          options: { redirectTo: `${window.location.origin}/index.html` }
        });
        if (error) showError("Google 로그인 실패: " + error.message);
      });
    });
  </script>
</body>
</html>
