<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 | SWING INVESTOR</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./common.js"></script>
  <script src="./auth.js"></script>
  <style>
    body { font-family:"Noto Sans KR"; background:#f9fafb; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
    .box { width:360px; background:white; border-radius:12px; box-shadow:0 3px 10px rgba(0,0,0,0.05); padding:25px; }
    input, button { width:100%; padding:10px; margin-bottom:10px; border-radius:6px; border:1px solid #ddd; }
    button { background:#2563eb; color:white; border:none; cursor:pointer; }
    #error { color:#b91c1c; text-align:center; font-size:13px; margin-bottom:10px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>SWING INVESTOR 로그인</h2>
    <div id="error"></div>

    <input id="loginEmail" type="email" placeholder="이메일" />
    <input id="loginPw" type="password" placeholder="비밀번호" />
    <button id="loginBtn">로그인</button>

    <hr />

    <h3>회원가입</h3>
    <input id="signupEmail" type="email" placeholder="이메일" />
    <input id="signupNickname" type="text" placeholder="닉네임 (2~12자)" />
    <button id="signupBtn">회원가입 (인증 메일 보내기)</button>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      // Supabase 준비
      const wait = (ms) => new Promise(r => setTimeout(r, ms));
      let db;
      for (let i = 0; i < 20; i++) {
        if (window.SWINGINV?.db) {
          db = SWINGINV.db;
          break;
        }
        await wait(200);
      }
      if (!db) {
        document.getElementById("error").textContent = "Supabase 초기화 실패";
        return;
      }

      const errEl = document.getElementById("error");

      function showError(msg) {
        errEl.textContent = msg;
      }
      function hideError() {
        errEl.textContent = "";
      }

      // 로그인 버튼
      document.getElementById("loginBtn").onclick = async () => {
        hideError();
        const email = document.getElementById("loginEmail").value.trim();
        const pw = document.getElementById("loginPw").value.trim();
        if (!email || !pw) {
          showError("이메일과 비밀번호를 입력하세요");
          return;
        }
        const { error } = await db.auth.signInWithPassword({ email, password: pw });
        if (error) {
          showError("로그인 실패: " + error.message);
          return;
        }
        alert("✅ 로그인 성공");
        location.href = "index.html";
      };

      // 회원가입 버튼
      document.getElementById("signupBtn").onclick = async () => {
        hideError();
        const email = document.getElementById("signupEmail").value.trim();
        const nickname = document.getElementById("signupNickname").value.trim();
        if (!email || !nickname) {
          showError("이메일과 닉네임을 입력하세요");
          return;
        }
        if (nickname.length < 2 || nickname.length > 12) {
          showError("닉네임은 2~12자여야 합니다");
          return;
        }

        // 중복 검사
        const dup = await SWINGINV.checkDuplicate(email, nickname);
        if (dup.email) {
          showError("이미 가입된 이메일입니다");
          return;
        }
        if (dup.nickname) {
          showError("이미 사용 중인 닉네임입니다");
          return;
        }

        // 회원가입 / 인증메일 발송
        const { error } = await db.auth.signUp({
          email,
          password: Math.random().toString(36).slice(2) + "!tmp",
          options: {
            emailRedirectTo: `${window.location.origin}/set-password.html?email=${encodeURIComponent(email)}&nickname=${encodeURIComponent(nickname)}`
          }
        });
        if (error) {
          showError("회원가입 실패: " + error.message);
          return;
        }
        alert("📩 인증 메일을 보냈습니다. 메일 확인해주세요");
      };
    });
  </script>
</body>
</html>
