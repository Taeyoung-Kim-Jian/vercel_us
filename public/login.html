<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>로그인 | SWING INVESTOR</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./common.js"></script>
<script src="./auth.js"></script>
<style>
body{font-family:"Noto Sans KR";background:#f9fafb;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.box{width:360px;background:#fff;border-radius:12px;box-shadow:0 3px 8px rgba(0,0,0,.05);padding:25px}
input,button{width:100%;padding:10px;margin-bottom:10px;border-radius:6px;border:1px solid #ddd}
button{background:#2563eb;color:#fff;border:none;cursor:pointer}
#error{color:#b91c1c;text-align:center;font-size:13px}
</style>
</head>
<body>
<div class="box">
  <h2>SWING INVESTOR 로그인</h2>
  <div id="error"></div>
  <input id="email" type="email" placeholder="이메일">
  <input id="pw" type="password" placeholder="비밀번호">
  <button id="loginBtn">로그인</button>
  <hr>
  <input id="newEmail" type="email" placeholder="회원가입 이메일">
  <input id="nickname" type="text" placeholder="닉네임 (2~12자)">
  <button id="signupBtn">인증 메일 발송</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", async ()=>{
  const wait=(ms)=>new Promise(r=>setTimeout(r,ms));
  let db;for(let i=0;i<20;i++){if(window.SWINGINV?.db){db=SWINGINV.db;break;}await wait(200);}
  if(!db)return alert("Supabase 로드 실패");

  const errorEl=document.getElementById("error");
  const showError=(msg)=>errorEl.textContent=msg;

  document.getElementById("loginBtn").onclick=async()=>{
    const email=emailEl.value.trim(), pw=pwEl.value.trim();
    if(!email||!pw)return showError("이메일/비밀번호 입력");
    const{error}=await db.auth.signInWithPassword({email,password:pw});
    if(error)return showError("로그인 실패: "+error.message);
    alert("✅ 로그인 성공");location.href="index.html";
  };

  const emailEl=document.getElementById("email");
  const pwEl=document.getElementById("pw");

  document.getElementById("signupBtn").onclick=async()=>{
    const em=document.getElementById("newEmail").value.trim();
    const nick=document.getElementById("nickname").value.trim();
    if(!em||!nick)return showError("이메일과 닉네임 입력");
    if(nick.length<2||nick.length>12)return showError("닉네임 2~12자");
    const{error}=await db.auth.signUp({
      email:em,
      password:Math.random().toString(36).slice(2)+"!tmp",
      options:{emailRedirectTo:`${window.location.origin}/set-password.html?email=${encodeURIComponent(em)}&nickname=${encodeURIComponent(nick)}`}
    });
    if(error)return showError("회원가입 실패: "+error.message);
    alert("📩 인증 메일 발송됨");
  };
});
</script>
</body>
</html>
