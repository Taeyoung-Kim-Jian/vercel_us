<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>로그인 | SWING INVESTOR</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./common.js"></script>
<script src="./auth.js"></script>
<style>
body{font-family:"Noto Sans KR";display:flex;align-items:center;justify-content:center;height:100vh;background:#f9fafb;margin:0;}
.box{width:360px;background:#fff;padding:25px;border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,.05);}
input,button{width:100%;padding:10px;margin:5px 0;border-radius:6px;}
button{border:none;background:#2563eb;color:#fff;font-weight:500;cursor:pointer;}
#msg{font-size:13px;color:#444;text-align:center;margin-top:10px;}
</style>
</head>
<body>
<div class="box">
<h2>SWING INVESTOR 로그인</h2>
<input id="loginEmail" placeholder="이메일" type="email">
<input id="loginPw" placeholder="비밀번호" type="password">
<button id="loginBtn">로그인</button>

<hr>
<h3>회원가입</h3>
<input id="newEmail" placeholder="이메일">
<input id="nickname" placeholder="닉네임">
<button id="signupBtn">회원가입</button>

<p id="msg"></p>
</div>

<script>
document.addEventListener("DOMContentLoaded", async()=>{
  const msg=document.getElementById("msg");
  const db=SWINGINV.db;

  // ✅ 로그인
  document.getElementById("loginBtn").onclick=async()=>{
    const email=document.getElementById("loginEmail").value.trim();
    const pw=document.getElementById("loginPw").value.trim();
    if(!email||!pw)return alert("입력필요");
    try{
      const {error}=await db.auth.signInWithPassword({email,password:pw});
      if(error)throw error;
      alert("✅ 로그인 성공");
      location.href="index.html";
    }catch(err){alert("❌ 로그인 실패: "+err.message);}
  };

  // ✅ 회원가입
  document.getElementById("signupBtn").onclick=async()=>{
    const email=document.getElementById("newEmail").value.trim();
    const nickname=document.getElementById("nickname").value.trim();
    if(!email||!nickname)return alert("이메일/닉네임 입력");
    const dup=await SWINGINV.checkDuplicate(email,nickname);
    if(dup.email)return alert("이미 가입된 이메일");
    if(dup.nickname)return alert("닉네임 중복");

    try{
      const {error}=await db.auth.signUp({
        email,
        password:Math.random().toString(36).slice(2)+"!tmp",
        options:{emailRedirectTo:`${window.location.origin}/set-password.html?email=${encodeURIComponent(email)}&nickname=${encodeURIComponent(nickname)}`}
      });
      if(error)throw error;
      alert("📩 인증메일 발송. 확인 후 비밀번호 설정하세요.");
    }catch(err){alert("❌ 회원가입 실패: "+err.message);}
  };
});
</script>
</body>
</html>
