<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 | SWING INVESTOR</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/auth-ui-shared@1.4.1"></script>

  <style>
    body {
      font-family: "Noto Sans KR", "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f9fafb;
    }

    #auth-box {
      background: #fff;
      padding: 30px 25px;
      border-radius: 10px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
      width: 360px;
      text-align: center;
    }

    .logo {
      font-weight: 700;
      font-size: 1.2rem;
      color: #2563eb;
      margin-bottom: 20px;
      letter-spacing: -0.4px;
    }

    .auth-footer {
      margin-top: 20px;
      font-size: 13px;
      color: #6b7280;
    }

    .auth-footer a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div id="auth-box">
    <div class="logo">SWING INVESTOR</div>
    <div id="auth-container"></div>
    <div class="auth-footer">
