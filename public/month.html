<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>월별 성과 | SWING INVESTOR</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./common.js"></script>

  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #f8fafc;
      margin: 0;
      padding: 0;
    }

    main {
      max-width: 1100px;
      margin: 40px auto;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
      padding: 20px;
    }

    h2 {
      margin-top: 0;
      color: #1e293b;
    }

    /* ✅ 월 탭 바 */
    #month-tabs {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    #month-tabs button {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      background: #e2e8f0;
      cursor: pointer;
      color: #334155;
      font-weight: 500;
      transition: all 0.2s;
    }

    #month-tabs button.active {
      background: #2563eb;
      color: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 14px;
    }

    thead {
      background-color: #2563eb;
      color: #fff;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #e2e8f0;
      text-align: center;
    }

    tbody tr:hover {
      background-color: #f9fafb;
    }

    /* ✅ 클릭 가능한 행 효과 */
    .clickable-row {
      cursor: pointer;
      transition: background 0.2s;
    }

    .clickable-row:hover {
      background: #f1f5f9;
    }

    footer {
      text-align: center;
      padding: 30px 0;
      color: #555;
      font-size: 0.85rem;
    }

    @media (max-width: 600px) {
      main {
        padding: 12px;
      }
      table {
        font-size: 12px;
      }
      #month-tabs {
        gap: 6px;
      }
      #month-tabs button {
        padding: 6px 10px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <!-- ✅ 공통 헤더 -->
  <div id="header-container"></div>
  <script>
    fetch("./header.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("header-container").innerHTML = html;
        if (typeof SWINGINV_updateHeaderAuthUI === "function") SWINGINV_updateHeaderAuthUI();
      });
  </script>

  <main>
    <h2>📅 월별 성과</h2>
    <p style="color:#555;">월별로 측정된 주요 종목의 수익률을 확인하고 상세 차트로 이동하세요.</p>

    <!-- ✅ 월 탭 -->
    <div id="month-tabs"></div>

    <!-- ✅ 테이블 -->
    <table>
      <thead>
        <tr>
          <th>종목명</th>
          <th>측정일</th>
          <th>측정일 종가</th>
          <th>현재가</th>
          <th>측정일 대비 수익률</th>
          <th>최고 수익률</th>
          <th>최저 수익률</th>
        </tr>
      </thead>
      <tbody id="month-table-body">
        <tr><td colspan="7" style="text-align:center;">⏳ 데이터를 불러오는 중...</td></tr>
      </tbody>
    </table>
  </main>

  <footer>© 2025 SWING INVESTOR | 데이터 제공: Supabase</footer>

  <!-- ✅ 동작 스크립트 -->
  <script src="./month.js"></script>
</body>
</html>
