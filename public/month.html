<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>월별성과 | SWING INVESTOR</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./common.js"></script>

  <style>
    /* ✅ 월 탭 스크롤 바 스타일 (네이버 스타일) */
    #month-tabs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      white-space: nowrap;
      padding: 12px 10px;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    #month-tabs::-webkit-scrollbar { display: none; }

    /* 기본 탭 버튼 */
    #month-tabs .tab-btn {
      flex: 0 0 auto;
      background: #f1f5f9;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.9rem;
      font-weight: 500;
      color: #1e3a8a;
      cursor: pointer;
      transition: all 0.2s;
    }

    /* hover 효과 */
    #month-tabs .tab-btn:hover {
      background: #1e3a8a;
      color: #fff;
    }

    /* ✅ 클릭된 탭만 파란색 강조 */
    #month-tabs .tab-btn.active {
      background: #1e40af;
      color: #fff;
      border-color: #1e40af;
      font-weight: 600;
    }

    /* 표 스타일 */
    .table-wrap {
      background: #fff;
      border-radius: 10px;
      margin: 16px;
      padding: 16px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    th, td {
      text-align: center;
      padding: 8px;
      border-bottom: 1px solid #e5e7eb;
    }
    th {
      background: #f1f5f9;
      color: #111827;
      font-weight: 600;
    }
    tbody tr:hover {
      background: #f9fafb;
    }
  </style>
</head>

<body>
  <!-- ✅ 공통 헤더 -->
  <div id="header-container"></div>
  <script>
    fetch("./header.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("header-container").innerHTML = html;
        if (typeof SWINGINV_updateHeaderAuthUI === "function") SWINGINV_updateHeaderAuthUI();
      });
  </script>

  <main class="content">
    <h2 style="padding: 16px;">📅 월별 성과 분석</h2>

    <!-- ✅ 스크롤 가능한 월 탭 -->
    <div id="month-tabs"></div>

    <!-- ✅ 데이터 테이블 -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>종목명</th><th>포착날짜</th><th>당시가격</th><th>현재가</th>
            <th>현재수익률</th><th>최고</th><th>최저</th>
          </tr>
        </thead>
        <tbody id="month-table-body">
          <tr><td colspan="7">데이터 불러오는 중...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer>© 2025 SWING INVESTOR | 데이터 제공: Supabase</footer>
  <script src="./month.js"></script>
</body>
</html>
