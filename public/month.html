<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>월별성과 | SWING INVESTOR</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./common.js"></script>
</head>
<body>
  <!-- ✅ 공통 헤더 -->
  <div id="header-container"></div>
  <script>
    fetch("./header.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("header-container").innerHTML = html;
        if (typeof SWINGINV_updateHeaderAuthUI === "function") SWINGINV_updateHeaderAuthUI();
      });
  </script>

  <main class="content">
    <h2>📅 월별 성과 분석</h2>
    <div id="month-tabs" class="scroll-menu"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>종목명</th><th>포착날짜</th><th>당시가격</th><th>현재가</th>
            <th>현재수익률</th><th>최고</th><th>최저</th>
          </tr>
        </thead>
        <tbody id="month-table-body">
          <tr><td colspan="7">데이터 불러오는 중...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer>© 2025 SWING INVESTOR | 데이터 제공: Supabase</footer>
  <script src="./month.js"></script>
</body>
</html>
