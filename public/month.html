<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>월별성과 | ECONews</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./common.js"></script>
  <script src="./nav.js" defer></script>
</head>
<body>
  <main class="content">
    <h2>📅 월별 ±5% 구간 성과</h2>

    <!-- 📆 월 탭 -->
    <div id="month-tabs" class="scroll-menu"></div>

    <!-- 📊 테이블 -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>종목명</th>
            <th>포착날짜</th> <!-- ✅ 실제 값은 측정일 -->
            <th>당시가격</th>
            <th>현재가</th>
            <th>현재수익률</th>
            <th>최고</th>
            <th>최저</th>
          </tr>
        </thead>
        <tbody id="month-table-body">
          <tr><td colspan="7">데이터 불러오는 중...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer>© 2025 ECONews | 데이터 제공: Supabase</footer>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const tabsEl = document.getElementById("month-tabs");
      const bodyEl = document.getElementById("month-table-body");
      ECONews.showLoading(bodyEl);

      try {
        /* ✅ Supabase View 호출 */
        const { data, error } = await ECONews.db
          .from("monthly_performance_view")
          .select("*")
          .order("월구분", { ascending: false });

        if (error) throw error;
        if (!data || data.length === 0) {
          ECONews.showError(bodyEl, "데이터가 없습니다.");
          return;
        }

        /* ✅ null-safe 월구분 필터링 */
        const validData = data.filter((d) => d.월구분 != null);
        if (validData.length === 0) {
          ECONews.showError(bodyEl, "유효한 월구분 데이터가 없습니다.");
          return;
        }

        /* ✅ 월 목록 생성 */
        const months = [...new Set(
          validData
            .map((d) => (d.월구분 ?? "").slice(0, 7))
            .filter((m) => m)
        )];

        if (months.length === 0) {
          ECONews.showError(bodyEl, "월 정보가 없습니다.");
          return;
        }

        /* ✅ 최신 월이 첫 탭 */
        tabsEl.innerHTML = months
          .map(
            (m, i) =>
              `<button class="tab-btn ${i === 0 ? "active" : ""}" data-month="${m}">${m}</button>`
          )
          .join("");

        renderMonth(months[0]);

        /* ✅ 탭 클릭 이벤트 */
        tabsEl.querySelectorAll(".tab-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            tabsEl.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            renderMonth(btn.dataset.month);
          });
        });

        /* ✅ 월별 렌더링 함수 */
        function renderMonth(month) {
          const filtered = validData.filter(
            (d) => d.월구분 && d.월구분.startsWith(month)
          );

          if (filtered.length === 0) {
            ECONews.showError(bodyEl, `${month} 데이터가 없습니다.`);
            return;
          }

          bodyEl.innerHTML = filtered
            .map(
              (r) => `
              <tr>
                <td class="clickable-name" data-code="${r.종목코드}" data-name="${r.종목명}">
                  ${ECONews.esc(r.종목명)}
                </td>
                <!-- ✅ 포착날짜 = 측정일 -->
                <td style="text-align:center">${ECONews.fmtDate(r.측정일)}</td>
                <td style="text-align:right">${ECONews.nf(r.측정일종가)}</td>
                <td style="text-align:right">${ECONews.nf(r.현재가)}</td>
                <td style="text-align:right">${ECONews.fmtPct(r.측정일대비수익률)}</td>
                <td style="text-align:right">${ECONews.fmtPct(r.최고수익률)}</td>
                <td style="text-align:right">${ECONews.fmtPct(r.최저수익률)}</td>
              </tr>`
            )
            .join("");
        }
      } catch (err) {
        console.error("❌ 월별성과 로딩 실패:", err);
        ECONews.showError(bodyEl, "데이터 로딩 실패 (" + (err.message || "알 수 없는 오류") + ")");
      }
    });
  </script>
</body>
</html>
