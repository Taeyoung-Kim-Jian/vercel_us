ㅍ<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>게시판 | SWING INVESTOR</title>
  <link rel="stylesheet" href="../style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../common.js"></script>

  <style>
    body { font-family: "Pretendard", sans-serif; background:#f8fafc; margin:0; padding:0; }
    main { max-width: 900px; margin: 30px auto; background: #fff; padding:20px; border-radius:10px; box-shadow:0 3px 10px rgba(0,0,0,0.05);}
    h2 { text-align:center; color:#1e293b; }
    table { width:100%; border-collapse: collapse; margin-top:20px;}
    th, td { padding:10px; border-bottom:1px solid #ddd; text-align:left; }
    th { background:#f1f5f9; cursor:pointer; }
    tr:hover { background:#f9fafb; }
    .btn { padding:6px 12px; background:#2563eb; color:#fff; border:none; border-radius:5px; cursor:pointer; }
    .btn:hover { background:#1d4ed8; }
    #error-box { color:red; text-align:center; margin-top:10px; }
    #addForm { display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; }
    #addForm input { flex:1; padding:6px; border:1px solid #ccc; border-radius:5px; }
    #addForm button { flex:none; }
  </style>
</head>

<body>
  <div id="header-container"></div>
  <script>
    fetch("../header.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("header-container").innerHTML = html;
        if (typeof SWINGINV_updateHeaderAuthUI === "function") SWINGINV_updateHeaderAuthUI();
      });
  </script>

  <main>
    <h2>게시판</h2>
    <div id="error-box"></div>

    <!-- 글 추가 폼 -->
    <form id="addForm">
      <input type="text" id="titleInput" placeholder="글 제목" required />
      <input type="url" id="linkInput" placeholder="외부 블로그 링크(URL)" required />
      <button type="submit" class="btn">글 추가</button>
    </form>

    <!-- 게시판 테이블 -->
    <table>
      <thead>
        <tr>
          <th>번호</th>
          <th>제목</th>
          <th>링크</th>
          <th>작성일</th>
          <th>삭제</th>
        </tr>
      </thead>
      <tbody id="posts-body">
        <tr><td colspan="5" style="text-align:center;">⏳ 로딩 중...</td></tr>
      </tbody>
    </table>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const tbody = document.getElementById("posts-body");
      const errorBox = document.getElementById("error-box");
      const addForm = document.getElementById("addForm");
      const titleInput = document.getElementById("titleInput");
      const linkInput = document.getElementById("linkInput");

      // Supabase 준비
      let db;
      for (let i = 0; i < 25; i++) {
        if (window.SWINGINV?.db) { db = SWINGINV.db; break; }
        await new Promise(r => setTimeout(r, 200));
      }
      if (!db) {
        errorBox.textContent = "❌ Supabase 초기화 실패";
        return;
      }

      const user = SWINGINV.user;

      // 게시판 로드
      const loadPosts = async () => {
        try {
          const { data, error } = await db.from("posts").select("*").order("created_at", { ascending: false });
          if (error) throw error;

          if (!data.length) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">📭 글이 없습니다.</td></tr>`;
            return;
          }

          tbody.innerHTML = data.map((post, idx) => `
            <tr>
              <td>${idx + 1}</td>
              <td><a href="${post.link}" target="_blank">${post.title}</a></td>
              <td>${post.link}</td>
              <td>${new Date(post.created_at).toLocaleString()}</td>
              <td><button class="btn" data-id="${post.id}">삭제</button></td>
            </tr>
          `).join("");

          // 삭제 버튼 이벤트
          tbody.querySelectorAll("button").forEach(btn => {
            btn.addEventListener("click", async () => {
              if (!confirm("정말 삭제하시겠습니까?")) return;
              const id = btn.dataset.id;
              const { error } = await db.from("posts").delete().eq("id", id);
              if (error) alert("❌ 삭제 실패: " + error.message);
              else loadPosts();
            });
          });
        } catch (err) {
          errorBox.textContent = "❌ 데이터 로드 실패: " + err.message;
        }
      };

      await loadPosts();

      // 글 추가 이벤트
      addForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!user) { alert("🔐 로그인 후 글을 추가하세요."); return; }

        const title = titleInput.value.trim();
        const link = linkInput.value.trim();
        if (!title || !link) return;

        try {
          const { error } = await db.from("posts").insert({
            title,
            link,
            user_id: user.id,
            created_at: new Date().toISOString()
          });
          if (error) throw error;

          titleInput.value = "";
          linkInput.value = "";
          await loadPosts();
        } catch (err) {
          alert("❌ 글 추가 실패: " + err.message);
        }
      });
    });
  </script>
</body>
</html>
