<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>운영자 게시판 | SWING INVESTOR</title>
  <link rel="stylesheet" href="../style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../common.js"></script>
  <style>
    body { font-family: "Pretendard", sans-serif; background: #f8fafc; margin:0; padding:0; }
    main { max-width:900px; margin:30px auto; background:#fff; border-radius:10px; box-shadow:0 3px 10px rgba(0,0,0,0.05); padding:20px; }
    h2 { text-align:center; color:#1e293b; margin-bottom:20px; }
    table { width:100%; border-collapse:collapse; margin-top:20px; }
    th, td { padding:12px; border-bottom:1px solid #e5e7eb; text-align:left; }
    th { background:#f1f5f9; }
    tr:hover { background:#f0f9ff; cursor:pointer; }
    #adminToolbar { margin-bottom:15px; text-align:right; }
    #adminToolbar button { background:#2563eb; color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; }
    #adminToolbar button:hover { background:#1d4ed8; }
    footer { text-align:center; padding:16px; font-size:0.8rem; color:#777; background:#f1f5f9; border-top:1px solid #e5e7eb; margin-top:50px; }
  </style>
</head>
<body>
  <div id="header-container"></div>
  <script>
    fetch("../header.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("header-container").innerHTML = html;
        if (typeof SWINGINV_updateHeaderAuthUI === "function")
          SWINGINV_updateHeaderAuthUI();
      });
  </script>

  <main>
    <h2>📋 운영자 게시판</h2>
    <div id="adminToolbar" style="display:none;">
      <button id="addPostBtn">➕ 글 추가</button>
    </div>
    <table id="postsTable">
      <thead>
        <tr>
          <th>번호</th>
          <th>제목</th>
          <th>작성자</th>
          <th>작성일</th>
        </tr>
      </thead>
      <tbody id="postsBody">
        <tr><td colspan="4" style="text-align:center;">⏳ 로딩 중...</td></tr>
      </tbody>
    </table>
  </main>

  <footer>© 2025 SWING INVESTOR | 데이터 제공: Supabase</footer>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      let db;
      for (let i=0;i<25;i++){
        if(window.SWINGINV?.db){ db=SWINGINV.db; break; }
        await new Promise(r=>setTimeout(r,200));
      }
      if(!db){ alert("Supabase 초기화 실패"); return; }

      const user = SWINGINV.user;

      // 운영자 체크
      let isAdmin = false;
      if(user){
        const { data: admin } = await db.from("admins").select("user_id").eq("user_id", user.id).maybeSingle();
        if(admin) isAdmin = true;
      }

      if(isAdmin) document.getElementById("adminToolbar").style.display="block";

      const postsBody = document.getElementById("postsBody");

      // 게시글 로드
      const loadPosts = async () => {
        postsBody.innerHTML = `<tr><td colspan="4" style="text-align:center;">⏳ 로딩 중...</td></tr>`;
        try{
          const { data, error } = await db.from("posts").select("*").order("created_at",{ascending:false});
          if(error) throw error;
          if(!data?.length){
            postsBody.innerHTML = `<tr><td colspan="4" style="text-align:center;">📭 게시글이 없습니다.</td></tr>`;
            return;
          }

          postsBody.innerHTML = data.map((p,i)=>`
            <tr data-link="${p.link}">
              <td>${i+1}</td>
              <td>${p.title}</td>
              <td>${p.author||"-"}</td>
              <td>${new Date(p.created_at).toLocaleString()}</td>
            </tr>
          `).join("");

          // 제목 클릭 → 블로그 링크 이동
          document.querySelectorAll("#postsBody tr").forEach(row=>{
            row.addEventListener("click", ()=>{
              const link = row.dataset.link;
              if(link) window.open(link,"_blank");
            });
          });
        }catch(err){
          console.error("게시글 로드 오류:", err);
          postsBody.innerHTML = `<tr><td colspan="4" style="text-align:center;color:red;">❌ 로드 실패</td></tr>`;
        }
      };

      await loadPosts();

      // 글 추가 버튼
      document.getElementById("addPostBtn")?.addEventListener("click", async ()=>{
        const title = prompt("글 제목 입력");
        const link = prompt("블로그 URL 입력");
        if(!title||!link) return alert("제목과 링크는 필수입니다.");
        try{
          const { error } = await db.from("posts").insert({
            title, link, author: user?.email||"운영자", created_at: new Date().toISOString()
          });
          if(error) throw error;
          alert("✅ 글이 등록되었습니다!");
          await loadPosts();
        }catch(err){
          alert("❌ 등록 실패: "+err.message);
        }
      });
    });
  </script>
</body>
</html>
