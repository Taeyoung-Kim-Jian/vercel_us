<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>게시판</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="common.js"></script>
  <style>
    #nickname-display {
      font-weight: bold;
      color: #333;
      margin-left: 10px;
    }
  </style>
</head>
<body>
  <header>
    <h1>게시판</h1>
    <div id="auth-section">
      <button id="login-btn">로그인</button>
      <button id="logout-btn" style="display:none;">로그아웃</button>
      <span id="nickname-display"></span>
    </div>
  </header>

  <main>
    <div id="post-list"></div>
  </main>

  <script>
    console.log("📄 board.html loaded");

    // ✅ Supabase 클라이언트 (common.js에서 전역 SWINGINV로 초기화된 상태)
    const supabase = SWINGINV.db;

    const loginBtn = document.getElementById("login-btn");
    const logoutBtn = document.getElementById("logout-btn");
    const nicknameDisplay = document.getElementById("nickname-display");

    // ✅ 로그인 상태 확인 및 닉네임 표시 함수
    async function updateUserUI() {
      const { data: { user } } = await supabase.auth.getUser();
      if (user) {
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
        nicknameDisplay.textContent = user.user_metadata?.nickname || user.email || "사용자";
      } else {
        loginBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";
        nicknameDisplay.textContent = "";
      }
    }

    // ✅ 로그인/로그아웃 버튼 이벤트
    loginBtn.addEventListener("click", async () => {
      // 기존 로그인 로직 유지 (예: OAuth나 Supabase Sign-in Modal)
      window.location.href = "/login.html"; // 기존 경로 그대로 유지
    });

    logoutBtn.addEventListener("click", async () => {
      await supabase.auth.signOut();
      await updateUserUI();
    });

    // ✅ 초기 로드 시 로그인 상태 반영
    updateUserUI();

    // ✅ 세션 변경 감지 — 다른 페이지에서 로그인/로그아웃 시 동기화
    supabase.auth.onAuthStateChange(() => {
      updateUserUI();
    });

    // ✅ 게시글 로드 함수 (기존 로직은 수정하지 않음)
    async function loadPosts() {
      try {
        const { data, error } = await SWINGINV.db.from("posts").select("*").order("created_at", { ascending: false });
        if (error) throw error;
        const postList = document.getElementById("post-list");
        postList.innerHTML = data.map(p => `
          <div class="post">
            <h3>${p.title}</h3>
            <p>${p.content}</p>
          </div>
        `).join("");
      } catch (err) {
        console.error("❌ 게시글 로드 오류:", err);
      }
    }

    loadPosts();
  </script>
</body>
</html>
