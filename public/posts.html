<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>월별 성과 | SWING INVESTOR</title>
  <link rel="stylesheet" href="./style.css" />

  <!-- ✅ Supabase 및 공통 스크립트는 반드시 head 안에서 동기 로드 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./common.js"></script>
</head>

<body>
  <!-- 공통 헤더 -->
  <div id="header-container"></div>

  <script>
    async function loadHeaderAndInit() {
      try {
        const r = await fetch("./header.html");
        const html = await r.text();
        document.getElementById("header-container").innerHTML = html;
        if (typeof SWINGINV_updateHeaderAuthUI === "function") SWINGINV_updateHeaderAuthUI();

        // ✅ Supabase 클라이언트 준비 대기
        await waitForSwingInv();

        // ✅ Supabase 연결 확인 후 테이블 로드
        console.log("✅ Supabase 연결 확인 완료, loadMonthTable 실행");
        await loadMonthTable();
      } catch (e) {
        console.error("❌ 헤더 로드 또는 초기화 오류:", e);
      }
    }

    // ✅ SWINGINV 준비 대기 함수
    function waitForSwingInv() {
      return new Promise((resolve, reject) => {
        let tries = 0;
        const check = () => {
          tries++;
          if (window.SWINGINV?.db) {
            console.log("✅ SWINGINV.db 초기화 감지");
            resolve();
          } else if (tries > 50) {
            reject(new Error("SWINGINV 초기화 실패"));
          } else {
            setTimeout(check, 100);
          }
        };
        check();
      });
    }

    document.addEventListener("DOMContentLoaded", loadHeaderAndInit);
  </script>

  <main class="content">
    <h2>📅 월별 성과</h2>
    <p style="color:#555;">월별로 측정된 주요 종목의 수익률과 패턴을 확인하고 상세 차트로 이동하세요.</p>

    <!-- 월 탭 -->
    <div id="month-tabs"></div>

    <!-- 패턴 필터 -->
    <div class="pattern-filter">
      <button class="active" data-pattern="전체">전체</button>
      <button data-pattern="돌파">돌파</button>
      <button data-pattern="돌파눌림">돌파눌림</button>
      <button data-pattern="박스권">박스권</button>
      <button data-pattern="이탈">이탈</button>
      <button data-pattern="기타">기타</button>
    </div>

    <!-- 테이블 -->
    <div class="table-container">
      <table class="month-table">
        <thead>
          <tr>
            <th>종목명</th>
            <th>측정일</th>
            <th>측정일 종가</th>
            <th>현재가</th>
            <th>측정일 대비 수익률</th>
            <th>최고 수익률</th>
            <th>최저 수익률</th>
            <th>패턴</th>
          </tr>
        </thead>
        <tbody id="month-table-body">
          <tr><td colspan="8" style="text-align:center;">⏳ 데이터를 불러오는 중...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer>© 2025 SWING INVESTOR | 데이터 제공: Supabase</footer>

  <script>
    async function loadMonthTable() {
      const tbody = document.getElementById("month-table-body");
      const monthTabs = document.getElementById("month-tabs");
      const patternButtons = document.querySelectorAll('.pattern-filter button');
      let allData = [];

      try {
        console.log("🔄 Supabase 데이터 불러오는 중...");
        const { data, error } = await SWINGINV.db
          .from("monthly_performance_view")
          .select("종목명, 종목코드, 측정일, 측정일종가, 현재가, 측정일대비수익률, 최고수익률, 최저수익률, pattern, 월구분")
          .order("측정일", { ascending: false });

        if (error) throw error;

        if (!data || data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;">📭 표시할 데이터가 없습니다.</td></tr>`;
          return;
        }

        allData = data;

        // ✅ 월 탭 생성
        const months = [...new Set(data.map(d => d.월구분))].sort((a, b) => b.localeCompare(a));
        monthTabs.innerHTML = months
          .map(m => `<button data-month="${m}" ${m === months[0] ? 'class="active"' : ''}>${m}</button>`)
          .join('');

        function renderTable() {
          const activeMonth = document.querySelector('#month-tabs button.active')?.dataset.month;
          const activePattern = document.querySelector('.pattern-filter button.active')?.dataset.pattern;

          tbody.innerHTML = allData
            .filter(d =>
              (activeMonth === '전체' || d.월구분 === activeMonth) &&
              (activePattern === '전체' || (d.pattern || "기타") === activePattern)
            )
            .map(d => `
              <tr class="clickable-row" data-name="${d.종목명}" data-code="${d.종목코드}">
                <td>${SWINGINV.esc(d.종목명)}</td>
                <td>${d.측정일}</td>
                <td>${SWINGINV.nf(d.측정일종가)}</td>
                <td>${SWINGINV.nf(d.현재가)}</td>
                <td>${SWINGINV.fmtPct(d.측정일대비수익률)}</td>
                <td>${SWINGINV.fmtPct(d.최고수익률)}</td>
                <td>${SWINGINV.fmtPct(d.최저수익률)}</td>
                <td>${d.pattern || "기타"}</td>
              </tr>
            `).join('');

          document.querySelectorAll(".clickable-row").forEach(row => {
            row.addEventListener("click", () => {
              const name = encodeURIComponent(row.dataset.name);
              const code = encodeURIComponent(row.dataset.code);
              location.href = `detail.html?name=${name}&code=${code}`;
            });
          });
        }

        renderTable();

        // ✅ 월 탭 클릭 이벤트
        document.querySelectorAll('#month-tabs button').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('#month-tabs button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderTable();
          });
        });

        // ✅ 패턴 필터 클릭 이벤트
        patternButtons.forEach(btn => {
          btn.addEventListener('click', () => {
            patternButtons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderTable();
          });
        });

      } catch (err) {
        console.error("❌ 데이터 로드 오류:", err);
        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;">데이터를 불러오지 못했습니다.</td></tr>`;
      }
    }
  </script>
</body>
</html>
