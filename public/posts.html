<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>운영자 게시판</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="common.js"></script>
  <style>
    body { font-family: 'Pretendard', sans-serif; padding: 20px; }
    h1 { font-size: 24px; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
    a { color: #0077cc; text-decoration: none; }
    a:hover { text-decoration: underline; }
    #addPostBtn { 
      margin-bottom: 20px; 
      padding: 10px 16px; 
      background-color: #0077cc; 
      color: white; 
      border: none; 
      border-radius: 6px; 
      cursor: pointer;
    }
    #addPostBtn:hover { background-color: #005fa3; }
  </style>
</head>
<body>
  <h1>📢 운영자 게시판</h1>

  <!-- 글 추가 버튼 (운영자만 보임) -->
  <button id="addPostBtn" style="display:none;">+ 글 추가</button>

  <!-- 게시글 목록 -->
  <table>
    <thead>
      <tr><th>제목</th><th>등록일</th></tr>
    </thead>
    <tbody id="postList"></tbody>
  </table>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // ✅ Supabase 초기화 (common.js에서 전역 객체로 설정되어 있어야 함)
      if (typeof SWINGINV === 'undefined' || !SWINGINV.db) {
        console.error("❌ Supabase 초기화 실패: common.js를 확인하세요.");
        return;
      }
      const supabase = SWINGINV.db;

      const { data: { user } } = await supabase.auth.getUser();
      const addPostBtn = document.getElementById("addPostBtn");
      const postList = document.getElementById("postList");

      // ✅ 운영자인지 확인
      let isAdmin = false;
      if (user) {
        const { data: adminCheck } = await supabase
          .from("admins")
          .select("*")
          .eq("user_id", user.id)
          .single();

        if (adminCheck) {
          isAdmin = true;
          addPostBtn.style.display = "inline-block";
        }
      }

      // ✅ 게시글 불러오기
      async function loadPosts() {
        const { data: posts, error } = await supabase
          .from("posts")
          .select("*")
          .order("created_at", { ascending: false });

        if (error) {
          console.error("❌ 게시글 불러오기 실패:", error.message);
          return;
        }

        postList.innerHTML = "";
        posts.forEach(post => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td><a href="${post.url}" target="_blank">${post.title}</a></td>
            <td>${new Date(post.created_at).toLocaleString()}</td>
          `;
          postList.appendChild(tr);
        });
      }

      await loadPosts();

      // ✅ 글 추가 버튼 클릭 (운영자만 가능)
      addPostBtn.addEventListener("click", async () => {
        if (!isAdmin) {
          alert("운영자만 글을 작성할 수 있습니다.");
          return;
        }

        const title = prompt("게시글 제목을 입력하세요:");
        if (!title) return;

        const url = prompt("이동할 블로그 URL을 입력하세요 (https://...):");
        if (!url || !url.startsWith("http")) {
          alert("올바른 URL을 입력하세요.");
          return;
        }

        const { error } = await supabase.from("posts").insert([{ title, url }]);
        if (error) {
          alert("글 추가 중 오류 발생: " + error.message);
        } else {
          alert("글이 추가되었습니다!");
          await loadPosts();
        }
      });
    });
  </script>
</body>
</html>
