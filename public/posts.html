<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>운영자 게시판</title>

  <!-- ✅ 공통 스타일 -->
  <link rel="stylesheet" href="../style.css" />
  <style>
    h1 {
      text-align: center;
      font-size: 1.4rem;
      margin-top: 20px;
      margin-bottom: 20px;
    }
    #addPostBtn {
      display: block;
      margin: 0 auto 20px;
      padding: 8px 16px;
      font-size: 0.9rem;
      border: none;
      background-color: #0066cc;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }
    #addPostBtn:hover {
      background-color: #004a99;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      background-color: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.1);
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }
    th {
      background-color: #f4f4f4;
    }
    td a {
      color: #0077cc;
      text-decoration: none;
    }
    td a:hover {
      text-decoration: underline;
    }
    .action-btn {
      margin-right: 6px;
      padding: 4px 8px;
      border: none;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .edit-btn {
      background-color: #ffaa00;
      color: white;
    }
    .delete-btn {
      background-color: #e74c3c;
      color: white;
    }
  </style>
</head>
<body>
  <!-- ✅ 공통 헤더 -->
  <div id="header-container"></div>

  <main class="content">
    <h1>📢 운영자 게시판</h1>
    <button id="addPostBtn" style="display:none;">+ 글 추가</button>
    <table>
      <thead>
        <tr>
          <th>제목</th>
          <th>등록일</th>
          <th>관리</th>
        </tr>
      </thead>
      <tbody id="postList"></tbody>
    </table>
  </main>

  <!-- ✅ Supabase와 공통 스크립트 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../common.js"></script>

  <script>
    // ✅ 공통 Supabase 로딩 대기 (다른 페이지와 동일)
    function waitForSwingInv() {
      return new Promise((resolve, reject) => {
        let tries = 0;
        const check = () => {
          tries++;
          if (window.SWINGINV?.db) resolve();
          else if (tries > 50) reject(new Error("SWINGINV 초기화 실패"));
          else setTimeout(check, 100);
        };
        check();
      });
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const header = document.getElementById("header-container");
      const postList = document.getElementById("postList");
      const addPostBtn = document.getElementById("addPostBtn");

      // ✅ 공통 헤더 로드
      const headerHTML = await fetch("../header.html").then(r => r.text());
      header.innerHTML = headerHTML;

      // ✅ Supabase 준비 대기
      await waitForSwingInv();
      const db = SWINGINV.db;
      console.log("✅ Supabase 연결 완료");

      // ✅ 로그인 유저 가져오기
      const { data: { user } } = await db.auth.getUser();
      let isAdmin = false;

      if (user) {
        const { data: adminData } = await db
          .from("admins")
          .select("uid")
          .eq("uid", user.id)
          .maybeSingle();

        if (adminData) {
          isAdmin = true;
          addPostBtn.style.display = "block";
        }
      }

      // ✅ 게시글 불러오기
      async function loadPosts() {
        const { data: posts, error } = await db
          .from("posts")
          .select("*")
          .order("created_at", { ascending: false });

        if (error) {
          postList.innerHTML = `<tr><td colspan="3">데이터 로드 오류</td></tr>`;
          return;
        }

        postList.innerHTML = "";
        posts.forEach((post) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td><a href="${post.url}" target="_blank">${post.title}</a></td>
            <td>${new Date(post.created_at).toLocaleString()}</td>
            <td>
              ${
                isAdmin
                  ? `<button class="action-btn edit-btn" data-id="${post.id}">수정</button>
                     <button class="action-btn delete-btn" data-id="${post.id}">삭제</button>`
                  : "-"
              }
            </td>
          `;
          postList.appendChild(tr);
        });
      }

      await loadPosts();

      // ✅ 글 추가
      addPostBtn.addEventListener("click", async () => {
        const title = prompt("제목을 입력하세요:");
        if (!title) return;

        const url = prompt("링크(URL)를 입력하세요 (예: https://blog.naver.com/...):");
        if (!url) return;

        const { error } = await db
          .from("posts")
          .insert([{ title, url, author_id: user.id }]);

        if (error) alert("등록 실패: " + error.message);
        else await loadPosts();
      });

      // ✅ 수정 / 삭제 (이벤트 위임)
      postList.addEventListener("click", async (e) => {
        if (!isAdmin) return;
        const id = e.target.dataset.id;

        if (e.target.classList.contains("edit-btn")) {
          const title = prompt("새 제목:");
          if (!title) return;

          const url = prompt("새 URL:");
          if (!url) return;

          await db.from("posts").update({ title, url }).eq("id", id);
          await loadPosts();
        } else if (e.target.classList.contains("delete-btn")) {
          if (confirm("정말 삭제하시겠습니까?")) {
            await db.from("posts").delete().eq("id", id);
            await loadPosts();
          }
        }
      });
    });
  </script>
</body>
</html>
