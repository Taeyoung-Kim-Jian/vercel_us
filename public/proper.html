<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💰 스윙 적정가격 | SWING INVESTOR</title>
  <link rel="stylesheet" href="./style.css" />

  <!-- ✅ Supabase & Common -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./common.js"></script>
</head>

<body>
  <!-- ✅ 공통 헤더 로드 -->
  <div id="header-container"></div>
  <script>
    fetch("./header.html")
      .then((r) => r.text())
      .then((html) => {
        document.getElementById("header-container").innerHTML = html;
        if (typeof SWINGINV_updateHeaderAuthUI === "function") {
          SWINGINV_updateHeaderAuthUI();
        }
      });
  </script>

  <!-- ================================
       💰 스윙 적정가격 본문
  ================================= -->
  <main>
    <section class="table-section">
      <h2>💰 스윙 적정가격</h2>
      <table class="data-table">
        <thead>
          <tr>
            <th>종목명</th>
            <th>적정매수가</th>
            <th>현재가</th>
            <th>괴리율</th>
          </tr>
        </thead>
        <tbody id="swing-table-body">
          <tr><td colspan="4">데이터를 불러오는 중...</td></tr>
        </tbody>
      </table>
      <button id="loadMoreSwingBtn" class="load-btn">더보기</button>
    </section>
  </main>

  <!-- ================================
       ⚙️ 푸터
  ================================= -->
  <footer>
    <p>© 2025 SWING INVESTOR | 데이터 제공: Supabase</p>
  </footer>

  <!-- ✅ 페이지 전용 스크립트 -->
  <script src="./proper.js"></script>
</body>
</html>
