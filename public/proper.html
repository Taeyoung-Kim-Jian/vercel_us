<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SWING INVESTOR - 적정가 조회</title>

  <!-- ✅ 스타일 -->
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: #f6f8fa;
    }
    h1 {
      text-align: center;
      margin: 20px 0;
      color: #222;
    }
    table {
      width: 90%;
      max-width: 800px;
      margin: 0 auto;
      border-collapse: collapse;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    th, td {
      padding: 12px 10px;
      text-align: center;
      border-bottom: 1px solid #eee;
    }
    th {
      background: #f1f3f5;
      color: #333;
      font-weight: 600;
    }
    tr:hover {
      background: #f8fafc;
      cursor: pointer;
    }
    .loading, .error {
      text-align: center;
      padding: 30px;
      color: #666;
    }
  </style>

  <!-- ✅ Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1>💰 적정가 기반 종목 리스트</h1>

  <table>
    <thead>
      <tr>
        <th>종목명</th>
        <th>적정매수가</th>
        <th>현재가</th>
        <th>괴리율</th>
      </tr>
    </thead>
    <tbody id="swing-table-body">
      <tr><td colspan="4" class="loading">⏳ 데이터를 불러오는 중...</td></tr>
    </tbody>
  </table>

  <script>
    // ✅ Supabase 클라이언트 초기화
    const SUPABASE_URL = "https://YOUR_PROJECT.supabase.co";
    const SUPABASE_KEY = "YOUR_ANON_PUBLIC_KEY";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ✅ 숫자 포맷
    const nf = (n) => n?.toLocaleString() ?? "-";
    const fmtPct = (v) => (v !== null && v !== undefined ? v.toFixed(2) + "%" : "-");
    const esc = (s) => String(s).replace(/[&<>"']/g, (m) => ({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
    }[m]));

    document.addEventListener("DOMContentLoaded", async () => {
      const tbody = document.getElementById("swing-table-body");

      try {
        const { data, error } = await supabase
          .from("swing_proper_view")
          .select("*")
          .order("괴리율", { ascending: true });

        if (error) throw error;

        if (!data || data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" class="error">📭 표시할 종목이 없습니다.</td></tr>`;
          return;
        }

        tbody.innerHTML = data.map((r) => `
          <tr class="clickable-row" data-code="${r.종목코드}" data-name="${esc(r.종목명)}">
            <td>${esc(r.종목명)}</td>
            <td>${nf(r.적정매수가)}</td>
            <td>${nf(r.현재가)}</td>
            <td>${fmtPct(r.괴리율)}</td>
          </tr>
        `).join("");

        // ✅ 클릭 이벤트
        document.querySelectorAll(".clickable-row").forEach((row) => {
          row.addEventListener("click", () => {
            const name = row.dataset.name;
            const code = row.dataset.code;
            location.href = `detail.html?name=${encodeURIComponent(name)}&code=${code}`;
          });
        });
      } catch (err) {
        console.error("❌ 데이터 로드 오류:", err);
        tbody.innerHTML = `<tr><td colspan="4" class="error">데이터를 불러오지 못했습니다.</td></tr>`;
      }
    });
  </script>
</body>
</html>
