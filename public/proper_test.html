<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스윙 종목 | SWING INVESTOR</title>

  <!-- ✅ 기본 스타일 -->
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="./common.js"></script>
</head>

<body>
  <!-- ✅ 공통 헤더 -->
  <div id="header-container"></div>
  <script>
    fetch("./header.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("header-container").innerHTML = html;
        if (typeof SWINGINV_updateHeaderAuthUI === "function")
          SWINGINV_updateHeaderAuthUI();
      });
  </script>

  <main class="content">
    <h2>💰 스윙 종목 리스트</h2>
    <p style="color:#555;">현재 적정 매수가 대비 괴리율이 낮은 종목들을 확인하세요.</p>

    <!-- ✅ 패턴 필터 버튼 -->
    <div class="pattern-filter">
      <button class="active" data-pattern="전체">전체</button>
      <button data-pattern="돌파">돌파</button>
      <button data-pattern="돌파눌림">돌파눌림</button>
      <button data-pattern="박스권">박스권</button>
      <button data-pattern="이탈">이탈</button>
      <button data-pattern="기타">기타</button>
    </div>

    <!-- ✅ 테이블 -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>종목명</th>
            <th>적정 매수가</th>
            <th>현재가</th>
            <th>괴리율</th>
            <th>패턴</th>
          </tr>
        </thead>
        <tbody id="swing-table-body">
          <tr>
            <td colspan="5" style="text-align:center;">⏳ 데이터를 불러오는 중...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- ✅ 모달 창 -->
  <div id="chartModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">종목 차트</h3>
        <span class="modal-close">&times;</span>
      </div>
      <div class="modal-body">
        <canvas id="priceChart"></canvas>
      </div>
    </div>
  </div>

  <footer>© 2025 SWING INVESTOR | 데이터 제공: Supabase</footer>

  <script>
    let chartInstance = null;

    // ✅ 모달 열기/닫기 함수
    function openModal() {
      document.getElementById('chartModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('chartModal').style.display = 'none';
      if (chartInstance) {
        chartInstance.destroy();
        chartInstance = null;
      }
    }

    // ✅ 차트 그리기 함수
    async function showChart(code, name) {
      openModal();
      document.getElementById('modalTitle').textContent = `${name} (${code})`;

      const canvas = document.getElementById('priceChart');
      const ctx = canvas.getContext('2d');

      // 기존 차트 제거
      if (chartInstance) {
        chartInstance.destroy();
      }

      // 로딩 표시
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.font = '16px Arial';
      ctx.fillStyle = '#666';
      ctx.textAlign = 'center';
      ctx.fillText('차트를 불러오는 중...', canvas.width / 2, canvas.height / 2);

      try {
        // ✅ prices 테이블에서 종가 데이터 가져오기
        const { data: priceData, error: priceError } = await SWINGINV.db
          .from('prices')
          .select('날짜, 종가')
          .eq('종목코드', code)
          .order('날짜', { ascending: true });

        if (priceError) throw priceError;

        // ✅ bt_points 테이블에서 b가격 데이터 가져오기
        const { data: btData, error: btError } = await SWINGINV.db
          .from('bt_points')
          .select('b날짜, b가격')
          .eq('종목코드', code)
          .order('b날짜', { ascending: true });

        if (btError) throw btError;

        if (!priceData || priceData.length === 0) {
          ctx.fillText('가격 데이터가 없습니다.', canvas.width / 2, canvas.height / 2);
          return;
        }

        // ✅ 차트 데이터 준비
        const labels = priceData.map(d => d.날짜);
        const prices = priceData.map(d => d.종가);

        // bt_points를 날짜별로 매핑
        const btMap = {};
        if (btData) {
          btData.forEach(bt => {
            btMap[bt.b날짜] = bt.b가격;
          });
        }

        // 각 날짜에 대응하는 b가격 (없으면 null)
        const btPrices = labels.map(date => btMap[date] || null);

        // ✅ Chart.js로 차트 그리기
        chartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [
              {
                label: '종가',
                data: prices,
                borderColor: '#007bff',
                backgroundColor: 'rgba(0, 123, 255, 0.1)',
                borderWidth: 2,
                pointRadius: 0,
                tension: 0.1
              },
              {
                label: 'B가격',
                data: btPrices,
                borderColor: '#ff4444',
                backgroundColor: '#ff4444',
                borderWidth: 0,
                pointRadius: 5,
                pointStyle: 'circle',
                showLine: false
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
              intersect: false,
              mode: 'index'
            },
            plugins: {
              legend: {
                display: true,
                position: 'top'
              },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    let label = context.dataset.label || '';
                    if (label) {
                      label += ': ';
                    }
                    if (context.parsed.y !== null) {
                      label += new Intl.NumberFormat('ko-KR').format(context.parsed.y) + '원';
                    }
                    return label;
                  }
                }
              }
            },
            scales: {
              x: {
                display: true,
                grid: { display: true }, // 축선도 숨김
                title: {
                  display: false,
                  text: '날짜'
                },
                ticks: {
                  display: false // 라벨(날짜) 숨김
 
                }
              },
              y: {
                display: true,
                grid: { display: true }, // 축선도 숨김
                title: {
                  display: false,
                  text: '가격 (원)'
                },
                ticks: {
                  display: false, // 라벨(날짜) 숨김
                  callback: function(value) {
                    return new Intl.NumberFormat('ko-KR').format(value);
                  }
                }
              }
            }
          }
        });

      } catch (err) {
        console.error('❌ 차트 로드 오류:', err);
        ctx.fillStyle = '#ff4444';
        ctx.fillText('차트를 불러올 수 없습니다.', canvas.width / 2, canvas.height / 2);
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const tbody = document.getElementById("swing-table-body");
      SWINGINV.showLoading(tbody);

      // ✅ 모달 닫기 이벤트
      document.querySelector('.modal-close').addEventListener('click', closeModal);
      document.getElementById('chartModal').addEventListener('click', (e) => {
        if (e.target.id === 'chartModal') closeModal();
      });

      try {
        // ✅ Supabase에서 pattern 포함 데이터 가져오기
        const { data, error } = await SWINGINV.db
          .from("swing_proper_view")
          .select("종목코드, 종목명, 적정매수가, 현재가, 괴리율, pattern")
          .order("괴리율", { ascending: true });

        if (error) throw error;

        if (!data || data.length === 0) {
          SWINGINV.showError(tbody, "📭 표시할 종목이 없습니다.");
          return;
        }

        // ✅ 데이터 렌더링 (pattern 포함)
        tbody.innerHTML = data
          .map(
            (r) => `
              <tr class="clickable-row" data-code="${r.종목코드}" data-name="${r.종목명}">
                <td>${SWINGINV.esc(r.종목명)}</td>
                <td style="text-align:center;">${SWINGINV.nf(r.적정매수가)}</td>
                <td style="text-align:center;">${SWINGINV.nf(r.현재가)}</td>
                <td style="text-align:center;">${SWINGINV.fmtPct(r.괴리율)}</td>
                <td style="text-align:center;">${r.pattern ? r.pattern : "기타"}</td>
              </tr>
            `
          )
          .join("");

        // ✅ 클릭 시 모달 차트 표시
        document.querySelectorAll(".clickable-row").forEach((row) => {
          row.addEventListener("click", () => {
            const name = row.dataset.name;
            const code = row.dataset.code;
            showChart(code, name);
          });
        });

        // ✅ 패턴 필터 기능
        document.querySelectorAll('.pattern-filter button').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.pattern-filter button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const pattern = btn.dataset.pattern;
            const rows = document.querySelectorAll('#swing-table-body tr');

            rows.forEach(row => {
              const cell = row.querySelector('td:nth-child(5)');
              if (!cell) return;
              const rowPattern = cell.textContent.trim();
              if (pattern === "전체" || rowPattern === pattern) {
                row.style.display = "";
              } else {
                row.style.display = "none";
              }
            });
          });
        });

      } catch (err) {
        console.error("❌ 데이터 로드 오류:", err);
        SWINGINV.showError(tbody, "데이터를 불러오지 못했습니다.");
      }
    });
  </script>

  <!-- ✅ 스타일 -->
  <style>
    .pattern-filter {
      margin: 16px 0;
      text-align: center;
    }
    .pattern-filter button {
      margin: 0 4px;
      padding: 6px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #f8f8f8;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .pattern-filter button.active {
      background: #007bff;
      color: #fff;
      border-color: #007bff;
    }
    .pattern-filter button:hover {
      background: #007bff20;
    }

    /* 모달 스타일 */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background-color: #fff;
      border-radius: 12px;
      width: 90%;
      max-width: 900px;
      max-height: 90vh;
      overflow: auto;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      border-bottom: 1px solid #e0e0e0;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 1.5rem;
      color: #333;
    }

    .modal-close {
      font-size: 28px;
      font-weight: bold;
      color: #aaa;
      cursor: pointer;
      transition: color 0.2s;
    }

    .modal-close:hover {
      color: #000;
    }

    .modal-body {
      padding: 20px;
    }

    #priceChart {
      width: 100% !important;
      height: 400px !important;
    }
  </style>
</body>
</html>
