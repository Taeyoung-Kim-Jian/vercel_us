<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관심 종목 수익률 랭킹 | SWING INVESTOR</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./common.js"></script>
  <script src="./auth.js"></script>

  <style>
    body {
      font-family: "Noto Sans KR", sans-serif;
      background: #f9fafb;
      margin: 0;
      padding: 0;
    }
    /* 헤더 */
    header {
      background: #1e40af;
      color: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
    }
    .auth-area span {
      margin-right: 10px;
    }
    .auth-area button {
      background: white;
      color: #1e40af;
      border: none;
      border-radius: 6px;
      padding: 5px 10px;
      cursor: pointer;
    }
    .gnb {
      display: flex;
      justify-content: center;
      background: #2563eb;
    }
    .gnb button {
      flex: 1;
      border: none;
      background: #2563eb;
      color: white;
      padding: 12px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .gnb button:hover,
    .gnb button.active {
      background: #1e3a8a;
    }

    /* 본문 */
    main {
      padding: 20px;
      max-width: 960px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      font-size: 1.4rem;
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    thead {
      background: #2563eb;
      color: white;
    }
    th, td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #e5e7eb;
    }
    tr:hover {
      background: #f1f5f9;
    }
    th {
      font-weight: 600;
    }
    .up {
      color: #d32f2f;
      font-weight: 600;
    }
    .down {
      color: #1976d2;
      font-weight: 600;
    }
  </style>
</head>

<body>
