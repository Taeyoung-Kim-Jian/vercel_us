<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>랭킹 | SWING INVESTOR</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./common.js"></script>
  <style>
    .tab-bar {
      text-align: center;
      margin-bottom: 20px;
    }
    .tab-bar button {
      margin: 0 5px;
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      background: #e5e7eb;
      cursor: pointer;
    }
    .tab-bar button.active {
      background: #2563eb;
      color: white;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    th {
      background: #2563eb;
      color: white;
      padding: 10px;
    }
    td {
      border-bottom: 1px solid #e5e7eb;
      padding: 10px;
      text-align: center;
    }
  </style>
</head>

<body>
  <!-- ✅ 공통 헤더 -->
  <div id="header-container"></div>
  <script>
    fetch("./header.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("header-container").innerHTML = html;
        if (typeof SWINGINV_updateHeaderAuthUI === "function") SWINGINV_updateHeaderAuthUI();
      });
  </script>

  <main class="content">
    <section class="page-header">
      <h2>📊 관심종목 랭킹</h2>
      <p>공개된 종목과 나의 관심종목을 함께 확인해보세요.</p>
    </section>

    <!-- ✅ 탭 -->
    <div class="tab-bar">
      <button class="tab active" data-tab="ranking">전체 랭킹</button>
      <button class="tab" data-tab="mywatch">나의 관심종목</button>
    </div>

    <div id="table-container">
      <p style="text-align:center;">⏳ 데이터를 불러오는 중...</p>
    </div>
  </main>

  <footer>© 2025 SWING INVESTOR | 데이터 제공: Supabase</footer>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const wait = (ms) => new Promise(r => setTimeout(r, ms));
      const container = document.getElementById("table-container");
      let db;

      // ✅ Supabase 로드 대기
      for (let i = 0; i < 20; i++) {
        if (window.SWINGINV?.db) { db = SWINGINV.db; break; }
        await wait(250);
      }

      if (!db) {
        container.innerHTML = "<p style='color:red;text-align:center;'>❌ Supabase 초기화 실패</p>";
        return;
      }

      const tabs = document.querySelectorAll(".tab");
      tabs.forEach((t) =>
        t.addEventListener("click", () => {
          tabs.forEach((b) => b.classList.remove("active"));
          t.classList.add("active");
          const type = t.dataset.tab;
          if (type === "ranking") loadRanking();
          else if (type === "mywatch") loadMyWatchlist();
        })
      );

      // ✅ 전체 랭킹 (공개 관심종목 TOP 20)
      async function loadRanking() {
        SWINGINV.showLoading(container, "📊 공개 관심종목 불러오는 중...");
        const { data, error } = await db
          .from("watchlist_with_return")
          .select("닉네임, 종목명, 등록일, 등록종가, 현재가, 수익률")
          .eq("공개여부", true)
          .order("수익률", { ascending: false })
          .limit(20);

        if (error) return SWINGINV.showError(container, "로드 실패: " + error.message);
        if (!data?.length) return (container.innerHTML = "<p style='text-align:center;'>📭 데이터 없음</p>");

        renderTable(data, "전체 랭킹");
      }

      // ✅ 나의 관심종목
      async function loadMyWatchlist() {
        const user = SWINGINV.user;
        if (!user) {
          container.innerHTML = `<p style='text-align:center;'>🔐 로그인 후 확인 가능합니다.</p>`;
          return;
        }

        SWINGINV.showLoading(container, "⭐ 나의 관심종목 불러오는 중...");

        const { data, error } = await db
          .from("watchlist_with_return")
          .select("닉네임, 종목명, 등록일, 등록종가, 현재가, 수익률")
          .eq("user_id", user.id)
          .order("등록일", { ascending: false });

        if (error) return SWINGINV.showError(container, "로드 실패: " + error.message);
        if (!data?.length)
          return (container.innerHTML = "<p style='text-align:center;'>📭 등록된 관심종목이 없습니다.</p>");

        renderTable(data, "나의 관심종목");
      }

      // ✅ 공통 테이블 렌더링 함수
      function renderTable(data, title) {
        let html = `
          <table>
            <thead>
              <tr>
                <th>순위</th>
                <th>닉네임</th>
                <th>종목명</th>
                <th>등록일</th>
                <th>등록종가</th>
                <th>현재가</th>
                <th>수익률</th>
              </tr>
            </thead>
            <tbody>
        `;
        data.forEach((row, i) => {
          const rate = parseFloat(row["수익률"]);
          const rateColor = rate >= 0 ? "#d32f2f" : "#1976d2";
          const rateSign = rate >= 0 ? "▲" : "▼";
          const nickname = row["닉네임"] || "익명";

          html += `
            <tr>
              <td>${i + 1}</td>
              <td>${SWINGINV.esc(nickname)}</td>
              <td style="text-align:left;">${SWINGINV.esc(row["종목명"])}</td>
              <td>${SWINGINV.fmtDate(row["등록일"])}</td>
              <td>${SWINGINV.nf(row["등록종가"])}</td>
              <td>${SWINGINV.nf(row["현재가"])}</td>
              <td style="font-weight:600;color:${rateColor};">${rateSign}${Math.abs(rate).toFixed(2)}%</td>
            </tr>`;
        });

        html += "</tbody></table>";
        container.innerHTML = html;
      }

      // ✅ 기본 탭 로드
      loadRanking();
    });
  </script>
</body>
</html>
