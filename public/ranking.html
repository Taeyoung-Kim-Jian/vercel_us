
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관심 종목 수익률 랭킹 | SWING INVESTOR</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./common.js"></script>

  <style>
    body {
      font-family: "Noto Sans KR", sans-serif;
      background: #f9fafb;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    thead {
      background: #2563eb;
      color: white;
    }
    th, td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #e5e7eb;
    }
    tr:hover {
      background: #f1f5f9;
    }
    th {
      font-weight: 600;
    }
    .up {
      color: #d32f2f;
      font-weight: 600;
    }
    .down {
      color: #1976d2;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <h1>📈 공개된 관심 종목 수익률 TOP 20</h1>

  <div id="table-wrap">
    <p style="text-align:center;">⏳ 데이터를 불러오는 중...</p>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      let db;
      for (let i = 0; i < 20; i++) {
        if (window.SWINGINV?.db) {
          db = SWINGINV.db;
          break;
        }
        await wait(250);
      }
      if (!db) {
        document.getElementById("table-wrap").innerHTML = "<p>❌ Supabase 초기화 실패</p>";
        return;
      }

      try {
        const { data, error } = await db
          .from("watchlist_with_return")
          .select("*")
          .eq("공개여부", true)
          .order("수익률", { ascending: false })
          .limit(20);

        if (error) throw error;
        if (!data || data.length === 0) {
          document.getElementById("table-wrap").innerHTML = "<p style='text-align:center;'>데이터가 없습니다.</p>";
          return;
        }

        let html = `
          <table>
            <thead>
              <tr>
                <th>순위</th>
                <th>종목명</th>
                <th>종목코드</th>
                <th>등록일</th>
                <th>등록종가</th>
                <th>현재가</th>
                <th>수익률</th>
              </tr>
            </thead>
            <tbody>
        `;

        data.forEach((row, i) => {
          const rate = parseFloat(row["수익률"]);
          const rateCls = rate >= 0 ? "up" : "down";
          html += `
            <tr>
              <td>${i + 1}</td>
              <td>${SWINGINV.esc(row["종목명"])}</td>
              <td>${row["종목코드"]}</td>
              <td>${SWINGINV.fmtDate(row["등록일"])}</td>
              <td>${SWINGINV.nf(row["등록종가"])}</td>
              <td>${SWINGINV.nf(row["현재가"])}</td>
              <td class="${rateCls}">${rate.toFixed(2)}%</td>
            </tr>
          `;
        });

        html += "</tbody></table>";
        document.getElementById("table-wrap").innerHTML = html;
      } catch (err) {
        console.error(err);
        document.getElementById("table-wrap").innerHTML =
          "<p style='text-align:center;color:red;'>❌ 데이터 로딩 실패: " + err.message + "</p>";
      }
    });
  </script>
</body>
</html>
