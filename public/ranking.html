<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>랭킹 | SWING INVESTOR</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./common.js"></script>

  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #f8fafc;
      margin: 0;
      padding: 0;
    }

    main {
      max-width: 1000px;
      margin: 40px auto;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
      padding: 20px;
    }

    h2 {
      margin-top: 0;
      color: #1e293b;
    }

    .tab-bar {
      text-align: center;
      margin-bottom: 20px;
    }

    .tab-bar button {
      margin: 0 6px;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      background: #e2e8f0;
      cursor: pointer;
      font-weight: 500;
      color: #334155;
      transition: all 0.2s;
    }

    .tab-bar button.active {
      background: #2563eb;
      color: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 14px;
    }

    thead {
      background-color: #2563eb;
      color: #fff;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #e2e8f0;
      text-align: center;
    }

    tbody tr:hover {
      background-color: #f1f5f9;
    }

    .del-btn {
      background: #ef4444;
      border: none;
      color: #fff;
      padding: 5px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.2s;
    }

    .del-btn:hover {
      background: #dc2626;
    }

    footer {
      text-align: center;
      padding: 30px 0;
      color: #555;
    }
  </style>
</head>

<body>
  <!-- ✅ 공통 헤더 -->
  <div id="header-container"></div>
  <script>
    fetch("./header.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("header-container").innerHTML = html;
        if (typeof SWINGINV_updateHeaderAuthUI === "function") SWINGINV_updateHeaderAuthUI();
      });
  </script>

  <main>
    <h2>📊 관심종목 랭킹</h2>
    <p style="color:#555;">공개된 상위 관심종목과 나의 관심종목을 함께 확인하세요.</p>

    <div class="tab-bar">
      <button class="tab active" data-tab="ranking">전체 랭킹</button>
      <button class="tab" data-tab="mywatch">나의 관심종목</button>
    </div>

    <div id="table-container">
      <p style="text-align:center;">⏳ 데이터를 불러오는 중...</p>
    </div>
  </main>

  <footer>© 2025 SWING INVESTOR | 데이터 제공: Supabase</footer>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const wait = (ms) => new Promise(r => setTimeout(r, ms));
      const container = document.getElementById("table-container");
      let db;

      // ✅ Supabase 로드 대기
      for (let i = 0; i < 20; i++) {
        if (window.SWINGINV?.db) { db = SWINGINV.db; break; }
        await wait(250);
      }

      if (!db) {
        container.innerHTML = "<p style='color:red;text-align:center;'>❌ Supabase 초기화 실패</p>";
        return;
      }

      const tabs = document.querySelectorAll(".tab");
      tabs.forEach((t) =>
        t.addEventListener("click", () => {
          tabs.forEach((b) => b.classList.remove("active"));
          t.classList.add("active");
          const type = t.dataset.tab;
          if (type === "ranking") loadRanking();
          else if (type === "mywatch") loadMyWatchlist();
        })
      );

      // ✅ 전체 랭킹 (공개 관심종목 TOP 20)
      async function loadRanking() {
        SWINGINV.showLoading(container, "📊 공개 관심종목 불러오는 중...");
        const { data, error } = await db
          .from("watchlist_with_return")
          .select("닉네임, 종목명, 등록일, 등록종가, 현재가, 수익률")
          .eq("공개여부", true)
          .order("수익률", { ascending: false })
          .limit(20);

        if (error) return SWINGINV.showError(container, "로드 실패: " + error.message);
        if (!data?.length) return (container.innerHTML = "<p style='text-align:center;'>📭 데이터 없음</p>");
        renderTable(data, false); // 삭제 버튼 없음
      }

      // ✅ 나의 관심종목
      async function loadMyWatchlist() {
        const user = SWINGINV.user;
        if (!user) {
          container.innerHTML = `<p style='text-align:center;'>🔐 로그인 후 확인 가능합니다.</p>`;
          return;
        }

        SWINGINV.showLoading(container, "⭐ 나의 관심종목 불러오는 중...");

        const { data, error } = await db
          .from("watchlist_with_return")
          .select("id, 닉네임, 종목명, 종목코드, 등록일, 등록종가, 현재가, 수익률")
          .eq("user_id", user.id)
          .order("등록일", { ascending: false });

        if (error) return SWINGINV.showError(container, "로드 실패: " + error.message);
        if (!data?.length)
          return (container.innerHTML = "<p style='text-align:center;'>📭 등록된 관심종목이 없습니다.</p>");
        renderTable(data, true); // 삭제 버튼 활성화
      }

      // ✅ 공통 테이블 렌더링 (삭제버튼 옵션)
      function renderTable(data, enableDelete = false) {
        let html = `
          <table>
            <thead>
              <tr>
                <th>순위</th>
                <th>닉네임</th>
                <th>종목명</th>
                <th>등록일</th>
                <th>등록종가</th>
                <th>현재가</th>
                <th>수익률</th>
                ${enableDelete ? "<th>관리</th>" : ""}
              </tr>
            </thead>
            <tbody>
        `;
        data.forEach((row, i) => {
          const rate = parseFloat(row["수익률"]);
          const color = rate >= 0 ? "#d32f2f" : "#1976d2";
          const sign = rate >= 0 ? "▲" : "▼";
          const nickname = row["닉네임"] || "익명";

          html += `
            <tr data-id="${row.id || ""}">
              <td>${i + 1}</td>
              <td>${SWINGINV.esc(nickname)}</td>
              <td style="text-align:left;">${SWINGINV.esc(row["종목명"])}</td>
              <td>${SWINGINV.fmtDate(row["등록일"])}</td>
              <td>${SWINGINV.nf(row["등록종가"])}</td>
              <td>${SWINGINV.nf(row["현재가"])}</td>
              <td style="font-weight:600;color:${color};">${sign}${Math.abs(rate).toFixed(2)}%</td>
              ${enableDelete
                ? `<td><button class="del-btn" data-code="${row['종목코드']}">삭제</button></td>`
                : ""}
            </tr>`;
        });

        html += "</tbody></table>";
        container.innerHTML = html;

        if (enableDelete) attachDeleteHandlers();
      }

      // ✅ 삭제 버튼 클릭 핸들러
      function attachDeleteHandlers() {
        document.querySelectorAll(".del-btn").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const code = btn.dataset.code;
            const user = SWINGINV.user;
            if (!user) return alert("로그인 후 이용해주세요.");
            if (!confirm("🗑️ 관심종목을 삭제하시겠습니까?")) return;

            const { error } = await db
              .from("watchlist")
              .delete()
              .eq("user_id", user.id)
              .eq("종목코드", code);

            if (error) {
              console.error(error);
              alert("삭제 실패: " + error.message);
            } else {
              alert("✅ 관심종목이 삭제되었습니다.");
              loadMyWatchlist(); // 새로고침
            }
          });
        });
      }

      // ✅ 기본 탭 로드
      loadRanking();
    });
  </script>
</body>
</html>
