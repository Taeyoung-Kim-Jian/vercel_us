<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>비밀번호 설정 | SWING INVESTOR</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./common.js"></script>
  <script src="./auth.js"></script>
  <style>
    body { font-family:"Noto Sans KR"; background:#f9fafb; display:flex; justify-content:center; align-items:center; height:100vh; margin:0 }
    .box { width:360px; background:white; padding:25px; border-radius:12px; box-shadow:0 3px 10px rgba(0,0,0,0.05) }
    input,button { width:100%; padding:10px; margin-bottom:10px; border-radius:6px; border:1px solid #ddd }
    button { background:#2563eb; color:white; border:none; cursor:pointer }
    #status { text-align:center; color:#555; font-size:13px; margin-bottom:10px }
  </style>
</head>
<body>
  <div class="box">
    <h2>비밀번호 설정</h2>
    <p id="status">이메일 인증 정보를 확인 중...</p>
    <input id="pw1" type="password" placeholder="새 비밀번호 (8자 이상)" />
    <input id="pw2" type="password" placeholder="비밀번호 확인" />
    <button id="saveBtn" disabled>비밀번호 저장</button>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const wait = (ms) => new Promise(r => setTimeout(r, ms));
      const status = document.getElementById("status");
      const btn = document.getElementById("saveBtn");

      let db;
      for (let i = 0; i < 20; i++) {
        if (window.SWINGINV?.db) {
          db = SWINGINV.db;
          break;
        }
        await wait(250);
      }
      if (!db) {
        status.textContent = "❌ Supabase 초기화 실패";
        return;
      }

      const hash = new URLSearchParams(location.hash.substring(1));
      const query = new URLSearchParams(location.search);
      const access_token = hash.get("access_token") || query.get("access_token");
      const refresh_token = hash.get("refresh_token") || query.get("refresh_token");
      const email = query.get("email");
      const nickname = decodeURIComponent(query.get("nickname") || "");

      if (!access_token || !refresh_token) {
        status.textContent = "⚠️ 이메일 인증 토큰 누락";
        return;
      }

      try {
        const { data, error } = await db.auth.setSession({ access_token, refresh_token });
        if (error || !data?.session) throw error;
        const { data: userInfo } = await db.auth.getUser();
        if (!userInfo || !userInfo.data || !userInfo.data.user) throw new Error("유저 정보 없음");

        status.textContent = `✅ 인증 완료: ${userInfo.data.user.email}`;
        btn.disabled = false;
      } catch (e) {
        status.textContent = "❌ 세션 설정 실패: " + e.message;
        return;
      }

      btn.onclick = async () => {
        const pw1 = document.getElementById("pw1").value.trim();
        const pw2 = document.getElementById("pw2").value.trim();
        if (pw1.length < 8) return alert("비밀번호는 8자 이상이어야 합니다.");
        if (pw1 !== pw2) return alert("비밀번호가 일치하지 않습니다.");

        try {
          const { error } = await db.auth.updateUser({ password: pw1 });
          if (error) throw error;

          const { data: userInfo } = await db.auth.getUser();
          const user = userInfo.data.user;

          if (nickname) {
            const { data: dup } = await db
              .from("profiles")
              .select("nickname")
              .eq("nickname", nickname);
            if (!dup || dup.length === 0) {
              await db.from("profiles").upsert({
                id: user.id,
                email,
                nickname
              });
            }
          }

          alert("✅ 비밀번호 설정 완료! 로그인 페이지로 이동합니다.");
          location.href = "login.html";
        } catch (e) {
          alert("❌ 비밀번호 설정 실패: " + e.message);
        }
      };
    });
  </script>
</body>
</html>
