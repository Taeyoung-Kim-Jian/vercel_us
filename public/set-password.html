<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>비밀번호 설정 | SWING INVESTOR</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./common.js"></script>
  <style>
    body { font-family:"Noto Sans KR"; background:#f9fafb; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
    .box { width:360px; background:white; padding:25px; border-radius:12px; box-shadow:0 3px 10px rgba(0,0,0,0.05); }
    h2 { text-align:center; font-size:1.2rem; margin-bottom:20px; }
    input { width:100%; padding:10px; border:1px solid #d1d5db; border-radius:6px; margin-bottom:12px; }
    button { width:100%; padding:10px; border:none; border-radius:6px; background:#2563eb; color:white; cursor:pointer; }
  </style>
</head>
<body>
  <div class="box">
    <h2>비밀번호 설정</h2>
    <input type="password" id="pw1" placeholder="새 비밀번호 (8자 이상)" />
    <input type="password" id="pw2" placeholder="비밀번호 확인" />
    <button id="setPwBtn">비밀번호 저장</button>
  </div>

  <script>
    const db = SWINGINV.db;
    const params = new URLSearchParams(location.search);
    const email = params.get("email");
    const nickname = params.get("nickname");

    document.getElementById("setPwBtn").addEventListener("click", async () => {
      const pw1 = document.getElementById("pw1").value;
      const pw2 = document.getElementById("pw2").value;
      if (pw1.length < 8) return alert("비밀번호는 8자 이상이어야 합니다.");
      if (pw1 !== pw2) return alert("비밀번호가 일치하지 않습니다.");

      // 이메일로 로그인 후 비밀번호 업데이트
      const { error } = await db.auth.signInWithPassword({ email, password: pw1 });
      if (error) return alert("이메일 인증 후 다시 시도해주세요.");

      await db.auth.updateUser({ password: pw1 });

      // 닉네임 저장
      await db.from("profiles").upsert({ id: db.auth.getUser().id, nickname });

      alert("✅ 비밀번호가 설정되었습니다. 로그인 후 이용하세요.");
      location.href = "login.html";
    });
  </script>
</body>
</html>
