<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>비밀번호 설정 | SWING INVESTOR</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./common.js"></script>
  <style>
    body { font-family:"Noto Sans KR"; background:#f9fafb; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
    .box { width:360px; background:white; padding:25px; border-radius:12px; box-shadow:0 3px 10px rgba(0,0,0,0.05); }
    h2 { text-align:center; font-size:1.2rem; margin-bottom:20px; }
    input { width:100%; padding:10px; border:1px solid #d1d5db; border-radius:6px; margin-bottom:12px; }
    button { width:100%; padding:10px; border:none; border-radius:6px; background:#2563eb; color:white; cursor:pointer; }
  </style>
</head>
<body>
  <div class="box">
    <h2>비밀번호 설정</h2>
    <p id="status" style="text-align:center;color:#555;font-size:13px;margin-bottom:12px;"></p>
    <input type="password" id="pw1" placeholder="새 비밀번호 (8자 이상)" />
    <input type="password" id="pw2" placeholder="비밀번호 확인" />
    <button id="setPwBtn">비밀번호 저장</button>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const db = SWINGINV.db;
      const params = new URLSearchParams(location.hash.substring(1)); // #access_token=... 추출
      const access_token = params.get("access_token");
      const refresh_token = params.get("refresh_token");
      const statusEl = document.getElementById("status");

      // ✅ URL에 access_token이 있다면 자동 로그인 처리
      if (access_token && refresh_token) {
        await db.auth.setSession({ access_token, refresh_token });
        statusEl.textContent = "✅ 이메일 인증이 완료되었습니다. 새 비밀번호를 설정하세요.";
      } else {
        statusEl.textContent = "⚠️ 이메일 인증 링크를 통해 접속해주세요.";
        document.getElementById("setPwBtn").disabled = true;
        return;
      }

      // ✅ 비밀번호 변경 버튼
      document.getElementById("setPwBtn").addEventListener("click", async () => {
        const pw1 = document.getElementById("pw1").value;
        const pw2 = document.getElementById("pw2").value;
        if (pw1.length < 8) return alert("비밀번호는 8자 이상이어야 합니다.");
        if (pw1 !== pw2) return alert("비밀번호가 일치하지 않습니다.");

        const { error } = await db.auth.updateUser({ password: pw1 });
        if (error) {
          alert("❌ 비밀번호 변경 실패: " + error.message);
          return;
        }

        alert("✅ 비밀번호가 성공적으로 설정되었습니다. 로그인 페이지로 이동합니다.");
        location.href = "login.html";
      });
    });
  </script>
</body>
</html>
