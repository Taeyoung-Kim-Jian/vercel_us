<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>비밀번호 설정 | SWING INVESTOR</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./common.js"></script>
<style>
body{font-family:"Noto Sans KR";display:flex;align-items:center;justify-content:center;height:100vh;background:#f9fafb;margin:0;}
.box{width:360px;background:#fff;padding:25px;border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,.05);}
input,button{width:100%;padding:10px;margin:5px 0;border-radius:6px;}
button{border:none;background:#2563eb;color:#fff;font-weight:500;cursor:pointer;}
#status{text-align:center;margin-bottom:10px;}
</style>
</head>
<body>
<div class="box">
<h2>비밀번호 설정</h2>
<p id="status">이메일 인증 확인 중...</p>
<input id="pw1" placeholder="새 비밀번호 (8자 이상)" type="password">
<input id="pw2" placeholder="비밀번호 확인" type="password">
<button id="setPwBtn" disabled>비밀번호 저장</button>
</div>

<script>
document.addEventListener("DOMContentLoaded",async()=>{
  const wait=(ms)=>new Promise(r=>setTimeout(r,ms));
  let db;
  for(let i=0;i<20;i++){if(window.SWINGINV?.db){db=SWINGINV.db;break;}await wait(250);}
  const status=document.getElementById("status");
  const btn=document.getElementById("setPwBtn");
  const hash=new URLSearchParams(location.hash.substring(1));
  const query=new URLSearchParams(location.search);
  const access_token=hash.get("access_token")||query.get("access_token");
  const refresh_token=hash.get("refresh_token")||query.get("refresh_token");
  const email=query.get("email");const nickname=decodeURIComponent(query.get("nickname")||"");

  if(!access_token||!refresh_token){status.textContent="❌ 토큰 없음";return;}

  try{
    const {data,error}=await db.auth.setSession({access_token,refresh_token});
    if(error)throw error;
    status.textContent="✅ 인증완료. 비밀번호 입력하세요.";
    btn.disabled=false;
  }catch(err){status.textContent="❌ 세션설정실패 "+err.message;return;}

  btn.onclick=async()=>{
    const pw1=document.getElementById("pw1").value.trim();
    const pw2=document.getElementById("pw2").value.trim();
    if(pw1.length<8)return alert("8자 이상 입력");
    if(pw1!==pw2)return alert("비밀번호 불일치");
    try{
      const {error}=await db.auth.updateUser({password:pw1});
      if(error)throw error;
      const user=(await db.auth.getUser()).data.user;
      if(user&&nickname){
        const {data:dup}=await db.from("profiles").select("nickname").eq("nickname",nickname);
        if(!dup||dup.length===0)
          await db.from("profiles").upsert({id:user.id,email,nickname});
      }
      alert("✅ 비밀번호 설정 완료. 로그인하세요.");
      location.href="login.html";
    }catch(err){alert("❌ 비밀번호 저장 실패: "+err.message);}
  };
});
</script>
</body>
</html>
