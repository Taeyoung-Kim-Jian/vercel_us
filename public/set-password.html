<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>비밀번호 설정 | SWING INVESTOR</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./common.js"></script>
  <style>
    body { font-family:"Noto Sans KR"; background:#f9fafb; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
    .box { width:360px; background:white; padding:25px; border-radius:12px; box-shadow:0 3px 10px rgba(0,0,0,0.05); }
    h2 { text-align:center; font-size:1.2rem; margin-bottom:20px; }
    input { width:100%; padding:10px; border:1px solid #d1d5db; border-radius:6px; margin-bottom:12px; }
    button { width:100%; padding:10px; border:none; border-radius:6px; background:#2563eb; color:white; cursor:pointer; font-weight:500; }
    #status { text-align:center; color:#444; font-size:13px; margin-bottom:15px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>비밀번호 설정</h2>
    <p id="status">이메일 인증 정보를 확인 중...</p>
    <input type="password" id="pw1" placeholder="새 비밀번호 (8자 이상)" />
    <input type="password" id="pw2" placeholder="비밀번호 확인" />
    <button id="setPwBtn">비밀번호 저장</button>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const db = SWINGINV.db;
      const statusEl = document.getElementById("status");
      const btn = document.getElementById("setPwBtn");

      // ✅ Supabase redirect 시 URL 형태 예시:
      // https://example.com/set-password.html#access_token=xxx&refresh_token=yyy&type=recovery
      const hashParams = new URLSearchParams(window.location.hash.substring(1));
      const access_token = hashParams.get("access_token");
      const refresh_token = hashParams.get("refresh_token");

      if (access_token && refresh_token) {
        try {
          await db.auth.setSession({ access_token, refresh_token });
          statusEl.textContent = "✅ 이메일 인증이 확인되었습니다. 새 비밀번호를 설정하세요.";
          btn.disabled = false;
        } catch (err) {
          statusEl.textContent = "❌ 인증 세션 설정 실패. 다시 이메일 링크로 접속해주세요.";
          btn.disabled = true;
          return;
        }
      } else {
        statusEl.textContent = "⚠️ 이메일 인증 링크를 통해 접속해야 합니다.";
        btn.disabled = true;
        return;
      }

      // ✅ 비밀번호 저장 로직
      btn.addEventListener("click", async () => {
        const pw1 = document.getElementById("pw1").value.trim();
        const pw2 = document.getElementById("pw2").value.trim();

        if (pw1.length < 8) {
          alert("비밀번호는 8자 이상이어야 합니다.");
          return;
        }
        if (pw1 !== pw2) {
          alert("비밀번호가 일치하지 않습니다.");
          return;
        }

        try {
          const { error } = await db.auth.updateUser({ password: pw1 });
          if (error) throw error;
          alert("✅ 비밀번호가 성공적으로 설정되었습니다. 로그인 페이지로 이동합니다.");
          window.location.href = "login.html";
        } catch (err) {
          alert("❌ 비밀번호 변경 실패: " + err.message);
        }
      });
    });
  </script>
</body>
</html>
