<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>전체 성과 | SWING INVESTOR</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <!-- ✅ 공통 헤더 -->
  <div id="header-container"></div>
  <script src="./common.js"></script>
  <script>
    fetch("./header.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("header-container").innerHTML = html;
        if (typeof SWINGINV_updateHeaderAuthUI === "function")
          SWINGINV_updateHeaderAuthUI();
      });
  </script>

  <main class="content">
    <h2>📊 전체 성과 리스트</h2>
    <p style="color:#555;">모든 종목의 누적 수익률을 확인할 수 있습니다.</p>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>순위</th>
            <th>종목명</th>
            <th>코드</th>
            <th>시작가</th>
            <th>현재가</th>
            <th>수익률</th>
            <th>기간</th>
          </tr>
        </thead>
        <tbody id="total-list-body">
          <tr><td colspan="7" style="text-align:center;">⏳ 로딩 중...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer>© 2025 SWING INVESTOR | 데이터 제공: Supabase</footer>

  <script src="./total.js"></script>
</body>
</html>
