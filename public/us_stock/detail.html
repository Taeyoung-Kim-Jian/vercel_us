<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>종목 상세 | SWING INVESTOR</title>

  <!-- CSS -->
  <link rel="stylesheet" href="../style.css" />

  <!-- 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5"></script>

  <!-- common.js -->
  <script src="../common.js"></script>

  <style>
    body {
      font-family: "Pretendard", sans-serif;
      background: #f8fafc;
      margin: 0;
      padding: 0;
      overflow-y: auto;
    }
    main {
      max-width: 1100px;
      margin: 30px auto;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
      padding: 20px;
    }
    h2 { color: #1e293b; text-align:center; margin-bottom:10px; }
    p#subtitle { text-align:center; color:#64748b; font-size:0.9rem; }
    #toolbar { display:flex; justify-content:center; align-items:center; flex-wrap:wrap; gap:15px; margin:15px 0 25px 0; font-size:14px; }
    #toolbar label { cursor:pointer; }
    #toolbar input[type="checkbox"] { transform:scale(1.1); margin-right:5px; }
    #chart { width:100%; height:500px; margin-top:20px; touch-action: pan-y; }
    #backBtn { display:inline-block; background:#2563eb; color:#fff; border:none; border-radius:6px; padding:6px 12px; font-size:14px; cursor:pointer; margin-bottom:15px; }
    #backBtn:hover { background:#1d4ed8; }
    #error-box { margin-top:20px; color:red; text-align:center; }
    footer { text-align:center; padding:16px; font-size:0.8rem; color:#777; background:#f1f5f9; border-top:1px solid #e5e7eb; margin-top:50px; }
    @media (max-width:768px) { #chart { height:400px; } }
  </style>
</head>

<body>
  <!-- Header -->
  <div id="header-container"></div>
  <script>
    fetch("./us_header.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("header-container").innerHTML = html;
        if (typeof SWINGINV_updateHeaderAuthUI === "function") SWINGINV_updateHeaderAuthUI();
      });
  </script>

  <main>
    <button id="backBtn">← 뒤로가기</button>
    <h2 id="chart-title">📈 종목 상세</h2>
    <p id="subtitle">데이터를 불러오는 중...</p>

    <div id="toolbar">
      <label><input type="checkbox" id="toggleB" checked> B가격 표시</label>
      <label><input type="checkbox" id="watchToggle"> ⭐ 관심종목 등록</label>
    </div>

    <div id="chart"></div>
    <div id="error-box" style="display:none;"></div>
  </main>

  <footer>© 2025 SWING INVESTOR | 데이터 제공: Supabase</footer>

  <!-- JS 코드 통합 -->
  <script>
  document.addEventListener("DOMContentLoaded", async () => {
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const name = decodeURIComponent(params.get("name") || "종목");

    const titleEl = document.getElementById("chart-title");
    const subEl = document.getElementById("subtitle");
    const errBox = document.getElementById("error-box");
    const chartEl = document.getElementById("chart");

    // 뒤로가기
    document.getElementById("backBtn").addEventListener("click", () => history.back());

    titleEl.textContent = `📈 ${name} (${code || "?"})`;
    subEl.textContent = "가격 데이터를 불러오는 중...";

    // Supabase 로드 대기
    let db;
    for (let i=0; i<25; i++) {
      if (window.SWINGINV?.db) { db = SWINGINV.db; break; }
      await new Promise(r => setTimeout(r, 200));
    }
    if (!db) {
      errBox.style.display="block";
      errBox.textContent="❌ Supabase 초기화 실패";
      return;
    }

    // 로그인 세션
    const { data: { session } } = await db.auth.getSession();
    const user = session?.user || null;
    if (user) SWINGINV.user = user;

    try {
      // 가격 데이터 로드
      const { data, error } = await db
        .from("us_prices")
        .select("날짜, 종가")
        .eq("종목코드", code)
        .order("날짜", { ascending:true });

      if (error) throw error;
      if (!data?.length) { subEl.textContent="📭 데이터가 없습니다."; return; }

      const dates = data.map(d => d.날짜);
      const closes = data.map(d => parseFloat(d.종가));

      // B가격
      const { data: btData } = await db
        .from("us_bt_points")
        .select("b가격")
        .eq("종목코드", code);
      const bLines = Array.from(new Set(btData?.map(b => parseFloat(b.b가격)) || []));

      // ECharts 초기화
      const chart = echarts.init(chartEl);
      let showBLines = true;

      const baseOption = {
        tooltip: { trigger: "axis" },
        xAxis: { type:"category", data:dates, boundaryGap:false },
        yAxis: { type:"value", scale:true },
        grid: { left:50, right:20, top:40, bottom:60 },
        dataZoom: [
          { type:"inside", start:0, end:100 },
          { type:"slider", start:0, end:100 }
        ],
        series: [{
          id:"main-series",
          name:"종가",
          type:"line",
          data: closes,
          smooth:true,
          symbol:"none",
          lineStyle:{ color:"#2563eb", width:2 },
          areaStyle:{ color:"rgba(37,99,235,0.1)" }
        }]
      };
      chart.setOption(baseOption);

      // B가격 업데이트 함수
      const updateChart = () => {
        const marks = showBLines
          ? bLines.map(v => ({
              yAxis:v,
              lineStyle:{ type:"dashed", color:"#e11d48" },
              label:{ formatter:`B ${v.toLocaleString()}` }
            }))
          : [];
        chart.setOption(
          { series:[{ id:"main-series", markLine:marks.length ? { symbol:"none", label:{ show:true }, data:marks } : { data:[] } }] },
          false, true
        );
      };

      // B가격 토글
      document.getElementById("toggleB").addEventListener("change", e => {
        showBLines = e.target.checked;
        updateChart();
      });

      // 관심종목 체크 & 등록/삭제
      const watchToggle = document.getElementById("watchToggle");
      if (user) {
        const { data: exist } = await db
          .from("watchlist")
          .select("id")
          .eq("user_id", user.id)
          .eq("종목코드", code)
          .maybeSingle();
        if (exist) watchToggle.checked = true;
      }

      watchToggle.addEventListener("change", async (e) => {
        if (!SWINGINV.user) { alert("🔐 로그인 후 이용해주세요."); e.target.checked=false; return; }

        if (e.target.checked) {
          const latestPrice = closes[closes.length-1];
          const nickname = (await db.from("profiles").select("nickname").eq("id", SWINGINV.user.id).single()).data?.nickname;
          const { error } = await db.from("watchlist").insert({
            user_id:SWINGINV.user.id,
            닉네임:nickname || "익명",
            종목명:name,
            종목코드:code,
            등록일:new Date().toISOString(),
            등록종가:latestPrice,
            공개여부:true
          });
          if (error) alert("❌ 등록 실패: "+error.message);
          else alert("⭐ 관심종목으로 등록되었습니다!");
        } else {
          if (confirm("🗑️ 관심종목에서 삭제하시겠습니까?")) {
            await db.from("watchlist").delete().eq("user_id", SWINGINV.user.id).eq("종목코드", code);
            alert("🗑️ 삭제되었습니다.");
          } else {
            e.target.checked=true;
          }
        }
      });

      // 초기 차트 렌더
      updateChart();
      window.addEventListener("resize", ()=>chart.resize());

    } catch (err) {
      console.error("❌ detail.js 오류:", err);
      errBox.style.display="block";
      errBox.textContent="데이터 로드 실패";
    }
  });
  </script>
</body>
</html>
