<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>US 스윙 종목 | SWING INVESTOR</title>
  <link rel="stylesheet" href="../style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../common.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5"></script>
</head>
<body>
  <!-- ✅ US 전용 헤더 -->
  <div id="header-container"></div>
  <script>
    fetch("./us_header.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("header-container").innerHTML = html;
        if (typeof SWINGINV_updateHeaderAuthUI === "function") SWINGINV_updateHeaderAuthUI();
      });
  </script>

  <main class="content">
    <h2>💰 US 스윙 종목</h2>
    <p style="color:#555;">적정 매수가에 근접한(괴리율 ±5% 이내) US 스윙 종목을 확인하세요.</p>

    <!-- ✅ 패턴 필터 버튼 -->
    <div class="pattern-filter">
      <button class="active" data-pattern="전체">전체</button>
      <button data-pattern="돌파">돌파</button>
      <button data-pattern="돌파눌림">돌파눌림</button>
      <button data-pattern="박스권">박스권</button>
      <button data-pattern="이탈">이탈</button>
      <button data-pattern="기타">기타</button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>종목명</th>
            <th>종목코드</th>
            <th>적정 매수가</th>
            <th>현재가</th>
            <th>괴리율</th>
            <th>패턴</th>
          </tr>
        </thead>
        <tbody id="proper-tbody">
          <tr><td colspan="6" style="text-align:center;">⏳ 데이터를 불러오는 중...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer>© 2025 SWING INVESTOR | 데이터 제공: Supabase</footer>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      await new Promise(resolve => {
        const interval = setInterval(() => {
            if (window.SWINGINV?.db) { clearInterval(interval); resolve(); }
        }, 100);
      });

      const tbody = document.getElementById("proper-tbody");
      const filterButtons = document.querySelectorAll(".pattern-filter button");

      try {
        // 1. us_swing_proper_view에서 데이터를 가져옵니다.
        const { data, error } = await SWINGINV.db
          .from("us_swing_proper_view")
          .select("종목코드, 종목명, 적정매수가, 현재가, 괴리율, pattern");

        if (error) throw error;

        if (!data || data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">📭 현재 조건에 맞는 종목이 없습니다.</td></tr>`;
          return;
        }

        // 2. 테이블 렌더링 함수
        function renderTable(filterPattern = "전체") {
          const filteredData = (filterPattern === "전체")
            ? data
            : data.filter(r => (r.pattern || "기타") === filterPattern);

          if (filteredData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">📭 '${filterPattern}' 패턴에 해당하는 종목이 없습니다.</td></tr>`;
            return;
          }

          tbody.innerHTML = filteredData.map(r => `
            <tr class="clickable-row" data-code="${SWINGINV.esc(r.종목코드)}" data-name="${SWINGINV.esc(r.종목명)}">
              <td class="clickable-name" data-code="${SWINGINV.esc(r.종목코드)}" data-name="${SWINGINV.esc(r.종목명)}">${SWINGINV.esc(r.종목명)}</td>
              <td>${SWINGINV.esc(r.종목코드)}</td>
              <td class="number-cell">$${SWINGINV.nf(r.적정매수가)}</td>
              <td class="number-cell">$${SWINGINV.nf(r.현재가)}</td>
              <td>${SWINGINV.fmtPct(r.괴리율)}</td>
              <td>${r.pattern || "기타"}</td>
            </tr>
          `).join('');

          bindStockClickEvents();
        }

        // 3. 필터 버튼 이벤트 리스너 추가
        filterButtons.forEach(btn => {
          btn.addEventListener("click", () => {
            filterButtons.forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            renderTable(btn.dataset.pattern);
          });
        });

        // 초기 렌더링
        renderTable();

      } catch (err) {
        console.error("❌ 데이터 로드 오류:", err);
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:red;">❌ 데이터를 불러오는 데 실패했습니다: ${err.message}</td></tr>`;
      }
    });
  </script>
  <script src="./us_modal.js"></script>
</body>
</html>
