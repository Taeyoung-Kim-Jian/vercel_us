<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>US 전체 성과 | SWING INVESTOR</title>
  <link rel="stylesheet" href="../style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../common.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5"></script>
</head>

<body>
  <!-- ✅ 공통 헤더 -->
  <div id="header-container"></div>
  <script>
    fetch("./us_header.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("header-container").innerHTML = html;
        if (typeof SWINGINV_updateHeaderAuthUI === "function") SWINGINV_updateHeaderAuthUI();
      });
  </script>

  <main class="content">
    <h2>📊 US 전체 종목 성과</h2>
    <p style="color:#555;">모든 US 종목의 누적 수익률을 확인하고 상세 차트로 이동하세요.</p>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>순위</th>
            <th>종목명</th>
            <th>종목코드</th>
            <th>현재가</th>
            <th>수익률</th>
          </tr>
        </thead>
        <tbody id="us-total-body">
          <tr><td colspan="5" style="text-align:center;">⏳ 로딩 중...</td></tr>
        </tbody>
      </table>
    </div>
    <div class="load-more-container">
      <button id="loadMoreBtn">더보기</button>
    </div>
  </main>

  <footer>© 2025 SWING INVESTOR | 데이터 제공: Supabase</footer>

  <script>
    async function waitForSwingInv() {
      return new Promise(resolve => {
        const check = () => {
          if(window.SWINGINV?.db) resolve();
          else setTimeout(check, 100);
        };
        check();
      });
    }

    document.addEventListener("DOMContentLoaded", async () => {
      await waitForSwingInv();

      const tbody = document.getElementById("us-total-body");
      const loadMoreBtn = document.getElementById("loadMoreBtn");
      const PAGE_SIZE = 30;
      let currentPage = 0;
      let isLoading = false;

      async function loadTotalReturn(page) {
        if (isLoading) return;
        isLoading = true;
        loadMoreBtn.textContent = "⏳ 로딩 중...";
        loadMoreBtn.disabled = true;

        try {
          const from = page * PAGE_SIZE;
          const to = from + PAGE_SIZE - 1;

          // 1. us_total_return 뷰에서 수익률 순으로 30개씩 데이터를 가져옵니다.
          const { data, error } = await SWINGINV.db
            .from("us_total_return")
            .select("종목코드, 종목명, 현재가, 수익률")
            .order("수익률", { ascending: false })
            .range(from, to);

          if (error) throw error;

          if (page === 0 && (!data || data.length === 0)) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">📭 표시할 데이터가 없습니다.</td></tr>`;
            loadMoreBtn.style.display = "none";
            return;
          }

          // 2. 테이블에 데이터를 추가로 렌더링합니다.
          const newRows = data.map((r, i) => {
            const rank = from + i + 1;
            return `
              <tr class="clickable-row" data-code="${SWINGINV.esc(r.종목코드)}" data-name="${SWINGINV.esc(r.종목명)}">
                <td>${rank}</td>
                <td class="clickable-name" data-code="${SWINGINV.esc(r.종목코드)}" data-name="${SWINGINV.esc(r.종목명)}">${SWINGINV.esc(r.종목명)}</td>
                <td>${SWINGINV.esc(r.종목코드)}</td>
                <td class="number-cell">$${SWINGINV.nf(r.현재가)}</td>
                <td>${SWINGINV.fmtPct(r.수익률)}</td>
              </tr>
            `;
          }).join("");

          if (page === 0) tbody.innerHTML = ""; // 첫 페이지 로드 시 "로딩 중" 메시지 제거
          tbody.insertAdjacentHTML("beforeend", newRows);

          bindStockClickEvents();

          // 더 이상 로드할 데이터가 없으면 '더보기' 버튼 숨김
          if (data.length < PAGE_SIZE) {
            loadMoreBtn.style.display = "none";
          }
        } catch (err) {
          console.error("❌ 데이터 로드 오류:", err);
          tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:red;">❌ 불러오기 실패: ${err.message}</td></tr>`;
        } finally {
          isLoading = false;
          loadMoreBtn.textContent = "더보기";
          loadMoreBtn.disabled = false;
        }
      }

      // '더보기' 버튼 클릭 이벤트
      loadMoreBtn.addEventListener("click", () => {
        currentPage++;
        loadTotalReturn(currentPage);
      });

      // 첫 페이지 데이터 로드
      loadTotalReturn(currentPage);
    });
  </script>
  <script src="./us_modal.js"></script>
</body>
</html>
