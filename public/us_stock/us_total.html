
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>전체 성과 | SWING INVESTOR</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- ✅ 공통 헤더 -->
  <div id="header-container"></div>

  <main class="content">
    <h2>📊 전체 성과 리스트</h2>
    <p style="color:#555;">모든 종목의 누적 수익률을 확인할 수 있습니다.</p>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>순위</th>
            <th>종목명</th>
            <th>시작가</th>
            <th>현재가</th>
            <th>수익률</th>
          </tr>
        </thead>
        <tbody id="total-list-body">
          <tr><td colspan="7" style="text-align:center;">⏳ 로딩 중...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer>© 2025 SWING INVESTOR | 데이터 제공: Supabase</footer>

  <script>
    // -------------------------------
    // Supabase 연결
    // -------------------------------
    const SUPABASE_URL = "https://sssmldmhcfuodutvvcqf.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNzc21sZG1oY2Z1dHZ2Y3FmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk1MDc2MjUsImV4cCI6MjA3NTA4MzYyNX0.zxw9Hr9Mz9fuV9VIpFcISe-62kary1WABTrOnYZiIN4";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // -------------------------------
    // 헤더 로드
    // -------------------------------
    async function loadHeader() {
      const res = await fetch("./header.html");
      const html = await res.text();
      document.getElementById("header-container").innerHTML = html;
    }

    // -------------------------------
    // 전체 종목 + 가격 데이터 조회
    // -------------------------------
    async function loadTotalPerformance() {
      const tbody = document.getElementById("total-list-body");
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;">⏳ 전체 데이터를 불러오는 중...</td></tr>`;

      try {
        // 1️⃣ 전체 종목
        const { data: stocks, error: stockErr } = await supabase
          .from("us_stocks")
          .select("종목코드, 종목명");

        if (stockErr) throw stockErr;
        if (!stocks || stocks.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;">📭 종목 데이터가 없습니다.</td></tr>`;
          return;
        }

        // 2️⃣ 각 종목의 시작가, 현재가 계산
        const records = [];
        for (const s of stocks) {
          const { data: prices, error: priceErr } = await supabase
            .from("us_prices")
            .select("날짜, 종가")
            .eq("종목코드", s.종목코드)
            .order("날짜", { ascending: true });

          if (priceErr || !prices || prices.length === 0) continue;

          const startPrice = parseFloat(prices[0].종가);
          const currentPrice = parseFloat(prices[prices.length - 1].종가);
          const rate = ((currentPrice - startPrice) / startPrice) * 100;

          records.push({
            code: s.종목코드,
            name: s.종목명,
            startPrice,
            currentPrice,
            rate
          });
        }

        // 3️⃣ 수익률 기준 내림차순 정렬
        records.sort((a, b) => b.rate - a.rate);

        // 4️⃣ 테이블 렌더링
        tbody.innerHTML = records.map((r, i) => {
          const rateColor = r.rate >= 0 ? "#d32f2f" : "#1976d2";
          const rateSign = r.rate >= 0 ? "▲" : "▼";
          return `
            <tr class="clickable-row" data-code="${r.code}" data-name="${r.name}">
              <td>${i + 1}</td>
              <td>${r.name}</td>
              <td style="text-align:center;">${r.startPrice.toLocaleString()}</td>
              <td style="text-align:center;">${r.currentPrice.toLocaleString()}</td>
              <td style="text-align:center; color:${rateColor}; font-weight:500;">
                ${rateSign}${Math.abs(r.rate).toFixed(2)}%
              </td>
            </tr>
          `;
        }).join("");

        // 5️⃣ 클릭 시 detail.html로 이동
        document.querySelectorAll(".clickable-row").forEach(row => {
          row.addEventListener("click", () => {
            const code = row.dataset.code;
            const name = row.dataset.name;
            if (!code || !name) return;
            location.href = `detail.html?code=${encodeURIComponent(code)}&name=${encodeURIComponent(name)}`;
          });
        });

      } catch (err) {
        console.error("❌ 데이터 로드 오류:", err);
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:red;">❌ 불러오기 실패: ${err.message}</td></tr>`;
      }
    }

    // -------------------------------
    // 초기화
    // -------------------------------
    document.addEventListener("DOMContentLoaded", async () => {
      await loadHeader();
      await loadTotalPerformance();
    });
  </script>
</body>
</html>
